<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KeuanganKu AI - Pencatatan Keuangan & Scan Nota</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Supabase Client JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            -webkit-tap-highlight-color: transparent;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fadeIn {
            animation: fadeIn 0.25s ease-out forwards;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.9);
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.04);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 99px;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const DEFAULT_ACCOUNTS = [
            { id: 'acc_bca', name: 'Bank BCA', type: 'Bank', balance: 7500000, color: 'bg-blue-600' },
            { id: 'acc_gopay', name: 'GoPay', type: 'E-Wallet', balance: 650000, color: 'bg-emerald-600' },
            { id: 'acc_cash', name: 'Uang Tunai / Cash', type: 'Cash', balance: 420000, color: 'bg-amber-500' }
        ];

        const DEFAULT_EXPENSE_CATEGORIES = [
            'Makanan & Minuman',
            'Belanja & Groceries',
            'Transportasi',
            'Tagihan & Utilitas',
            'Hiburan & Gaya Hidup',
            'Kesehatan & Kecantikan',
            'Pendidikan',
            'Pengeluaran Lainnya'
        ];

        const DEFAULT_INCOME_CATEGORIES = [
            'Gaji / Payroll',
            'Bonus & Insentif',
            'Hasil Usaha / Freelance',
            'Investasi & Dividen',
            'Hadiah & Grants',
            'Pemasukan Lainnya'
        ];

        const getOffsetDate = (daysAgo) => {
            const d = new Date();
            d.setDate(d.getDate() - daysAgo);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };

        const INITIAL_TRANSACTIONS = [
            { id: 'tx_1', date: getOffsetDate(0), type: 'EXPENSE', amount: 45000, accountId: 'acc_gopay', category: 'Makanan & Minuman', note: 'Kopi & Snack Hari Ini', items: [{ name: 'Kopi Americano', qty: 1, price: 30000 }, { name: 'Croissant', qty: 1, price: 15000 }] },
            { id: 'tx_2', date: getOffsetDate(1), type: 'EXPENSE', amount: 125000, accountId: 'acc_bca', category: 'Belanja & Groceries', note: 'Belanja Bahan Makanan', items: [{ name: 'Minyak Goreng 2L', qty: 1, price: 35000 }, { name: 'Beras 5kg', qty: 1, price: 72000 }, { name: 'Telur Ayam 1kg', qty: 1, price: 18000 }] },
            { id: 'tx_3', date: getOffsetDate(3), type: 'EXPENSE', amount: 350000, accountId: 'acc_bca', category: 'Belanja & Groceries', note: 'Belanja Supermarket' },
            { id: 'tx_4', date: getOffsetDate(5), type: 'TRANSFER', amount: 200000, accountId: 'acc_bca', toAccountId: 'acc_gopay', category: 'Transfer Internal', note: 'Top up GoPay', adminFee: 1000 },
            { id: 'tx_5', date: getOffsetDate(12), type: 'EXPENSE', amount: 450000, accountId: 'acc_bca', category: 'Tagihan & Utilitas', note: 'Tagihan Listrik & Wifi' },
            { id: 'tx_6', date: getOffsetDate(20), type: 'INCOME', amount: 7500000, accountId: 'acc_bca', category: 'Gaji / Payroll', note: 'Gaji Bulanan' },
            { id: 'tx_7', date: getOffsetDate(25), type: 'INCOME', amount: 1500000, accountId: 'acc_bca', category: 'Bonus & Insentif', note: 'Bonus Project Freelance' }
        ];

        const formatIDR = (num) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num || 0);
        };

        function App() {
            const [activeTab, setActiveTab] = useState('dashboard');
            const [accounts, setAccounts] = useState(() => JSON.parse(localStorage.getItem('keuanganku_accounts')) || DEFAULT_ACCOUNTS);
            const [transactions, setTransactions] = useState(() => JSON.parse(localStorage.getItem('keuanganku_transactions')) || INITIAL_TRANSACTIONS);
            
            const [expenseCategories, setExpenseCategories] = useState(() => JSON.parse(localStorage.getItem('keuanganku_expense_categories')) || DEFAULT_EXPENSE_CATEGORIES);
            const [incomeCategories, setIncomeCategories] = useState(() => JSON.parse(localStorage.getItem('keuanganku_income_categories')) || DEFAULT_INCOME_CATEGORIES);

            const DEFAULT_SUPABASE_URL = 'https://fqaewybhgsxlkgkvjnjv.supabase.co';
            const DEFAULT_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxYWV3eWJoZ3N4bGtna3Zqbmp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyODc4MzQsImV4cCI6MjEwNjg2MzgzNH0.s4Frl_Mpj77Fc321j7MWykvxaXA7XWkKjWzJKEn-LXE';
            const DEFAULT_SHEETS_WEBHOOK = 'https://script.google.com/macros/s/AKfycbxL9JzrgsCcd9cQiPWzxIOjeT_MDtCYL97t44dgpIeUAiU6MbVWfjRwMtzuSGvUFtMv/exec';

            const [supabaseUrl, setSupabaseUrl] = useState(() => localStorage.getItem('supabase_url') || DEFAULT_SUPABASE_URL);
            const [supabaseKey, setSupabaseKey] = useState(() => localStorage.getItem('supabase_key') || DEFAULT_SUPABASE_KEY);
            const [sheetsWebhookUrl, setSheetsWebhookUrl] = useState(() => localStorage.getItem('sheets_webhook_url') || DEFAULT_SHEETS_WEBHOOK);
            const [geminiApiKey, setGeminiApiKey] = useState(() => localStorage.getItem('gemini_api_key') || 'AQ.Ab8RN6K18UNgnft_iPYHO4tliXVGizzQo3FvGkxCtMUWu7hoow');

            const [isSupabaseConnected, setIsSupabaseConnected] = useState(false);
            const [supabaseClient, setSupabaseClient] = useState(null);
            const [toastMessage, setToastMessage] = useState(null);

            useEffect(() => {
                localStorage.setItem('keuanganku_accounts', JSON.stringify(accounts));
            }, [accounts]);

            useEffect(() => {
                localStorage.setItem('keuanganku_transactions', JSON.stringify(transactions));
            }, [transactions]);

            useEffect(() => {
                localStorage.setItem('keuanganku_expense_categories', JSON.stringify(expenseCategories));
            }, [expenseCategories]);

            useEffect(() => {
                localStorage.setItem('keuanganku_income_categories', JSON.stringify(incomeCategories));
            }, [incomeCategories]);

            useEffect(() => {
                if (supabaseUrl && supabaseKey && window.supabase) {
                    try {
                        const client = window.supabase.createClient(supabaseUrl, supabaseKey);
                        setSupabaseClient(client);
                        setIsSupabaseConnected(true);
                    } catch (err) {
                        console.warn("Supabase Connection Note:", err);
                        setIsSupabaseConnected(false);
                    }
                }
            }, [supabaseUrl, supabaseKey]);

            useEffect(() => {
                if (window.lucide && typeof window.lucide.createIcons === 'function') {
                    window.lucide.createIcons();
                }
            }, [activeTab, transactions, accounts]);

            const showToast = (msg, type = 'success') => {
                setToastMessage({ msg, type });
                setTimeout(() => setToastMessage(null), 3500);
            };

            const totalBalance = useMemo(() => {
                return accounts.reduce((acc, a) => acc + Number(a.balance || 0), 0);
            }, [accounts]);

            const handleAddTransaction = (newTx) => {
                const createdTx = { 
                    ...newTx, 
                    id: 'tx_' + Date.now(),
                    items: newTx.items || [] 
                };
                setTransactions(prev => [createdTx, ...prev]);

                setAccounts(prev => prev.map(acc => {
                    let newBal = acc.balance;
                    if (newTx.type === 'INCOME' && acc.id === newTx.accountId) {
                        newBal += Number(newTx.amount);
                    } else if (newTx.type === 'EXPENSE' && acc.id === newTx.accountId) {
                        newBal -= Number(newTx.amount);
                    } else if (newTx.type === 'TRANSFER') {
                        if (acc.id === newTx.accountId) {
                            newBal -= (Number(newTx.amount) + Number(newTx.adminFee || 0));
                        }
                        if (acc.id === newTx.toAccountId) {
                            newBal += Number(newTx.amount);
                        }
                    }
                    return { ...acc, balance: newBal };
                }));

                // Sync to Supabase
                if (supabaseClient) {
                    supabaseClient.from('transactions').insert([{
                        id: createdTx.id,
                        type: createdTx.type,
                        amount: createdTx.amount,
                        account_id: createdTx.accountId,
                        to_account_id: createdTx.toAccountId || null,
                        category: createdTx.category,
                        date: createdTx.date,
                        note: createdTx.note || '',
                        admin_fee: createdTx.adminFee || 0
                    }]).then(({ error }) => {
                        if (error) console.warn("Supabase tx sync notice:", error);

                        // Save items to transaction_items table in Supabase
                        if (!error && createdTx.items && createdTx.items.length > 0) {
                            const itemsPayload = createdTx.items.map((item, idx) => ({
                                id: `item_${Date.now()}_${idx}`,
                                transaction_id: createdTx.id,
                                name: item.name,
                                qty: Number(item.qty) || 1,
                                price: Number(item.price) || 0
                            }));
                            supabaseClient.from('transaction_items').insert(itemsPayload).then(({ error: itemErr }) => {
                                if (itemErr) console.warn("Supabase transaction_items sync notice:", itemErr);
                            });
                        }
                    });
                }

                // Sync to Google Sheets Webhook
                if (sheetsWebhookUrl) {
                    const accName = accounts.find(a => a.id === createdTx.accountId)?.name || '-';
                    const toAccName = createdTx.toAccountId ? (accounts.find(a => a.id === createdTx.toAccountId)?.name || '-') : '-';
                    
                    fetch(sheetsWebhookUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            id: createdTx.id,
                            date: createdTx.date,
                            type: createdTx.type,
                            amount: createdTx.amount,
                            account: accName,
                            to_account: toAccName,
                            category: createdTx.category,
                            note: createdTx.note || '-',
                            admin_fee: createdTx.adminFee || 0,
                            items: createdTx.items || []
                        })
                    }).catch(err => console.warn('Google Sheets Webhook Sync Notice:', err));
                }

                showToast('✨ Transaksi berhasil disimpan!');
            };

            return (
                <div className="min-h-screen flex flex-col pb-24 lg:pb-6">
                    <header className="sticky top-0 z-30 bg-white/90 backdrop-blur-md border-b border-slate-200/80 px-4 py-3 sm:px-6">
                        <div className="max-w-5xl mx-auto flex items-center justify-between">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-violet-600 to-indigo-600 flex items-center justify-center text-white shadow-md shadow-violet-500/20">
                                    <i data-lucide="sparkles" className="w-5 h-5"></i>
                                </div>
                                <div>
                                    <h1 className="font-extrabold text-slate-900 text-base tracking-tight leading-none">KeuanganKu <span className="text-violet-600">AI</span></h1>
                                    <p className="text-[11px] text-slate-500 font-semibold">Pencatatan Finansial Pintar</p>
                                </div>
                            </div>

                            <div className="text-right">
                                <span className="text-[10px] font-black uppercase tracking-wider text-slate-400 block">Total Aset</span>
                                <span className="font-black text-base sm:text-lg text-slate-900">{formatIDR(totalBalance)}</span>
                            </div>
                        </div>
                    </header>

                    {toastMessage && (
                        <div className={`fixed top-16 right-4 z-50 text-white text-xs font-bold px-4 py-3 rounded-2xl shadow-xl flex items-center gap-2 border animate-bounce ${toastMessage.type === 'error' ? 'bg-rose-900 border-rose-800' : 'bg-slate-900 border-slate-800'}`}>
                            <i data-lucide={toastMessage.type === 'error' ? 'alert-circle' : 'check-circle-2'} className={`w-4 h-4 ${toastMessage.type === 'error' ? 'text-rose-400' : 'text-emerald-400'}`}></i>
                            <span>{toastMessage.msg}</span>
                        </div>
                    )}

                    <main className="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 space-y-6">
                        {activeTab === 'dashboard' && <DashboardTab transactions={transactions} accounts={accounts} onNavigate={setActiveTab} />}
                        {activeTab === 'transactions' && (
                            <TransactionsTab 
                                transactions={transactions} 
                                accounts={accounts} 
                                expenseCategories={expenseCategories}
                                incomeCategories={incomeCategories}
                                onAddTransaction={handleAddTransaction} 
                            />
                        )}
                        {activeTab === 'scan' && (
                            <ScanTab 
                                accounts={accounts} 
                                expenseCategories={expenseCategories}
                                onAddTransaction={handleAddTransaction} 
                                geminiApiKey={geminiApiKey} 
                                showToast={showToast} 
                            />
                        )}
                        {activeTab === 'accounts' && (
                            <AccountsTab 
                                accounts={accounts} 
                                setAccounts={setAccounts} 
                                expenseCategories={expenseCategories}
                                setExpenseCategories={setExpenseCategories}
                                incomeCategories={incomeCategories}
                                setIncomeCategories={setIncomeCategories}
                                showToast={showToast} 
                            />
                        )}
                        {activeTab === 'supabase' && (
                            <SupabaseTab 
                                supabaseUrl={supabaseUrl}
                                setSupabaseUrl={setSupabaseUrl}
                                supabaseKey={supabaseKey}
                                setSupabaseKey={setSupabaseKey}
                                sheetsWebhookUrl={sheetsWebhookUrl}
                                setSheetsWebhookUrl={setSheetsWebhookUrl}
                                transactions={transactions}
                                accounts={accounts}
                                isConnected={isSupabaseConnected}
                                showToast={showToast}
                                geminiApiKey={geminiApiKey}
                                setGeminiApiKey={setGeminiApiKey}
                            />
                        )}
                    </main>

                    <nav className="fixed bottom-3 left-1/2 -translate-x-1/2 z-40 bg-white/95 backdrop-blur-xl border border-slate-200/90 rounded-full px-3 py-2 shadow-2xl flex items-center gap-1 sm:gap-2">
                        <button
                            onClick={() => setActiveTab('dashboard')}
                            className={`flex flex-col items-center py-1.5 px-3.5 rounded-full transition-all ${activeTab === 'dashboard' ? 'bg-violet-600 text-white shadow-md shadow-violet-600/30' : 'text-slate-500 hover:text-slate-900'}`}
                        >
                            <i data-lucide="layout-dashboard" className="w-5 h-5"></i>
                            <span className="text-[10px] font-bold mt-0.5">Ringkasan</span>
                        </button>

                        <button
                            onClick={() => setActiveTab('transactions')}
                            className={`flex flex-col items-center py-1.5 px-3.5 rounded-full transition-all ${activeTab === 'transactions' ? 'bg-violet-600 text-white shadow-md shadow-violet-600/30' : 'text-slate-500 hover:text-slate-900'}`}
                        >
                            <i data-lucide="receipt-text" className="w-5 h-5"></i>
                            <span className="text-[10px] font-bold mt-0.5">Catat</span>
                        </button>

                        <button
                            onClick={() => setActiveTab('scan')}
                            className={`relative -top-3 p-3.5 rounded-full text-white bg-gradient-to-r from-violet-600 via-indigo-600 to-cyan-500 shadow-lg shadow-violet-500/40 active:scale-95 transition-all ${activeTab === 'scan' ? 'ring-4 ring-violet-200' : ''}`}
                            title="Scan Struk AI"
                        >
                            <i data-lucide="scan-line" className="w-6 h-6"></i>
                        </button>

                        <button
                            onClick={() => setActiveTab('accounts')}
                            className={`flex flex-col items-center py-1.5 px-3.5 rounded-full transition-all ${activeTab === 'accounts' ? 'bg-violet-600 text-white shadow-md shadow-violet-600/30' : 'text-slate-500 hover:text-slate-900'}`}
                        >
                            <i data-lucide="settings-2" className="w-5 h-5"></i>
                            <span className="text-[10px] font-bold mt-0.5">Pengaturan</span>
                        </button>

                        <button
                            onClick={() => setActiveTab('supabase')}
                            className={`flex flex-col items-center py-1.5 px-3.5 rounded-full transition-all ${activeTab === 'supabase' ? 'bg-violet-600 text-white shadow-md shadow-violet-600/30' : 'text-slate-500 hover:text-slate-900'}`}
                        >
                            <i data-lucide="database" className="w-5 h-5"></i>
                            <span className="text-[10px] font-bold mt-0.5">Cloud DB</span>
                        </button>
                    </nav>
                </div>
            );
        }

        function DashboardTab({ transactions, accounts, onNavigate }) {
            const [dateFilter, setDateFilter] = useState('30days');
            const [searchQuery, setSearchQuery] = useState('');
            const [typeFilter, setTypeFilter] = useState('ALL');
            const [expandedTxId, setExpandedTxId] = useState(null);
            
            const getTodayStr = () => {
                const d = new Date();
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            };

            const [startDate, setStartDate] = useState(() => {
                const d = new Date();
                d.setDate(d.getDate() - 30);
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            });
            const [endDate, setEndDate] = useState(() => getTodayStr());

            useEffect(() => {
                if (window.lucide && typeof window.lucide.createIcons === 'function') {
                    window.lucide.createIcons();
                }
            }, [dateFilter, transactions, searchQuery, typeFilter, expandedTxId]);

            const dateRangeLabel = useMemo(() => {
                const today = getTodayStr();
                if (dateFilter === 'today') return `Hari Ini (${today})`;
                if (dateFilter === '7days') {
                    const d = new Date();
                    d.setDate(d.getDate() - 7);
                    const start7 = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                    return `7 Hari Terakhir (${start7} s/d ${today})`;
                }
                if (dateFilter === '30days') {
                    const d = new Date();
                    d.setDate(d.getDate() - 30);
                    const start30 = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                    return `30 Hari Terakhir (${start30} s/d ${today})`;
                }
                if (dateFilter === 'month') {
                    const curMonth = today.substring(0, 7);
                    return `Bulan Ini (${curMonth})`;
                }
                if (dateFilter === 'custom') {
                    return `Kustom (${startDate} s/d ${endDate})`;
                }
                return 'Semua Transaksi';
            }, [dateFilter, startDate, endDate]);

            const filteredTransactions = useMemo(() => {
                const todayStr = getTodayStr();
                return transactions.filter(t => {
                    const txDate = t.date;
                    let matchesDate = true;
                    if (dateFilter === 'today') {
                        matchesDate = txDate === todayStr;
                    } else if (dateFilter === '7days') {
                        const d = new Date();
                        d.setDate(d.getDate() - 7);
                        const start7 = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                        matchesDate = txDate >= start7 && txDate <= todayStr;
                    } else if (dateFilter === '30days') {
                        const d = new Date();
                        d.setDate(d.getDate() - 30);
                        const start30 = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                        matchesDate = txDate >= start30 && txDate <= todayStr;
                    } else if (dateFilter === 'month') {
                        const curMonth = todayStr.substring(0, 7);
                        matchesDate = txDate.startsWith(curMonth);
                    } else if (dateFilter === 'custom') {
                        matchesDate = txDate >= startDate && txDate <= endDate;
                    }

                    let matchesType = true;
                    if (typeFilter !== 'ALL') {
                        matchesType = t.type === typeFilter;
                    }

                    let matchesSearch = true;
                    if (searchQuery.trim()) {
                        const q = searchQuery.toLowerCase();
                        const note = (t.note || '').toLowerCase();
                        const cat = (t.category || '').toLowerCase();
                        const itemNames = (t.items || []).map(i => i.name.toLowerCase()).join(' ');
                        matchesSearch = note.includes(q) || cat.includes(q) || itemNames.includes(q);
                    }

                    return matchesDate && matchesType && matchesSearch;
                });
            }, [transactions, dateFilter, startDate, endDate, typeFilter, searchQuery]);

            const { totalIncome, totalExpense } = useMemo(() => {
                return filteredTransactions.reduce((acc, t) => {
                    if (t.type === 'INCOME') acc.totalIncome += Number(t.amount || 0);
                    if (t.type === 'EXPENSE') acc.totalExpense += Number(t.amount || 0);
                    return acc;
                }, { totalIncome: 0, totalExpense: 0 });
            }, [filteredTransactions]);

            const netCashflow = totalIncome - totalExpense;

            const healthStatus = useMemo(() => {
                if (totalIncome === 0 && totalExpense === 0) return { label: 'Belum Ada Transaksi', color: 'text-slate-500', bg: 'bg-slate-100' };
                if (totalIncome === 0) return { label: 'Defisit (100% Pengeluaran)', color: 'text-rose-600', bg: 'bg-rose-100' };
                const ratio = (totalExpense / totalIncome) * 100;
                if (ratio <= 50) return { label: `Sangat Sehat (${Math.round(ratio)}% terpakai)`, color: 'text-emerald-600', bg: 'bg-emerald-100' };
                if (ratio <= 80) return { label: `Hemat (${Math.round(ratio)}% terpakai)`, color: 'text-amber-600', bg: 'bg-amber-100' };

                    category: type === 'TRANSFER' ? 'Transfer Internal' : category,
                    date,
                    note,

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">

                                        {type === 'EXPENSE' && expenseCategories.map((cat, idx) => (
                                            <option key={idx} value={cat}>{cat}</option>
                                        ))}
                                        {type === 'INCOME' && incomeCategories.map((cat, idx) => (
                                            <option key={idx} value={cat}>{cat}</option>
                                        ))}
                                    </select>
                                </div>

                            {type === 'TRANSFER' && (
                                <div>
                                    <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Biaya Admin (Opsional)</label>
                                    <input
                                        type="number"
                                        placeholder="0"
                                        value={adminFee}
                                        onChange={(e) => setAdminFee(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xs font-bold text-slate-800"
                                    />

                            <div>
                                <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Tanggal Transaksi</label>
                                <input
                                    type="date"
                                    value={date}
                                    onChange={(e) => setDate(e.target.value)}

                        <div>
                            <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Catatan / Keterangan</label>
                            <input
                                type="text"
                                placeholder="Contoh: Beli Kopi Latte"
                                value={note}
                                onChange={(e) => setNote(e.target.value)}
                                className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xs font-bold text-slate-800"
                            />
                        </div>

                        <button
                            type="submit"
                            className="w-full py-3.5 bg-gradient-to-r from-violet-600 to-indigo-600 text-white font-extrabold text-xs sm:text-sm rounded-2xl shadow-lg shadow-violet-600/30 active:scale-95 transition-all"

        }

        function ScanTab({ accounts, expenseCategories, onAddTransaction, geminiApiKey, showToast }) {
            const [selectedImage, setSelectedImage] = useState(null);
            const [isAnalyzing, setIsAnalyzing] = useState(false);
            const [statusText, setStatusText] = useState('');
            const [scannedData, setScannedData] = useState(null);
            const [selectedAccount, setSelectedAccount] = useState(accounts[0]?.id || '');

            const handleImageUpload = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setSelectedImage(reader.result);
                        setScannedData(null);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const analyzeReceiptWithGemini = async () => {
                if (!selectedImage) return;

                setIsAnalyzing(true);
                setStatusText('Menganalisis Struk dengan Gemini 3 Flash AI...');

                try {
                    const base64Data = selectedImage.split(',')[1];
                    const mimeMatch = selectedImage.match(/^data:(image\/[a-zA-Z+]+);base64,/);
                    const mimeType = mimeMatch ? mimeMatch[1] : 'image/jpeg';

                    const userApiKey = (geminiApiKey || '').trim();
                    const apiKey = userApiKey.startsWith('AIzaSy') ? userApiKey : '';

                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

                    const systemPrompt = `Anda adalah sistem OCR dan analisis nota/struk belanja AI tingkat tinggi yang sangat teliti, presisi, dan akurat.
Kategori pengeluaran yang tersedia di aplikasi: ${expenseCategories.join(', ')}.

PETUNJUK ANALISIS PEMBACAAN NOTA:
1. Baca gambar nota dengan cermat dari atas ke bawah.
2. Identifikasi Nama Toko/Merchant/Restoran (storeName).
3. Tanggal transaksi (date) dalam format YYYY-MM-DD. Jika tahun tidak tertera di nota, gunakan tahun saat ini (2026).
4. Pilih kategori yang PALING COCOK dari daftar kategori di atas.
5. Ekstrak setiap item barang/layanan yang tertera di nota:
   - name: Nama item barang / menu / jasa
   - qty: Jumlah kuantitas (integer, default 1 jika tidak tertulis)
   - price: HARGA SATUAN per item (number, nominal rupiah tanpa titik/koma). Jika harga yang tertera di nota adalah total harga baris untuk qty > 1, bagilah dengan qty agar 'price' menjadi harga satuan.
6. totalAmount: Total nominal pembayaran akhir di nota (termasuk pajak/service/diskon jika ada).`;

                    const userPrompt = `Analisis gambar struk/nota belanja ini secara detail dan akurat. Ekstrak data dalam format JSON sesuai schema.`;

                    const payload = {
                        contents: [
                            {
                                role: "user",
                                parts: [
                                    { text: userPrompt },
                                    {
                                        inlineData: {
                                            mimeType: mimeType,
                                            data: base64Data
                                        }
                                    }
                                ]
                            }
                        ],
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: {
                            responseMimeType: "application/json",
                            responseSchema: {
                                type: "OBJECT",
                                properties: {
                                    storeName: { type: "STRING" },
                                    date: { type: "STRING" },
                                    category: { type: "STRING" },
                                    items: {
                                        type: "ARRAY",
                                        items: {
                                            type: "OBJECT",
                                            properties: {
                                                name: { type: "STRING" },
                                                qty: { type: "INTEGER" },
                                                price: { type: "NUMBER" }
                                            },
                                            required: ["name", "qty", "price"]
                                        }
                                    },
                                    totalAmount: { type: "NUMBER" }
                                },
                                required: ["storeName", "date", "category", "items", "totalAmount"]
                            }
                        }
                    };

                    let response;
                    let retries = 3;
                    let delay = 1000;

                    for (let i = 0; i < retries; i++) {
                        try {
                            response = await fetch(apiUrl, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify(payload)
                            });
                            if (response.ok) break;
                        } catch (netErr) {
                            if (i === retries - 1) throw netErr;
                        }
                        await new Promise(res => setTimeout(res, delay));
                        delay *= 2;
                    }

                    if (!response || !response.ok) {
                        throw new Error(`Koneksi AI terganggu (${response ? response.status : 'Network Error'})`);
                    }

                    const result = await response.json();
                    const jsonText = result.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (!jsonText) {
                        throw new Error("AI tidak mengembalikan teks hasil bacaan struk.");
                    }

                    const parsedData = JSON.parse(jsonText);

                    const formattedResult = {
                        storeName: parsedData.storeName || "Toko / Merchant",
                        date: parsedData.date || new Date().toISOString().split('T')[0],
                        category: expenseCategories.includes(parsedData.category) ? parsedData.category : (expenseCategories[0] || "Belanja & Groceries"),
                        items: Array.isArray(parsedData.items) && parsedData.items.length > 0
                            ? parsedData.items.map(item => ({
                                name: String(item.name || 'Barang'),
                                qty: Number(item.qty) || 1,
                                price: Number(item.price) || 0
                            }))
                            : [{ name: "Belanja Nota", qty: 1, price: Number(parsedData.totalAmount) || 0 }],
                        totalAmount: Number(parsedData.totalAmount) || 0
                    };

                    if (formattedResult.totalAmount === 0 && formattedResult.items.length > 0) {
                        formattedResult.totalAmount = formattedResult.items.reduce((sum, item) => sum + (item.qty * item.price), 0);
                    }

                    setScannedData(formattedResult);
                    showToast('✨ Struk berhasil dibaca presisi oleh Gemini 3 Flash AI!');
                } catch (err) {
                    console.warn("Gemini Vision Scan Exception:", err);
                    showToast(`Error scan AI: ${err.message}. Membuka mode periksa manual.`, 'error');
                    setScannedData({
                        storeName: "Toko / Merchant",
                        date: new Date().toISOString().split('T')[0],
                        category: expenseCategories[0] || "Belanja & Groceries",
                        items: [{ name: "Item Struk 1", qty: 1, price: 0 }],
                        totalAmount: 0
                    });
                } finally {
                    setIsAnalyzing(false);
                }
            };

            const handleUpdateItem = (index, field, value) => {
                if (!scannedData) return;
                const updatedItems = [...(scannedData.items || [])];
                updatedItems[index] = { ...updatedItems[index], [field]: value };
                
                const newTotal = updatedItems.reduce((sum, item) => sum + ((Number(item.qty) || 1) * (Number(item.price) || 0)), 0);

                setScannedData({
                    ...scannedData,
                    items: updatedItems,
                    totalAmount: newTotal > 0 ? newTotal : scannedData.totalAmount
                });
            };

            const handleAddItem = () => {
                if (!scannedData) return;
                setScannedData({
                    ...scannedData,
                    items: [...(scannedData.items || []), { name: 'Barang Baru', qty: 1, price: 0 }]
                });
            };

            const handleDeleteItem = (index) => {
                if (!scannedData) return;
                const updatedItems = (scannedData.items || []).filter((_, i) => i !== index);
                const newTotal = updatedItems.reduce((sum, item) => sum + ((Number(item.qty) || 1) * (Number(item.price) || 0)), 0);
                setScannedData({
                    ...scannedData,
                    items: updatedItems,
                    totalAmount: newTotal
                });
            };

            const handleSaveScannedReceipt = () => {
                if (!scannedData) return;

                onAddTransaction({
                    type: 'EXPENSE',
                    amount: Number(scannedData.totalAmount) || 0,
                    accountId: selectedAccount,
                    category: scannedData.category || expenseCategories[0] || 'Belanja & Groceries',
                    date: scannedData.date || new Date().toISOString().split('T')[0],
                    note: `Scan Struk: ${scannedData.storeName || 'Toko'} (${(scannedData.items || []).length} item)`,
                    items: scannedData.items || []
                });

                setSelectedImage(null);
                setScannedData(null);
            };

            return (
                <div className="space-y-6 max-w-2xl mx-auto">
                    <div>
                        <h2 className="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">Scan Nota AI High-Precision</h2>
                        <p className="text-xs text-slate-500 font-medium">Membaca struk belanja dan mengonversi menjadi rincian barang interaktif</p>
                    </div>

                    <div className="glass-card p-6 rounded-3xl border-2 border-dashed border-violet-200 text-center space-y-4">
                        {selectedImage ? (
                            <div className="space-y-4">
                                <img src={selectedImage} alt="Struk" className="max-h-64 mx-auto rounded-2xl shadow-md border border-slate-200 object-contain" />
                                <div className="flex justify-center gap-2">
                                    <label className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl cursor-pointer transition-all">
                                        Ganti Foto
                                        <input type="file" accept="image/*" capture="environment" onChange={handleImageUpload} className="hidden" />
                                    </label>
                                    <button
                                        onClick={analyzeReceiptWithGemini}
                                        disabled={isAnalyzing}
                                        className="px-5 py-2 bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-700 hover:to-indigo-700 text-white text-xs font-bold rounded-xl shadow-md flex items-center gap-2 disabled:opacity-50 transition-all"
                                    >
                                        {isAnalyzing ? (
                                            <>
                                                <div className="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                                                <span>{statusText || 'Menganalisis Gambar Struk...'}</span>
                                            </>
                                        ) : (
                                            <>
                                                <i data-lucide="sparkles" className="w-4 h-4"></i>
                                                <span>Proses Scan Struk</span>
                                            </>
                                        )}
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <label className="cursor-pointer block py-8">
                                <div className="w-14 h-14 mx-auto mb-3 rounded-2xl bg-violet-50 text-violet-600 flex items-center justify-center shadow-inner">
                                    <i data-lucide="camera" className="w-7 h-7"></i>
                                </div>
                                <h3 className="font-extrabold text-slate-900 text-sm">Ambil Foto atau Pilih Gambar Struk</h3>
                                <p className="text-xs text-slate-400 font-medium mt-1">Mendukung nota fisik, struk digital, minimarket, resto, dll.</p>
                                <input type="file" accept="image/*" capture="environment" onChange={handleImageUpload} className="hidden" />
                            </label>
                        )}
                    </div>

                    {scannedData && (
                        <div className="glass-card p-5 sm:p-6 rounded-3xl space-y-4 border-violet-200 bg-white shadow-xl animate-fadeIn">
                            <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                                <div className="flex items-center gap-2">
                                    <div className="p-2 rounded-xl bg-violet-100 text-violet-700">
                                        <i data-lucide="receipt" className="w-4 h-4"></i>
                                    </div>
                                    <h3 className="font-extrabold text-slate-900 text-sm">Hasil Pindai Nota</h3>
                                </div>
                                <span className="text-[10px] bg-emerald-100 text-emerald-700 font-bold px-2.5 py-1 rounded-full">
                                    Terverifikasi
                                </span>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                <div>
                                    <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Nama Toko</label>
                                    <input
                                        type="text"
                                        value={scannedData.storeName || ''}
                                        onChange={(e) => setScannedData({ ...scannedData, storeName: e.target.value })}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold text-slate-800"
                                    />
                                </div>
                                <div>
                                    <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Tanggal Struk</label>
                                    <input
                                        type="date"
                                        value={scannedData.date || new Date().toISOString().split('T')[0]}
                                        onChange={(e) => setScannedData({ ...scannedData, date: e.target.value })}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold text-slate-800"
                                    />
                                </div>
                                <div>
                                    <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Kategori Pengeluaran</label>
                                    <select
                                        value={scannedData.category || expenseCategories[0]}
                                        onChange={(e) => setScannedData({ ...scannedData, category: e.target.value })}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs font-bold text-slate-800"
                                    >
                                        {expenseCategories.map((cat, idx) => (
                                            <option key={idx} value={cat}>{cat}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            <div className="space-y-2">
                                <div className="flex items-center justify-between">
                                    <h4 className="text-[10px] font-black uppercase text-slate-400">Rincian Barang</h4>
                                    <button
                                        onClick={handleAddItem}
                                        className="text-[11px] font-bold text-violet-600 hover:text-violet-700 flex items-center gap-1"
                                    >
                                        <i data-lucide="plus" className="w-3.5 h-3.5"></i>
                                        <span>Tambah Item</span>
                                    </button>
                                </div>

                                <div className="space-y-2 max-h-60 overflow-y-auto custom-scrollbar pr-1">
                                    {(scannedData.items || []).map((item, idx) => (
                                        <div key={idx} className="flex items-center gap-2 p-2 bg-slate-50 rounded-xl border border-slate-200">
                                            <input
                                                type="text"
                                                value={item.name}
                                                onChange={(e) => handleUpdateItem(idx, 'name', e.target.value)}
                                                placeholder="Nama Barang"
                                                className="flex-1 bg-white border border-slate-200 rounded-lg p-2 text-xs font-bold text-slate-800"
                                            />
                                            <div className="w-16">
                                                <input
                                                    type="number"
                                                    value={item.qty}
                                                    min="1"
                                                    onChange={(e) => handleUpdateItem(idx, 'qty', Number(e.target.value))}
                                                    placeholder="Qty"
                                                    className="w-full bg-white border border-slate-200 rounded-lg p-2 text-xs font-bold text-slate-800 text-center"
                                                />
                                            </div>
                                            <div className="w-28">
                                                <input
                                                    type="number"
                                                    value={item.price}
                                                    onChange={(e) => handleUpdateItem(idx, 'price', Number(e.target.value))}
                                                    placeholder="Harga Satuan"
                                                    className="w-full bg-white border border-slate-200 rounded-lg p-2 text-xs font-bold text-slate-800 text-right"
                                                />
                                            </div>
                                            <button
                                                onClick={() => handleDeleteItem(idx)}
                                                className="p-2 text-rose-500 hover:text-rose-700 hover:bg-rose-50 rounded-lg transition-all"
                                                title="Hapus Item"
                                            >
                                                <i data-lucide="trash-2" className="w-4 h-4"></i>
                                            </button>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t border-slate-100">
                                <div>
                                    <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Total Pengeluaran (IDR)</label>
                                    <input
                                        type="number"
                                        value={scannedData.totalAmount || 0}
                                        onChange={(e) => setScannedData({ ...scannedData, totalAmount: Number(e.target.value) })}
                                        className="w-full bg-emerald-50/60 border border-emerald-300 rounded-2xl p-3 text-base font-black text-emerald-700 focus:outline-none"
                                    />
                                </div>

                                <div>
                                    <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Pilih Rekening Pembayaran</label>
                                    <select
                                        value={selectedAccount}
                                        onChange={(e) => setSelectedAccount(e.target.value)}
                                        className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xs font-bold text-slate-800"
                                    >
                                        {accounts.map(acc => (
                                            <option key={acc.id} value={acc.id}>{acc.name} ({formatIDR(acc.balance)})</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            <button
                                onClick={handleSaveScannedReceipt}
                                className="w-full py-3.5 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-extrabold text-xs sm:text-sm rounded-2xl shadow-lg shadow-emerald-600/20 active:scale-95 transition-all flex items-center justify-center gap-2"
                            >
                                <i data-lucide="check-circle" className="w-4 h-4"></i>
                                <span>Simpan Ke Pengeluaran ({formatIDR(scannedData.totalAmount)})</span>
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        function AccountsTab({ accounts, setAccounts, expenseCategories, setExpenseCategories, incomeCategories, setIncomeCategories, showToast }) {
            const [name, setName] = useState('');
            const [type, setType] = useState('Bank');
            const [balance, setBalance] = useState('');

            const [newCategoryType, setNewCategoryType] = useState('EXPENSE');
            const [newCategoryName, setNewCategoryName] = useState('');

            const handleAddAccount = (e) => {
                e.preventDefault();
                if (!name || !balance) return;

                const newAcc = {
                    id: 'acc_' + Date.now(),
                    name,
                    type,
                    balance: Number(balance),
                    color: type === 'Bank' ? 'bg-blue-600' : type === 'E-Wallet' ? 'bg-emerald-600' : 'bg-amber-500'
                };

                setAccounts(prev => [...prev, newAcc]);
                setName('');
                setBalance('');
                showToast('Rekening baru berhasil ditambahkan!');
            };

            const handleAddCategory = (e) => {
                e.preventDefault();
                if (!newCategoryName.trim()) return;

                const trimmed = newCategoryName.trim();
                if (newCategoryType === 'EXPENSE') {
                    if (expenseCategories.includes(trimmed)) {
                        showToast('Kategori pengeluaran sudah ada', 'error');
                        return;
                    }
                    setExpenseCategories(prev => [...prev, trimmed]);
                } else {
                    if (incomeCategories.includes(trimmed)) {
                        showToast('Kategori pemasukan sudah ada', 'error');
                        return;
                    }
                    setIncomeCategories(prev => [...prev, trimmed]);
                }

                setNewCategoryName('');
                showToast(`Kategori ${newCategoryType === 'EXPENSE' ? 'Pengeluaran' : 'Pemasukan'} ditambahkan!`);
            };

            const handleDeleteCategory = (catType, catName) => {
                if (catType === 'EXPENSE') {
                    if (expenseCategories.length <= 1) {
                        showToast('Minimal harus ada 1 kategori', 'error');
                        return;
                    }
                    setExpenseCategories(prev => prev.filter(c => c !== catName));
                } else {
                    if (incomeCategories.length <= 1) {
                        showToast('Minimal harus ada 1 kategori', 'error');
                        return;
                    }
                    setIncomeCategories(prev => prev.filter(c => c !== catName));
                }
                showToast(`Kategori ${catName} berhasil dihapus`);
            };

            return (
                <div className="space-y-6 max-w-2xl mx-auto">
                    <div>
                        <h2 className="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">Pengaturan Rekening & Kategori</h2>
                        <p className="text-xs text-slate-500 font-medium">Atur akun bank, e-wallet, dan daftar kategori transaksi</p>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                        {accounts.map(acc => (
                            <div key={acc.id} className="glass-card p-5 rounded-3xl flex items-center justify-between border-slate-200/80">
                                <div className="flex items-center gap-3.5">
                                    <div className={`w-11 h-11 rounded-2xl text-white ${acc.color || 'bg-violet-600'} flex items-center justify-center font-black shadow-md`}>
                                        {acc.name.substring(0, 2).toUpperCase()}
                                    </div>
                                    <div>
                                        <h4 className="font-extrabold text-sm text-slate-900">{acc.name}</h4>
                                        <span className="text-[10px] font-bold px-2 py-0.5 bg-slate-100 text-slate-500 rounded-lg">{acc.type}</span>
                                    </div>
                                </div>
                                <span className="font-extrabold text-sm text-slate-900">{formatIDR(acc.balance)}</span>
                            </div>
                        ))}
                    </div>

                    <form onSubmit={handleAddAccount} className="glass-card p-5 sm:p-6 rounded-3xl space-y-4">
                        <h3 className="font-extrabold text-slate-900 text-sm">Tambah Rekening Baru</h3>
                        
                        <div>
                            <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Nama Rekening / Dompet</label>
                            <input
                                type="text"
                                required
                                placeholder="Contoh: Bank Mandiri / OVO"
                                value={name}
                                onChange={(e) => setName(e.target.value)}
                                className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xs font-bold text-slate-800"
                            />
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Tipe Rekening</label>
                                <select
                                    value={type}
                                    onChange={(e) => setType(e.target.value)}
                                    className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xs font-bold text-slate-800"
                                >
                                    <option value="Bank">Bank</option>
                                    <option value="E-Wallet">E-Wallet</option>
                                    <option value="Cash">Uang Tunai / Cash</option>
                                </select>
                            </div>

                            <div>
                                <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Saldo Awal (IDR)</label>
                                <input
                                    type="number"
                                    required
                                    placeholder="0"
                                    value={balance}
                                    onChange={(e) => setBalance(e.target.value)}
                                    className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xs font-bold text-slate-800"
                                />
                            </div>
                        </div>

                        <button
                            type="submit"
                            className="w-full py-3 bg-slate-900 text-white font-extrabold text-xs rounded-2xl shadow-md active:scale-95 transition-all"
                        >
                            Simpan Rekening Baru
                        </button>
                    </form>

                    <div className="glass-card p-5 sm:p-6 rounded-3xl space-y-5 border-violet-100">
                        <div className="border-b border-slate-100 pb-3">
                            <h3 className="font-extrabold text-slate-900 text-sm sm:text-base">Pengaturan Kategori Transaksi</h3>
                            <p className="text-[11px] text-slate-400 font-medium">Tambah atau atur kategori terpisah untuk Pengeluaran & Pemasukan</p>
                        </div>

                        <form onSubmit={handleAddCategory} className="flex flex-col sm:flex-row items-center gap-2">
                            <select
                                value={newCategoryType}
                                onChange={(e) => setNewCategoryType(e.target.value)}
                                className="w-full sm:w-auto bg-slate-100 border border-slate-200 rounded-2xl p-2.5 text-xs font-bold text-slate-800"
                            >
                                <option value="EXPENSE">🔴 Pengeluaran</option>
                                <option value="INCOME">🟢 Pemasukan</option>
                            </select>

                            <input
                                type="text"
                                placeholder="Nama Kategori Baru..."
                                value={newCategoryName}
                                onChange={(e) => setNewCategoryName(e.target.value)}
                                className="w-full flex-1 bg-slate-50 border border-slate-200 rounded-2xl p-2.5 text-xs font-bold text-slate-800"
                            />

                            <button
                                type="submit"
                                className="w-full sm:w-auto px-5 py-2.5 bg-violet-600 hover:bg-violet-700 text-white text-xs font-extrabold rounded-2xl shadow-md transition-all shrink-0"
                            >
                                + Tambah
                            </button>
                        </form>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                            <div className="bg-rose-50/50 p-4 rounded-2xl border border-rose-100 space-y-2">
                                <span className="text-xs font-black uppercase tracking-wider text-rose-700 block mb-1">
                                    Kategori Pengeluaran ({expenseCategories.length})
                                </span>
                                <div className="flex flex-wrap gap-1.5 max-h-48 overflow-y-auto custom-scrollbar">
                                    {expenseCategories.map((cat, idx) => (
                                        <span key={idx} className="inline-flex items-center gap-1.5 px-3 py-1 bg-white border border-rose-200 rounded-xl text-xs font-bold text-slate-800 shadow-2xs">
                                            {cat}
                                            <button
                                                type="button"
                                                onClick={() => handleDeleteCategory('EXPENSE', cat)}
                                                className="text-slate-400 hover:text-rose-600"
                                            >
                                                ×
                                            </button>
                                        </span>
                                    ))}
                                </div>
                            </div>

                            <div className="bg-emerald-50/50 p-4 rounded-2xl border border-emerald-100 space-y-2">
                                <span className="text-xs font-black uppercase tracking-wider text-emerald-700 block mb-1">
                                    Kategori Pemasukan ({incomeCategories.length})
                                </span>
                                <div className="flex flex-wrap gap-1.5 max-h-48 overflow-y-auto custom-scrollbar">
                                    {incomeCategories.map((cat, idx) => (
                                        <span key={idx} className="inline-flex items-center gap-1.5 px-3 py-1 bg-white border border-emerald-200 rounded-xl text-xs font-bold text-slate-800 shadow-2xs">
                                            {cat}
                                            <button
                                                type="button"
                                                onClick={() => handleDeleteCategory('INCOME', cat)}
                                                className="text-slate-400 hover:text-rose-600"
                                            >
                                                ×
                                            </button>
                                        </span>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function SupabaseTab({ supabaseUrl, setSupabaseUrl, supabaseKey, setSupabaseKey, sheetsWebhookUrl, setSheetsWebhookUrl, transactions, accounts, isConnected, showToast, geminiApiKey, setGeminiApiKey }) {
            const exportToCsv = () => {
                if (!transactions || transactions.length === 0) {
                    showToast('Belum ada transaksi untuk diexport', 'error');
                    return;
                }

                const headers = ['ID', 'Tanggal', 'Jenis', 'Nominal', 'Rekening Asal', 'Rekening Tujuan', 'Kategori', 'Catatan', 'Biaya Admin', 'Rincian Item'];
                const rows = transactions.map(t => {
                    const acc = accounts.find(a => a.id === t.accountId)?.name || '-';
                    const toAcc = t.toAccountId ? (accounts.find(a => a.id === t.toAccountId)?.name || '-') : '-';
                    const itemsStr = Array.isArray(t.items) && t.items.length > 0
                        ? t.items.map(i => `${i.name} (${i.qty}x @${i.price})`).join('; ')
                        : '-';

                    return [
                        t.id,
                        t.date,
                        t.type,
                        t.amount,
                        `"${acc}"`,
                        `"${toAcc}"`,
                        `"${t.category || '-'}"`,
                        `"${(t.note || '-').replace(/"/g, '""')}"`,
                        t.adminFee || 0,
                        `"${itemsStr.replace(/"/g, '""')}"`
                    ].join(',');
                });

                const csvContent = 'data:text/csv;charset=utf-8,\uFEFF' + [headers.join(','), ...rows].join('\n');
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement('a');
                link.setAttribute('href', encodedUri);
                link.setAttribute('download', `KeuanganKu_Export_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('✨ File CSV berhasil diunduh!');
            };

            const handleSaveConfig = (e) => {
                e.preventDefault();
                localStorage.setItem('supabase_url', supabaseUrl);
                localStorage.setItem('supabase_key', supabaseKey);
                localStorage.setItem('gemini_api_key', geminiApiKey);
                localStorage.setItem('sheets_webhook_url', sheetsWebhookUrl);
                showToast('Pengaturan berhasil disimpan!');
            };

            return (
                <div className="space-y-6 max-w-2xl mx-auto">
                    <div>
                        <h2 className="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">Cloud DB & Integration Settings</h2>
                        <p className="text-xs text-slate-500 font-medium">Hubungkan Supabase Cloud, Google Sheets & Gemini AI</p>
                    </div>

                    <div className="glass-card p-5 rounded-3xl flex flex-col sm:flex-row items-center justify-between gap-3 border-emerald-200 bg-emerald-50/30">
                        <div className="flex items-center gap-3">
                            <div className="p-3 bg-emerald-600 text-white rounded-2xl shadow-md">
                                <i data-lucide="file-spreadsheet" className="w-5 h-5"></i>
                            </div>
                            <div>
                                <h4 className="font-extrabold text-slate-900 text-xs sm:text-sm">Export Data Ke CSV</h4>
                                <p className="text-[10px] text-slate-500 font-medium">Unduh data transaksi sebagai format Spreadsheet/Excel</p>
                            </div>
                        </div>
                        <button
                            onClick={exportToCsv}
                            className="w-full sm:w-auto px-4 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs rounded-2xl shadow-md active:scale-95 transition-all flex items-center justify-center gap-2"
                        >
                            <i data-lucide="download" className="w-4 h-4"></i>
                            <span>Unduh CSV</span>
                        </button>
                    </div>

                    <div className={`p-4 rounded-3xl border flex items-center justify-between ${isConnected ? 'bg-emerald-50 border-emerald-200' : 'glass-card border-slate-200'}`}>
                        <div className="flex items-center gap-3">
                            <div className={`w-3 h-3 rounded-full ${isConnected ? 'bg-emerald-500 animate-pulse' : 'bg-slate-400'}`}></div>
                            <div>
                                <h4 className="font-extrabold text-slate-900 text-xs sm:text-sm">Status Koneksi Cloud</h4>
                                <p className="text-[10px] text-slate-500 font-medium">{isConnected ? 'Terhubung Supabase Cloud DB' : 'Mode Offline Browser (LocalStorage)'}</p>
                            </div>
                        </div>
                        <span className={`px-3 py-1 rounded-full text-[10px] font-black ${isConnected ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-600'}`}>
                            {isConnected ? 'ONLINE' : 'OFFLINE'}
                        </span>
                    </div>

                    <form onSubmit={handleSaveConfig} className="glass-card p-5 sm:p-6 rounded-3xl space-y-4">
                        <h3 className="font-extrabold text-slate-900 text-sm border-b border-slate-200 pb-2">Kredensial API & Webhook</h3>
                        
                        <div>
                            <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Supabase URL</label>
                            <input
                                type="text"
                                value={supabaseUrl}
                                onChange={(e) => setSupabaseUrl(e.target.value)}
                                className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xs text-slate-900 font-mono"
                            />
                        </div>

                        <div>
                            <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Supabase Anon Key</label>
                            <input
                                type="password"
                                value={supabaseKey}
                                onChange={(e) => setSupabaseKey(e.target.value)}
                                className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xs text-slate-900 font-mono"
                            />
                        </div>

                        <div>
                            <label className="block text-[10px] font-black uppercase text-slate-400 mb-1">Google Sheets Webhook URL</label>
                            <input
                                type="text"
                                placeholder="https://script.google.com/macros/s/.../exec"
                                value={sheetsWebhookUrl}
                                onChange={(e) => setSheetsWebhookUrl(e.target.value)}
                                className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xs text-slate-900 font-mono"
                            />
                        </div>

                        <div>
                            <div className="flex items-center justify-between mb-1">
                                <label className="block text-[10px] font-black uppercase text-slate-400">Gemini API Key (Google AI Studio)</label>
                                <a 
                                    href="https://aistudio.google.com/app/apikey" 
                                    target="_blank" 
                                    rel="noreferrer"
                                    className="text-[10px] font-bold text-violet-600 hover:underline flex items-center gap-1"
                                >
                                    <span>Dapatkan API Key Gratis</span>
                                    <i data-lucide="external-link" className="w-3 h-3"></i>
                                </a>
                            </div>
                            <input
                                type="password"
                                value={geminiApiKey}
                                placeholder="Opsional (otomatis disediakan jika kosong)"
                                onChange={(e) => setGeminiApiKey(e.target.value)}
                                className="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xs text-slate-900 font-mono"
                            />
                        </div>

                        <button
                            type="submit"
                            className="w-full py-3.5 bg-violet-600 hover:bg-violet-700 text-white font-extrabold text-xs sm:text-sm rounded-2xl shadow-md active:scale-95 transition-all"
                        >
                            Simpan Konfigurasi
                        </button>
                    </form>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
