<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#3e2217"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="BentarNgopi"><title>BentarNgopi • Tracking Pesanan & QR Serah Terima</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{coffee:{50:'#fdf8f6',100:'#f2e8e5',200:'#eaddd7',300:'#e0cec7',500:'#a37a6a',600:'#8b5e4c',700:'#694132',800:'#523023',900:'#3e2217'}}}}}</script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>
:root{--coffee-900:#3b2418;--coffee-800:#523023;--coffee-700:#6f3f24;--amber-500:#f59e0b;--surface:#fffdf9;--muted:#7c6f64;--shadow:0 18px 45px rgba(59,36,24,.08)}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(circle at top,#fff7ed 0,#fdf8f6 32%,#f8fafc 100%);color:#2d1d14}
.fade{animation:fade .3s ease-out}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.field{width:100%;border:1px solid #dfd6cb;border-radius:1rem;padding:.85rem 1rem;background:rgba(255,255,255,.98);outline:none;transition:.18s box-shadow,.18s border-color}.field:focus{border-color:#d97706;box-shadow:0 0 0 4px rgba(245,158,11,.16)}
.btn{border-radius:1rem;padding:.82rem 1.1rem;font-weight:800;background:linear-gradient(135deg,#6f3f24,#523023);color:white;box-shadow:0 10px 20px rgba(82,48,35,.16);transition:.18s transform,.18s box-shadow;border:none}.btn:hover{transform:translateY(-1px);box-shadow:0 14px 25px rgba(82,48,35,.18)}.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.card{background:rgba(255,255,255,.93);backdrop-filter:blur(10px);border:1px solid rgba(231,229,228,.95);border-radius:1.25rem;padding:1rem;box-shadow:var(--shadow)}
.muted{color:var(--muted);font-size:.9rem;line-height:1.5}
.tag{display:inline-flex;align-items:center;gap:.35rem;border-radius:999px;padding:.38rem .8rem;font-size:.75rem;font-weight:800;background:#fff4d7;color:#9a5a00;border:1px solid #fde3a7}
.admin-tab-btn{display:flex;align-items:center;justify-content:space-between;flex:0 0 auto;min-width:max-content;text-align:left;border-radius:1rem;padding:.92rem 1rem;font-weight:800;font-size:.9rem;color:#523023;background:rgba(255,255,255,.92);border:1px solid #ebe6e1;box-shadow:0 6px 16px rgba(0,0,0,.04);transition:.18s background,.18s color,.18s transform,.18s box-shadow}.admin-tab-btn.is-active{background:linear-gradient(135deg,#523023,#6f3f24);color:white;border-color:#523023;box-shadow:0 12px 24px rgba(82,48,35,.18)}.admin-tab-btn:hover{transform:translateY(-1px)}.admin-tab-btn:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}.admin-nav{scrollbar-width:thin}
.soft-panel{background:linear-gradient(180deg,rgba(255,250,245,.95),rgba(255,255,255,.95));border:1px solid #f1e5d8;border-radius:1.25rem;box-shadow:var(--shadow)}
.section-kicker{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;font-weight:900;color:#b45309}
.price-pill{display:inline-flex;align-items:center;gap:.35rem;padding:.35rem .7rem;border-radius:999px;font-size:.78rem;font-weight:800;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa}
.menu-card{position:relative;overflow:hidden;border-radius:1.25rem;padding:1rem;border:1px solid #ede7df;background:linear-gradient(180deg,#ffffff 0,#fffcfa 100%);box-shadow:0 14px 30px rgba(0,0,0,.05)}
.menu-card::after{content:'';position:absolute;right:-26px;top:-26px;width:88px;height:88px;border-radius:999px;background:radial-gradient(circle,#fde68a 0,rgba(253,230,138,0) 70%);opacity:.7}
.floating-cart{backdrop-filter:blur(12px);background:rgba(255,251,235,.92);border-top:1px solid #f3d28b;box-shadow:0 -10px 30px rgba(82,48,35,.12)}
@media(min-width:1024px){.admin-tab-btn{width:100%}}

/* Admin UX: grouped sections and filters */
.bn-admin-categories{display:flex;gap:.75rem;overflow-x:auto;padding:.25rem 0 1rem;scrollbar-width:thin}
.bn-admin-category{flex-shrink:0;min-width:fit-content;background:#fffcf9;border:1px solid #ebe1d6;border-radius:1rem;padding:.7rem}
.bn-admin-category h3{font-size:.65rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#9a601b;padding:.25rem .4rem .65rem}
.bn-admin-category-items{display:flex;gap:.4rem}
.bn-admin-category-items .admin-tab-btn{min-width:unset;padding:.74rem .85rem;font-size:.8rem;white-space:nowrap}
.bn-setting-group{background:#fffdfa;border:1px solid #ece2d7;border-radius:1rem;padding:1rem;box-shadow:0 8px 20px #40251108}
.bn-setting-group h3{font-size:1.05rem;font-weight:900;color:#523023;display:flex;gap:.5rem;align-items:center;margin-bottom:.35rem}
.bn-setting-group p{color:#78716c;font-size:.83rem;margin-bottom:1rem}
.bn-setting-group-grid{display:grid;grid-template-columns:1fr;gap:.8rem}
.bn-setting-group-grid>label{font-weight:700;color:#57473b}
.bn-setting-check{display:flex;gap:.7rem;align-items:center;background:#fff3dc;border-radius:.8rem;padding:.8rem;margin-bottom:.9rem;font-weight:700}
.bn-setting-check input{accent-color:#784421;width:1.15rem;height:1.15rem}
.bn-admin-list-tools{display:grid;grid-template-columns:1fr;gap:.6rem;margin:1rem 0}
.bn-admin-record{background:#fffdfb;border:1px solid #eee3d7;border-radius:1rem;padding:1rem;margin-bottom:.65rem;box-shadow:0 5px 15px #40251107}
.bn-admin-record:nth-child(even){background:#fffaf3}
.bn-admin-count{font-size:.8rem;color:#78716c;margin:.3rem 0 .7rem}
@media(min-width:640px){.bn-setting-group-grid{grid-template-columns:1fr 1fr}.bn-admin-list-tools{grid-template-columns:minmax(0,1fr) 180px 180px}}
@media(min-width:1024px){.bn-admin-categories{display:flex;flex-direction:column;overflow:visible}.bn-admin-category{min-width:0;width:100%}.bn-admin-category-items{flex-direction:column}.bn-admin-category-items .admin-tab-btn{width:100%;white-space:normal}}

.bn-order-queue-tabs{display:flex;gap:.55rem;overflow-x:auto;padding:.2rem .1rem .65rem;scrollbar-width:thin}
.bn-queue-tab{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;white-space:nowrap;min-height:44px;padding:.65rem .9rem;border-radius:1rem;background:#fff;border:1px solid #e9e1d7;color:#6b5141;font-weight:800;font-size:.84rem;transition:.15s;cursor:pointer}
.bn-queue-tab.is-current{background:#523023;color:#fff;border-color:#523023;box-shadow:0 8px 18px #52302326}
.bn-queue-number{display:inline-flex;align-items:center;justify-content:center;min-width:1.55rem;height:1.55rem;padding:0 .4rem;border-radius:999px;background:#fff1c1;color:#754314;font-weight:900;font-size:.78rem}
.bn-queue-tab.is-current .bn-queue-number{background:#fbbf24;color:#422006}
.bn-order-queue-tabs:empty{display:none}

.bn-review-star{font-size:2.4rem;line-height:1;color:#d6d3d1;padding:.1rem;border-radius:.5rem;transition:transform .12s,color .12s}.bn-review-star.is-chosen{color:#e6a218}.bn-review-star:focus-visible{outline:3px solid #d97706;outline-offset:3px}.bn-review-star:hover{transform:scale(1.09)}
.bn-review-display{color:#d59b17;letter-spacing:.1rem;font-weight:900;font-size:1.25rem}.bn-review-display span{color:#6b5141;font-size:.9rem;letter-spacing:0}.bn-review-stats{margin-bottom:.8rem}.bn-review-summary{display:flex;align-items:center;gap:1rem;background:#fff7ed;border:1px solid #f8dfb4;padding:1rem;border-radius:1rem}.bn-review-summary>b{font-size:2.6rem;color:#6b3b1c}.bn-review-admin-card{border:1px solid #eee1d5;border-radius:1rem;background:#fffdfb;padding:1rem}

.bn-period-controls{margin-top:.75rem;padding:1rem;background:#fffaf2;border:1px solid #f1dec2;border-radius:1rem}
.bn-revenue-card{padding:1rem;border:1px solid #efe5d7;border-radius:1rem;background:linear-gradient(145deg,#fffdf9,#fff7ed)}
.bn-revenue-mini{display:flex;flex-direction:column;gap:.25rem;background:#fafaf9;border:1px solid #e7e5e4;border-radius:1rem;padding:.85rem}
.bn-revenue-mini b{font-size:1.25rem;color:#523023}.bn-revenue-mini span{font-size:.8rem;color:#78716c}

.bn-daily-card{background:linear-gradient(160deg,#ffffff,#fffbf5);border:1px solid #eee2d0;border-radius:1.1rem;padding:1rem;box-shadow:0 5px 20px #4220060a;min-width:0}
.bn-daily-icon{width:2.1rem;height:2.1rem;border-radius:.7rem;background:#fff0cb;color:#925517;display:flex;align-items:center;justify-content:center}

.bn-detail-filters{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:.7rem}
.bn-detail-filters label{font-size:.78rem;font-weight:800;color:#57534e}
.bn-detail-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.65rem}
.bn-detail-stat{padding:.85rem;border:1px solid #f1e4d5;background:#fffaf3;border-radius:1rem;display:flex;flex-direction:column;gap:.2rem}
.bn-detail-stat span{font-size:.78rem;color:#78716c;font-weight:700}
.bn-detail-stat strong{font-size:1.15rem;color:#523023;overflow-wrap:anywhere}
.bn-detail-stat small{font-size:.71rem;color:#78716c}
.bn-detail-table{border:1px solid #efe7de;border-radius:1rem;padding:1rem;background:#fff;}
.bn-detail-table table{width:100%;border-collapse:collapse;font-size:.82rem}
.bn-detail-table th{background:#fbf3e8;text-align:left;color:#6a442c;font-size:.77rem;white-space:nowrap}
.bn-detail-table th,.bn-detail-table td{padding:.7rem .75rem;border-bottom:1px solid #eee7df;vertical-align:top}
.bn-detail-table tr:hover td{background:#fffdf9}
@media(min-width:640px){.bn-detail-filters{grid-template-columns:repeat(2,minmax(0,1fr))}.bn-detail-stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:1024px){.bn-detail-filters{grid-template-columns:repeat(3,minmax(0,1fr))}.bn-detail-stats{grid-template-columns:repeat(4,minmax(0,1fr))}}

.bn-member-tab{display:inline-flex;align-items:center;gap:.4rem;max-width:min(50vw,220px);position:relative;white-space:nowrap}
#bnMemberTabName{display:inline-block;max-width:145px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.bn-member-notif{display:inline-flex;min-width:1.32rem;height:1.32rem;align-items:center;justify-content:center;padding:0 .32rem;border-radius:999px;background:#ef4444;color:#fff;font-weight:900;font-size:.69rem;line-height:1;box-shadow:0 0 0 2px #523023}
.bn-member-notif.hidden{display:none}
@media(max-width:400px){#bnMemberTabName{max-width:95px}.bn-member-tab{padding-left:.5rem;padding-right:.5rem}}

// Nama member di header mengikuti sesi login, bukan membuka halaman baru.
function bnRefreshMemberTab(){
 const nameEl=document.getElementById('bnMemberTabName');
 const badge=document.getElementById('bnMemberTabBadge');
 const btn=document.getElementById('bnMemberTab');
 if(!nameEl||!badge||!btn)return;
 const loggedIn=Boolean(state.phone);
 const name=loggedIn?(state.member?.name||sessionStorage.getItem('bnMemberDisplayName')||'Member'):'Member';
 nameEl.textContent=name;
 btn.title=loggedIn?'Akun '+name:'Masuk / Daftar Member';
 btn.setAttribute('aria-label',loggedIn?'Buka akun '+name:'Masuk atau daftar Member');
 const n=loggedIn?Math.max(0,Number(state.bnMemberNoticeCount)||0):0;
 badge.textContent=n>99?'99+':String(n);
 badge.classList.toggle('hidden',n===0);
}
async function bnRefreshMemberNotifications(){
 const phone=state.phone;
 if(!phone){state.bnMemberNoticeCount=0;bnRefreshMemberTab();return;}
 // Status sampel milik member; yang butuh tindak lanjut: disetujui,
 // diproses, atau sudah diterima (review tersedia).
 let sampleCount=0;
 try{
  const samples=(state.member&&Array.isArray(state.samples))?state.samples:
    await api('nama_bentarngopi?phone=eq.'+q(phone)+'&select=id,status','GET');
  sampleCount=samples.filter(x=>['approved','processing','received'].includes(x.status)).length;
 }catch(e){sampleCount=0}
 // Notifikasi berasal dari seluruh pesanan dengan WhatsApp member, bukan token perangkat.
 let orderCount=0;
 try{
  const orders=Array.isArray(state.bnMemberOrders)?state.bnMemberOrders:
   await api('rpc/bn_member_orders_by_phone','POST',{p_phone:phone});
  if(phone!==state.phone)return;
  orderCount=orders.filter(o=>['pending','confirmed','processing'].includes(o.status)).length;
 }catch(e){orderCount=0}
 if(phone!==state.phone)return;
 state.bnMemberNoticeCount=sampleCount+orderCount;
 bnRefreshMemberTab();
}

let toastTimer;
function toast(t,bad=false){const x=document.getElementById('toast');x.textContent=t;x.className='fixed bottom-5 right-4 left-4 sm:left-auto z-50 rounded-xl px-4 py-3 text-white shadow-2xl '+(bad?'bg-red-700':'bg-green-700');clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.add('hidden'),3600)}
async function api(endpoint,method='GET',body){try{const r=await fetch(BASE+'/'+endpoint,{method,headers:{apikey:KEY,Authorization:'Bearer '+KEY,...(state.adminSession?.token?{'x-bn-session':state.adminSession.token}:{}),'Content-Type':'application/json',Prefer:'return=representation'},...(body!==undefined?{body:JSON.stringify(body)}:{})});if(!r.ok){let e=await r.json().catch(()=>({}));throw Error(e.message||'HTTP '+r.status)}return r.status===204?true:await r.json()}catch(e){console.error('Supabase',endpoint,e);toast(e.message||'Database tidak tersedia',true);throw e}}

// Autentikasi custom dengan tabel bn_app_users (tanpa Supabase Auth).
async function staffRPC(name,data){
 const response=await fetch(BASE+'/rpc/'+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(data)});
 const result=await response.json().catch(()=>null);
 if(!response.ok)throw Error(result?.message||'Login gagal');
 return result;
}
async function restoreAdmin(){
 const raw=sessionStorage.getItem('bnStaffSession');if(!raw)return;
 try{const old=JSON.parse(raw);if(!old.token)throw Error('Sesi kosong');
 const profile=await staffRPC('bn_staff_validate',{p_token:old.token});
 if(!profile||!['admin','kasir'].includes(profile.role))throw Error('Sesi berakhir');
 state.adminSession={...profile,token:old.token};
 }catch(e){state.adminSession=null;sessionStorage.removeItem('bnStaffSession')}
}
function renderAdminLogin(){
 app.innerHTML='<div class="card max-w-md mx-auto fade"><div class="text-center mb-5"><div class="text-4xl text-amber-700 mb-3">'+icon('shield-halved')+'</div>'+title('Login Petugas','Masuk menggunakan username dan PIN yang dibuat di tabel user Supabase.')+'</div><form onsubmit="loginAdmin(event)" class="space-y-4"><label class="block font-semibold">Username</label><input class="field" type="text" id="adminUsername" autocomplete="username" autocapitalize="none" maxlength="32" required placeholder="adminutama / kasir01"><label class="block font-semibold">PIN</label><input class="field" type="password" inputmode="numeric" id="adminPin" autocomplete="current-password" pattern="[0-9]{8,12}" required minlength="8" maxlength="12" placeholder="8–12 angka"><button id="adminLoginButton" class="btn w-full">Masuk</button></form><button class="mt-5 underline text-sm" onclick="nav(\'home\')">Kembali ke Beranda</button></div>';
}
async function loginAdmin(e){
 e.preventDefault();const btn=document.getElementById('adminLoginButton');btn.disabled=true;btn.textContent='Memeriksa akun...';
 try{const username=document.getElementById('adminUsername').value.trim().toLowerCase();const pin=document.getElementById('adminPin').value;
 if(!/^[a-z0-9_]{3,32}$/.test(username)||!/^[0-9]{8,12}$/.test(pin))throw Error('Username atau PIN tidak valid');
 const session=await staffRPC('bn_staff_login',{p_username:username,p_pin:pin});
 if(!session?.token||!['admin','kasir'].includes(session.role))throw Error(session?.error||'Login gagal');
 state.adminSession=session;sessionStorage.setItem('bnStaffSession',JSON.stringify(session));toast('Selamat datang, '+session.username);await nav('admin');
 }catch(err){toast(err.message||'Login gagal',true);btn.disabled=false;btn.textContent='Masuk';}
}
async function logoutAdmin(){
 const token=state.adminSession?.token;
 state.adminSession=null;sessionStorage.removeItem('bnStaffSession');sessionStorage.removeItem('bnAdminVisited');
 if(token)staffRPC('bn_staff_logout',{p_token:token}).catch(console.warn);
 toast('Anda telah keluar');await nav('home');
}
function renderKasirLimited(){
 app.innerHTML='<div class="card max-w-xl mx-auto fade">'+title('Area Kasir','Halo, '+esc(state.adminSession.username))+'<p class="muted">Akun dengan role kasir berhasil masuk. Pengelolaan pengaturan, produk, dan sampel hanya tersedia untuk Admin.</p><div class="mt-4 rounded-xl bg-amber-50 p-4">Fitur transaksi kasir masih ditunda sesuai permintaan. Silakan minta Admin apabila perlu perubahan program.</div><button class="btn mt-5" onclick="logoutAdmin()">Keluar</button></div>';
}
const q=s=>encodeURIComponent(s);
function syncOnlineMember(){state.onlineType=state.phone?'member':'nonmember'}
async function loadCore(){syncOnlineMember();bnRefreshMemberTab();const [m,c]=await Promise.all([api('menu_bentarngopi?select=*&active=eq.true&order=name.asc'),api('bn_settings?id=eq.1&select=*')]);state.menu=m||[];state.settings=c?.[0]||null;state.onlineCart=state.onlineCart.filter(x=>state.menu.some(m=>m.id===x.id&&m.active));}
async function stopCamera(){if(state.camera){try{await state.camera.stop()}catch(e){}try{state.camera.clear()}catch(e){}state.camera=null}}

function etaDisplay(value){if(!value)return '';const p=value.split('-');if(p.length!==3)return esc(value);return new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(value+'T12:00:00Z'))}
function actualDate(value){if(!value)return null;return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(value))}
function sampleDateComparison(x){const actual=actualDate(x.actual_received_at);const estimated=x.estimated_received_date;if(!actual)return estimated?'<div class="mt-3 p-3 bg-amber-50 border border-amber-200 rounded-lg text-sm"><b>Estimasi diterima:</b> '+etaDisplay(estimated)+'<p class="text-xs mt-1">Tanggal aktual belum dicatat (akan otomatis tercatat saat admin menandai diterima).</p></div>':'<p class="muted mt-3">Estimasi belum ditentukan; tanggal aktual belum tercatat.</p>';let note='';if(estimated){const days=Math.round((Date.parse(actual+'T00:00:00Z')-Date.parse(estimated+'T00:00:00Z'))/86400000);note=days===0?'Tepat sesuai estimasi':days<0?'Lebih cepat '+Math.abs(days)+' hari dari estimasi':'Terlambat '+days+' hari dari estimasi'}return '<div class="mt-3 p-3 bg-stone-50 border border-stone-200 rounded-lg text-sm"><div><b>Estimasi diterima:</b> '+(estimated?etaDisplay(estimated):'Belum ditentukan')+'</div><div class="mt-1"><b>Aktual diterima:</b> '+etaDisplay(actual)+'</div>'+(note?'<p class="font-semibold mt-2 '+(actual>estimated?'text-red-700':'text-green-700')+'">'+note+'</p>':'<p class="muted mt-2">Tidak ada estimasi untuk dibandingkan.</p>')+'</div>'}
// Tampilkan ulasan sampel lama (teks) maupun format rating JSON yang baru.
// Dipakai setelah status sampel berubah menjadi reviewed, termasuk di Admin.
function formatReview(value){
 if(value===null||value===undefined||value==='')return 'Ulasan telah dikirim.';
 let data=value;
 if(typeof data==='string'){
  try{data=JSON.parse(data)}catch{return data.trim()||'Ulasan telah dikirim.'}
 }
 if(!data||typeof data!=='object')return String(data??'Ulasan telah dikirim.');
 const labels=[['rasa','Rasa'],['aroma','Aroma'],['manis','Tingkat Manis'],['penyajian','Penyajian']];
 const scores=labels.filter(([key])=>Number.isFinite(Number(data[key]))&&Number(data[key])>=1&&Number(data[key])<=5)
  .map(([key,label])=>label+': '+Number(data[key])+'/5');
 const comment=String(data.keterangan??data.comment??data.review??'').trim();
 return [...scores,comment].filter(Boolean).join(' • ')||'Ulasan telah dikirim.';
}

imal '+state.settings.stamp_max_transaction+' / transaksi.</p><button class="btn mt-4 w-full" '+(m.stamps<cost?'disabled':'')+' onclick="claimReward()">Klaim Free Kopi ('+cost+' stamp)</button></div></div><div class="card mb-4"><div class="flex items-center justify-between gap-3 mb-3"><div><div class="section-kicker">Order Online</div><h2 class="font-extrabold text-lg">Pesanan Aktif & Tracking <span id="bnActiveOrderCount" class="tag ml-2">0</span></h2></div><button class="btn" onclick="loadMyOrders()">Refresh</button></div><p class="muted mb-3">Hanya pesanan yang belum selesai ditampilkan di sini. Pesanan selesai otomatis dipindahkan ke Riwayat Pembelian. Status dan alur proses ditampilkan langsung pada setiap pesanan aktif.</p><div id="myOrders" class="space-y-3"></div></div><div class="card mb-4"><div class="flex justify-between gap-2 items-center"><h2 class="font-extrabold text-lg">Free Sampel</h2><span class="tag">Sisa '+remaining+' / '+state.settings.sample_quota+'</span></div><p class="muted my-2">'+(state.settings.sample_open?'Pengajuan sedang dibuka':'Pengajuan sedang ditutup')+' • Maks. '+state.settings.sample_per_member+' pengajuan per member per bulan (WIB)</p><button class="btn my-2" '+(disable?'disabled':'')+' onclick="nav(\'request\')">'+esc(sampleText)+'</button><div class="mt-3"><h3 class="font-semibold">Riwayat & status sampel</h3>'+sampleRows()+'</div></div><div class="card mb-4"><h2 class="font-extrabold text-lg">Riwayat Pembelian</h2><p class="muted mb-3">Pembelian kasir/member dan pesanan online yang sudah selesai.</p><div id="bnCompletedOnlineOrders" class="space-y-3"><p class="muted">Memuat riwayat online...</p></div><div class="mt-4 border-t pt-3 text-sm font-bold text-stone-700">Transaksi Kasir / Member</div>'+(state.purchases.map(x=>'<div class="border-t py-3"><div class="flex justify-between"><b>'+fmt(x.created_at)+'</b><b>'+money(x.total)+'</b></div><p class="muted">+'+x.stamps_earned+' stamp • '+(x.bn_purchase_items||[]).map(y=>esc(y.na let bnDetailDataset=null;
let bnDetailVisible={online:[],cashier:[]};
const bnDetailNum=x=>Number(x||0)||0;
function bnDetailWIB(value){return value?new Date(value).toLocaleString('id-ID',{timeZone:'Asia/Jakarta',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'-'}
function bnDetailSafeCell(value){
 // Protect spreadsheet viewers against CSV formula injection.
 let text=String(value??'');
 if(/^[\s\u0000-\u001f]*[=+@-]/.test(text))text="'"+text;
 return '"'+text.replace(/"/g,'""')+'"';
}
function bnDetailPieces(order){
 const items=Array.isArray(order.items)?order.items:[];
 return items.map(i=>{
  const toppings=Array.isArray(i.toppings)?i.toppings:[];
  const extras=toppings.map(t=>typeof t==='object'?(t.name||''):t).filter(Boolean).join(', ');
  return {name:i.product_name||i.name||'Produk',qty:bnDetailNum(i.quantity||i.qty),price:bnDetailNum(i.unit_price),subtotal:bnDetailNum(i.subtotal??bnDetailNum(i.unit_price)*bnDetailNum(i.quantity||i.qty)),extra:extras,ice:i.ice||'',sugar:i.sugar||''};
 });
}
function bnDetailStatusName(s){return {pending:'Menunggu',confirmed:'Dikonfirmasi',processing:'Diproses',completed:'Selesai',cancelled:'Dibatalkan'}[s]||s||'-'}

function bnDetailDateFilter(){

async function bnLoadDetailReport(){
 const target=document.getElementById('bnDetailContent');if(!target||state.adminSession?.role!=='admin')return;
 const {from,to}=bnDetailDateFilter();
 if(!/^\d{4}-\d{2}-\d{2}$/.test(from||'')||!/^\d{4}-\d{2}-\d{2}$/.test(to||'')||from>to){toast('Pilih rentang tanggal yang valid',true);return}
 const days=Math.round((Date.parse(to+'T00:00:00Z')-Date.parse(from+'T00:00:00Z'))/86400000);
 if(days>89){toast('Maksimal 90 hari per laporan',true);return}
 target.innerHTML='<p class="muted">Memuat transaksi dan detail produk...</p>';
 bnDetailDataset=null;
 for(const id of ['bnExportAll','bnExportOnline','bnExportCashier']){const el=document.getElementById(id);if(el)el.disabled=true}
 try{
  const response=await staffRPC('bn_admin_detailed_report',{p_token:state.adminSession.token,p_from:from,p_to:to});
  bnDetailDataset={online:Array.isArray(response.online)?response.online:[],cashier:Array.isArray(response.cashier)?response.cashier:[]};
  bnFilterDetailReport();
 }catch(err){target.innerHTML='<p class="text-red-700 font-semibold">Gagal mengambil laporan detail: '+esc(err.message||'Periksa SQL laporan detail')+'</p>';}

function bnFilterDetailReport(){
 if(!bnDetailDataset)return;
 const status=document.getElementById('bnDetailStatus')?.value||'all';
 const payment=document.getElementById('bnDetailPayment')?.value||'all';
 const service=document.getElementById('bnDetailService')?.value||'all';
 const q=(document.getElementById('bnDetailSearch')?.value||'').trim().toLowerCase();
 const online=bnDetailDataset.online.filter(o=>
  (status==='all'||o.status===status)&&
  (payment==='all'||o.payment_method===payment)&&
  (service==='all'||o.service_type===service)&&
  (!q||[o.order_no,o.customer_name,o.customer_phone].join(' ').toLowerCase().includes(q))
 );
 // Filters for payment/status/service apply only to online transactions.
 const cashier=bnDetailDataset.cashier.filter(o=>!q||[o.id,o.phone,o.customer_name].join(' ').toLowerCase().includes(q));
 bnDetailVisible={online,cashier};
 const sum=xs=>xs.reduce((a,o)=>a+bnDetailNum(o.total),0);
 const completed=online.filter(o=>o.status==='completed');
 const summary=document.getElementById('bnDetailSummary');
 const mini=(label,value,tip)=>'<div class="bn-detail-stat"><span>'+label+'</span><strong>'+value+'</strong><small>'+tip+'</small></div>';
 if(summary)summary.innerHTML='<div class="bn-detail-stats">'
  +mini('Pesanan Online',online.length.toLocaleString('id-ID'),'Seluruh status')
  +mini('Online Selesai',money(sum(completed)),completed.length+' order selesai')
  +mini('Cash',money(sum(completed.filter(o=>o.payment_method==='cash'))),'Online selesai')
  +mini('QRIS',money(sum(completed.filter(o=>o.payment_method==='qris'))),'Online selesai')
  +mini('COD',money(sum(completed.filter(o=>o.payment_method==='cod'))),'Online selesai')
  +mini('Pengantaran',money(sum(completed.filter(o=>o.service_type==='delivery'))),'Bagian dari total online')
  +mini('Transaksi Kasir',money(sum(cashier)),cashier.length+' struk; terpisah')
  +'</div>';
 const target=document.getElementById('bnDetailContent');if(!target)return;
 const onlineRows=online.map(o=>{
  const items=bnDetailPieces(o);
  return '<tr><td><b>'+esc(o.order_no||o.id)+'</b><div class="text-xs text-stone-500">'+esc(bnDetailWIB(o.created_at))+'</div></td><td>'+esc(o.customer_name||'-')+'<div class="text-xs text-stone-500">'+esc(o.customer_phone||'')+'</div></td><td>'+esc(bnDetailStatusName(o.status))+'</td><td>'+esc(paymentLabel(o.payment_method))+'</td><td>'+esc(serviceLabel(o.service_type))+'</td><td><details><summary class="cursor-pointer font-semibold">'+items.length+' jenis produk</summary>'+items.map(i=>'<div class="border-b py-1">'+esc(i.name)+' × '+i.qty+' = '+money(i.subtotal)+(i.extra?'<div class="text-xs">Topping: '+esc(i.extra)+'</div>':'')+'</div>').join('')+'</details></td><td class="font-bold text-right whitespace-nowrap">'+money(o.total)+'</td></tr>';
 }).join('');
 const cashierRows=cashier.map(o=>'<tr><td><b>'+esc(String(o.id||'').slice(0,12))+'</b><div class="text-xs text-stone-500">'+esc(bnDetailWIB(o.created_at))+'</div></td><td>'+esc(o.customer_name||o.phone||'-')+'</td><td><details><summary class="cursor-pointer font-semibold">'+bnDetailPieces(o).length+' jenis produk</summary>'+bnDetailPieces(o).map(i=>'<div class="border-b py-1">'+esc(i.name)+' × '+i.qty+' = '+money(i.subtotal)+'</div>').join('')+'</details></td><td class="font-bold text-right whitespace-nowrap">'+money(o.total)+'</td></tr>').join('');
 target.innerHTML='<div class="bn-detail-table"><h3 class="font-black text-lg mb-3">Pesanan Online ('+online.length+')</h3><div class="overflow-x-auto"><table><thead><tr><th>Nomor / Tanggal</th><th>Pelanggan</th><th>Status</th><th>Bayar</th><th>Layanan</th><th>Produk</th><th>Total</th></tr></thead><tbody>'+(onlineRows||'<tr><td colspan="7" class="text-center">Belum ada data</td></tr>')+'</tbody></table></div></div>'
 +'<div class="bn-detail-table mt-4"><h3 class="font-black text-lg mb-3">Transaksi Kasir / Member ('+cashier.length+')</h3><div class="overflow-x-auto"><table><thead><tr><th>Nomor / Tanggal</th><th>Member</th><th>Produk</th><th>Total</th></tr></thead><tbody>'+(cashierRows||'<tr><td colspan="4" class="text-center">Belum ada data</td></tr>')+'</tbody></table></div></div>';
 for(const id of ['bnExportAll','bnExportOnline','bnExportCashier']){const el=document.getElementById(id);if(el)el.disabled=false}
}
function bnExportDetailCsv(scope){
 if(!bnDetailDataset){toast('Tampilkan data terlebih dahulu',true);return}
 const {from,to}=bnDetailDateFilter();
 const cols=['Sumber','Nomor Transaksi','Tanggal Dibuat (WIB)','Status','Nama Pelanggan','WhatsApp','Pembayaran','Layanan','Alamat','Nama Produk','Qty','Harga Satuan','Topping','Gula','Es','Subtotal Produk','Total Pesanan','Tanggal Proses','Jam Proses'];
 const lines=[cols];
 if(scope!=='cashier')for(const o of bnDetailVisible.online){
  const items=bnDetailPieces(o);
  for(const item of (items.length?items:[{name:'',qty:0,price:0,subtotal:0,extra:'',sugar:'',ice:''}]))lines.push([
   'Online',o.order_no||o.id,bnDetailWIB(o.created_at),bnDetailStatusName(o.status),o.customer_name,o.customer_phone,o.payment_method,o.service_type,o.delivery_address,item.name,item.qty,item.price,item.extra,item.sugar,item.ice,item.subtotal,o.total,o.process_date||'',o.process_time||''
  ]);
 }
 if(scope!=='online')for(const o of bnDetailVisible.cashier){
  const items=bnDetailPieces(o);
  for(const item of (items.length?items:[{name:'',qty:0,price:0,subtotal:0}]))lines.push([
   'Kasir',o.id,bnDetailWIB(o.created_at),'Tercatat',o.customer_name||'',o.phone||'','Tidak tercatat','Kasir','',item.name,item.qty,item.price,'','','',item.subtotal,o.total,'',''
  ]);
 }
 if(lines.length===1){toast('Tidak ada data untuk diekspor',true);return}
 // UTF-8 BOM + semicolon separator so Excel Indonesia reads columns correctly.
 const data='\ufeffsep=;\r\n'+lines.map(row=>row.map(bnDetailSafeCell).join(';')).join('\r\n');
 const blob=new Blob([data],{type:'text/csv;charset=utf-8;'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;
 a.download='Bentar-ngopi-Laporan-'+scope+'-'+from+'-sd-'+to+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
}

function bnMonthKey(value){
 const d=new Date(value);if(Number.isNaN(d.getTime()))return '';
 return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit'}).format(d).replace(/\//g,'-');
}
function bnLocalMonthToday(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit'}).formatToParts(new Date());return parts.find(x=>x.type==='year')?.value+'-'+parts.find(x=>x.type==='month')?.value;}
function bnCurrentMonthSamples(rows){const key=bnLocalMonthToday();return (rows||[]).filter(x=>bnMonthKey(x.created_at||x.date)===key);}
function bnSampleEligible(cfg,memberSamples,allSamples){
 const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
 const start=cfg.sample_period_start||'';const end=cfg.sample_period_end||'';
 const allowed=(!start||today>=start)&&(!end||today<=end);
 const m=bnCurrentMonthSamples(memberSamples).length;const total=bnCurrentMonthSamples(allSamples).length;
 return {allowed,m,total,remaining:Math.max(0,Number(cfg.sample_quota||0)-total),limit:Math.max(1,Number(cfg.sample_per_member||1))};
}

function savedOrderAccess(){try{return JSON.parse(localStorage.getItem('bnOrderAccessV1')||'[]')}catch{return []}}
function bnOrderTrackUrl(id,secret){return location.origin+location.pathname+location.search+'#tracking='+encodeURIComponent(id+':'+secret)}
function bnOrderRefFromText(value){
 let v=String(value||'').trim();
 if(v.includes('#tracking=')){v=v.split('#tracking=')[1].split('&')[0];try{v=decodeURIComponent(v)}catch{}}
 const m=v.match(/^([0-9a-fA-F-]{36}):([0-9a-fA-F]{64})$/);
 return m?{id:m[1],secret:m[2].toLowerCase()}:null;
}
function bnOrderQr(target,id,secret){
 const el=typeof target==='string'?document.getElementById(target):target;
 if(!el)return;if(typeof QRCode==='undefined'){el.textContent='QR belum tersedia, gunakan link tracking.';return;}
 el.innerHTML='';new QRCode(el,{text:bnOrderTrackUrl(id,secret),width:192,height:192,colorDark:'#3e2217',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
}
function bnOpenTracking(id){const a=savedOrderAccess().find(x=>x.id===id);if(!a)return toast('Kode tracking belum tersimpan',true);state.view='tracking';const target='#tracking='+encodeURIComponent(a.id+':'+a.secret);if(location.hash===target)render();else location.hash=target}

}

function bnTrackingTimeline(o){
 const steps=bnOrderSteps;const at=steps.findIndex(x=>x[0]===o.status);
 const history=Array.isArray(o.status_history)?o.status_history:[];
 return '<div class="space-y-3">'+steps.map((step,i)=>{
 const ev=history.find(x=>x.status===step[0]);
 const done=o.status!=='cancelled'&&at>=i;
 return '<div class="flex items-start gap-3"><span class="inline-flex shrink-0 rounded-full w-9 h-9 items-center justify-center font-bold '+(done?'bg-green-700 text-white':'bg-stone-100 text-stone-500')+'">'+(done?'✓':String(i+1))+'</span><div class="pt-1"><p class="font-bold">'+step[1]+'</p><p class="muted text-xs">'+(ev?fmt(ev.changed_at):done&&i===0?fmt(o.created_at):'Menunggu perubahan status')+'</p></div></div>';
 }).join('')+(o.status==='cancelled'?'<p class="text-red-700 font-semibold">Pesanan dibatalkan.</p>':'')+'</div>';
}
let bnLiveTrackingTimer=null;
let bnLiveTrackingBusy=false;
let bnLiveOrderCurrentStatus=null;
function bnStopLiveOrderTracking(){
 if(bnLiveTrackingTimer!==null)clearInterval(bnLiveTrackingTimer);
 bnLiveTrackingTimer=null;bnLiveTrackingBusy=false;
}
function bnStartLiveOrderTracking(access,status){
 bnStopLiveOrderTracking();bnLiveOrderCurrentStatus=status;
 if(status==='completed'||status==='cancelled')return;
 const hash=location.hash;
 bnLiveTrackingTimer=setInterval(async()=>{
  if(state.view!=='tracking'||location.hash!==hash||!document.getElementById('bnLiveTrackingTimeline')){
   bnStopLiveOrderTracking();return;
  }
  if(document.hidden||bnLiveTrackingBusy)return;
  bnLiveTrackingBusy=true;
  const indicator=document.getElementById('bnLiveTrackingIndicator');
  try{
   const order=await api('rpc/bn_customer_order_detail','POST',{p_order_id:access.id,p_access_token:access.secret});
   if(state.view!=='tracking'||location.hash!==hash)return;
   const status=document.getElementById('bnLiveOrderStatus');
   const timeline=document.getElementById('bnLiveTrackingTimeline');
   const checked=document.getElementById('bnLiveTrackingChecked');
   if(status)status.textContent=orderStatusLabel(order.status);
   if(timeline)timeline.innerHTML=bnTrackingTimeline(order);
   if(checked)checked.textContent='Terakhir diperbarui: '+new Date().toLocaleTimeString('id-ID');
   if(indicator){indicator.textContent='● Status terbaru';indicator.classList.remove('text-red-700')}
   if(order.status!==bnLiveOrderCurrentStatus){
    const previous=bnLiveOrderCurrentStatus;bnLiveOrderCurrentStatus=order.status;
    if(order.status==='completed'&&previous!=='completed'){
     bnStopLiveOrderTracking();
     await bnRenderOrderReview(order,access);
     toast('Pesanan selesai, Anda dapat memberikan review');
    }
   }
   if(order.status==='completed'||order.status==='cancelled')bnStopLiveOrderTracking();
  }catch(err){if(indicator){indicator.textContent='● Koneksi terputus · gunakan Refresh';indicator.classList.add('text-red-700')}}
  finally{bnLiveTrackingBusy=false;}
 },15000);
}

n class="btn !bg-stone-600 w-full" onclick="nav(\'home\')">Kembali ke Katalog</button></div>';
 bnOrderQr('bnTrackingQR',payload.id,payload.secret);
 const reviewHost=document.createElement('section');reviewHost.id='bnOrderReviewHost';reviewHost.className='card';
 const containers=el.querySelector('.max-w-xl');if(containers)containers.appendChild(reviewHost);
 await bnRenderOrderReview(o,payload);
 bnStartLiveOrderTracking(payload,o.status);

 }catch(e){el.innerHTML='<div class="card max-w-xl mx-auto"><h2 class="text-red-700 font-bold">Tracking gagal dimuat</h2><p class="muted mt-2">'+esc(e.message||'Periksa koneksi dan kode akses pesanan.')+'</p><button class="btn mt-4" onclick="renderOrderTracking()">Coba Lagi</button></div>'}

state.onlineCart=[];renderOrderSuccess();if(serviceType!=='delivery'||!state.orderLocation?.url)toast('Pesanan tersimpan dan masuk ke Admin')}catch(error){btn.disabled=false}}

function shareOnlineOrder(){if(!state.lastOrder)return;window.open('https://wa.me/'+ADMIN_WA+'?text='+encodeURIComponent(orderWaText(state.lastOrder)),'_blank','noopener,noreferrer')}
function renderOrderSuccess(){const o=state.lastOrder;if(!o)return nav('home');
 app.innerHTML='<div class="max-w-xl mx-auto space-y-4 pb-24"><div class="card text-center p-7"><div class="text-5xl text-green-700 mb-4">'+icon('circle-check')+'</div><h1 class="text-2xl font-black">Pesanan Tersimpan!</h1><p class="muted mt-2">Nomor pesanan</p><p class="font-black text-xl text-coffee-800">'+esc(o.order_no)+'</p><p class="font-extrabold my-4">'+money(o.total)+'</p><p class="text-sm">'+esc(serviceLabel(o.service_type))+' • '+esc(paymentLabel(o.payment_method))+'</p><p class="muted mt-2">Admin akan mengatur tanggal dan jam proses. Pantau status melalui link tracking.</p></div><div class="card text-center"><h2 class="font-black mb-2">QR Kode Pesanan</h2><p class="muted mb-3">Tunjukkan QR kepada petugas saat pengambilan atau penerimaan pesanan.</p><div id="bnOrderSuccessQR" class="w-fit mx-auto bg-white border rounded-xl p-3"></div><div class="grid grid-cols-2 gap-2 mt-4"><button class="btn" onclick="bnOpenTracking('+JSON.stringify(o.order_id)+')">Lacak Pesanan</button><button class="btn !bg-stone-700" onclick="bnCopyTracking('+JSON.stringify(o.order_id)+')">Salin Link</button></div></div>'+(o.payment_method==='qris'?'<div class="card text-center"><h2 class="font-bold mb-2">Pembayaran QRIS</h2><img src="'+BN_QRIS_IMAGE+'" alt="QRIS Pembayaran" class="max-w-xs mx-auto rounded-xl"></div>':'')+'<button class="btn w-full !bg-green-700" onclick="shareOnlineOrder()">'+icon('whatsapp')+' Bagikan ke WhatsApp Admin</button><button class="btn w-full !bg-stone-600" onclick="nav(\'home\')">Kembali</button></div>';
 const a=savedOrderAccess().find(x=>x.id===o.order_id);if(a)bnOrderQr('bnOrderSuccessQR',a.id,a.secret);
}
async function loadAdminOrders(){const el=document.getElementById('onlineAdminOrders');if(!el||state.adminSession?.role!=='admin')return;el.innerHTML='<p class="muted">Memuat pesanan...</p>';try{const data=await staffRPC('bn_admin_online_orders',{p_token:state.adminSession.token});const orders=Array.isArray(data)?data:[];
try{const locs=await staffRPC('bn_admin_order_locations',{p_token:state.adminSession.token});const byId=new Map((Array.isArray(locs)?locs:[]).map(o=>[String(o.id),o]));orders.forEach(o=>Object.assign(o,byId.get(String(o.id))||{}))}catch(err){console.warn('Lokasi pesanan tidak tersedia',err)}
el.innerHTML=orders.length?orders.map(o=>'<article class="rounded-xl border p-3 space-y-3"><div class="flex items-center justify-between gap-2"><b>'+esc(o.order_no)+'</b><span class="tag">'+esc(orderStatusLabel(o.status))+'</span></div><div class="text-sm">'+esc(o.customer_name)+' · '+esc(o.customer_phone)+' · '+esc(o.customer_type)+'</div><p class="text-xs text-stone-500">'+new Date(o.created_at).toLocaleString('id-ID')+'</p><div class="text-sm space-y-1"><p><b>Layanan:</b> '+esc(serviceLabel(o.service_type))+'</p><p><b>Pembayaran:</b> '+esc(paymentLabel(o.payment_method))+'</p><p><b>Alamat/Keterangan:</b> '+esc(o.delivery_address)+'</p>'+bnLocationButton(o)+'<p><b>Jadwal proses:</b> '+esc(processLabel(o))+'</p></div>'+(o.payment_method==='qris'?'<details class="rounded-xl border p-2"><summary class="cursor-pointer font-medium">Lihat QRIS</summary><img src="'+BN_QRIS_IMAGE+'" alt="QRIS BentarNgopi" class="w-full max-w-xs mt-2 rounded-xl border bg-white"></details>':'')+(o.notes?'<p class="muted">Catatan: '+esc(o.notes)+'</p>':'')+'<div class="text-sm">'+(o.items||[]).map(i=>esc(i.product_name)+' × '+i.quantity).join(' • ')+'</div><b>'+money(o.total)+'</b><div class="grid md:grid-cols-[1fr_1fr_auto] gap-2 items-end border-t pt-3"><label class="text-sm font-semibold">Tanggal Proses<input type="date" id="schedDate_'+o.id+'" class="field mt-1" value="'+esc(o.process_date||'')+'"></label><label class="text-sm font-semibold">Jam Proses<input type="time" id="schedTime_'+o.id+'" class="field mt-1" value="'+esc((o.process_time||'').slice(0,5))+'"></label><button class="btn" onclick="setAdminOrderSchedule(\''+o.id+'\')">Simpan Jadwal</button></div><div class="flex flex-wrap gap-2">'+(o.status==='pending'?'<button class="btn" onclick="setAdminOrderStatus(\''+o.id+'\',\'confirmed\')">Konfirmasi</button>':o.status==='confirmed'?'<button class="btn" onclick="setAdminOrderStatus(\''+o.id+'\',\'processing\')">Proses</button>':o.status==='processing'?'<button class="btn" onclick="setAdminOrderStatus(\''+o.id+'\',\'completed\')">Selesai</button>':'')+(['pending','confirmed','processing'].includes(o.status)?'<button class="btn !bg-red-700" onclick="setAdminOrderStatus(\''+o.id+'\',\'cancelled\')">Batalkan</button>':'')+'</div></article>').join(''):'<p class="muted">Belum ada pesanan.</p>';bnDecorateAndFilterOrders(orders)}catch(e){el.innerHTML='<p class="text-red-700">Gagal memuat pesanan. Pastikan SQL pemesanan terbaru sudah dijalankan.</p>'}}
async function setAdminOrderStatus(id,status){if(!confirm('Ubah status pesanan menjadi '+status+'?'))return;try{await staffRPC('bn_admin_order_status',{p_token:state.adminSession.token,p_id:id,p_status:status});toast('Status pesanan diperbarui');loadAdminOrders()}catch(e){toast('Tidak dapat memperbarui status',true)}}
let bnOrderScanner=null;
async function bnStopOrderScanner(){if(bnOrderScanner){try{await bnOrderScanner.stop()}catch(e){}try{await bnOrderScanner.clear()}catch(e){}bnOrderScanner=null}}
async function bnStartOrderScanner(){
 if(!window.Html5Qrcode){toast('Scanner QR belum tersedia di browser',true);return}
 await bnStopOrderScanner();const el=document.getElementById('bnOrderScanner');if(!el)return;
 try{bnOrderScanner=new Html5Qrcode('bnOrderScanner');await bnOrderScanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},async text=>{const i=document.getElementById('bnOrderScanValue');if(i)i.value=text;await bnStopOrderScanner();toast('QR terdeteksi. Tekan Verifikasi & Serah Terima.');},()=>{})}catch(e){toast('Kamera gagal dibuka. Gunakan input link manual.',true)}
}
async function bnConfirmScannedOrder(){
 const parsed=bnOrderRefFromText(document.getElementById('bnOrderScanValue')?.value||'');
 if(!parsed)return toast('QR/link pemesanan tidak valid',true);
 if(!confirm('Konfirmasi pesanan sudah diterima pelanggan? Status pesanan akan menjadi Selesai.'))return;
 try{await staffRPC('bn_admin_confirm_order_receipt',{p_token:state.adminSession.token,p_order_id:parsed.id,p_access_token:parsed.secret});toast('Serah terima berhasil, pesanan selesai');document.getElementById('bnOrderScanValue').value='';loadAdminOrders()}catch(e){toast(e.message||'Tidak dapat konfirmasi serah terima',true)}
}
async function setAdminOrderSchedule(id){const p_process_date=document.getElementById('schedDate_'+id)?.value||null;const p_process_time=document.getElementById('schedTime_'+id)?.value||null;try{await staffRPC('bn_admin_set_order_schedule',{p_token:state.adminSession.token,p_id:id,p_process_date,p_process_time});toast('Jadwal proses disimpan');loadAdminOrders()}catch(e){toast(e.message||'Tidak dapat menyimpan jadwal',true)}}

window.addEventListener('hashchange',()=>{bnStopLiveOrderTracking();if(location.hash.startsWith('#tracking=')){state.view='tracking';render()}else if(location.hash==='#ngopidulu'&&state.view!=='admin')nav('admin');else if(location.hash!== '#ngopidulu'&&['admin','tracking'].includes(state.view))nav('home')});
if(state.view==='admin')sessionStorage.setItem('bnAdminVisited','1');updateAdminReturn();bnRefreshMemberTab();restoreAdmin().then(render);
</script></body></html>
