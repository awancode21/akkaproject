async function api(endpoint,method='GET',body){try{const r=await fetch(BASE+'/'+endpoint,{method,headers:{apikey:KEY,Authorization:'Bearer '+(state.adminSession?.access_token||KEY),'Content-Type':'application/json',Prefer:'return=representation'},...(body!==undefined?{body:JSON.stringify(body)}:{})});if(!r.ok){let e=await r.json().catch(()=>({}));throw Error(e.message||'HTTP '+r.status)}return r.status===204?true:await r.json()}catch(e){console.error('Supabase',endpoint,e);toast(e.message||'Database tidak tersedia',true);throw e}}

const AUTH_BASE=BASE.replace('/rest/v1','/auth/v1');
async function authRequest(path,body,token){
 const response=await fetch(AUTH_BASE+path,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body)});
 const data=await response.json().catch(()=>({}));
 if(!response.ok)throw Error(data.msg||data.error_description||data.message||'Autentikasi gagal');
 return data;
}
async function verifyAdmin(session){
 const r=await fetch(BASE+'/rpc/bn_is_admin',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:'{}'});
 if(!r.ok||await r.json()!==true)throw Error('Akun ini tidak memiliki akses Admin');
}
async function restoreAdmin(){
 const raw=sessionStorage.getItem('bnAdminSession');if(!raw)return;
 try{
  let session=JSON.parse(raw);
  if(!session.access_token||!session.refresh_token)throw Error('Session tidak valid');
  if(Date.now()/1000>=(session.expires_at||0)-60){
   const updated=await authRequest('/token?grant_type=refresh_token',{refresh_token:session.refresh_token});
   session={...updated,expires_at:Math.floor(Date.now()/1000)+updated.expires_in};
  }
  await verifyAdmin(session);state.adminSession=session;sessionStorage.setItem('bnAdminSession',JSON.stringify(session));
 }catch(err){console.warn('Sesi admin tidak valid:',err.message);state.adminSession=null;sessionStorage.removeItem('bnAdminSession')}
}

function etaDisplay(value){if(!value)return '';const p=value.split('-');if(p.length!==3)return esc(value);return new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(value+'T12:00:00Z'))}
function actualDate(value){if(!value)return null;return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(value))}
function sampleDateComparison(x){const actual=actualDate(x.actual_received_at);const estimated=x.estimated_received_date;if(!actual)return estimated?'<div class="mt-3 p-3 bg-amber-50 border border-amber-200 rounded-lg text-sm"><b>Estimasi diterima:</b> '+etaDisplay(estimated)+'<p class="text-xs mt-1">Tanggal aktual belum dicatat (akan otomatis tercatat saat admin menandai diterima).</p></div>':'<p class="muted mt-3">Estimasi belum ditentukan; tanggal aktual belum tercatat.</p>';let note='';if(estimated){const days=Math.round((Date.parse(actual+'T00:00:00Z')-Date.parse(estimated+'T00:00:00Z'))/86400000);note=days===0?'Tepat sesuai estimasi':days<0?'Lebih cepat '+Math.abs(days)+' hari dari estimasi':'Terlambat '+days+' hari dari estimasi'}return '<div class="mt-3 p-3 bg-stone-50 border border-stone-200 rounded-lg text-sm"><div><b>Estimasi diterima:</b> '+(estimated?etaDisplay(estimated):'Belum ditentukan')+'</div><div class="mt-1"><b>Aktual diterima:</b> '+etaDisplay(actual)+'</div>'+(note?'<p class="font-semibold mt-2 '+(actual>estimated?'text-red-700':'text-green-700')+'">'+note+'</p>':'<p class="muted mt-2">Tidak ada estimasi untuk dibandingkan.</p>')+'</div>'}
function sampleRows(){return state.samples.map(x=>{const stage=sampleStages.indexOf(x.status),steps=['Diajukan','Disetujui','Diproses','Diterima','Direview'];return '<div class="border-t py-4"><div class="flex justify-between items-start gap-2"><div><b>'+esc(x.type)+'</b><p class="muted">Kode '+esc(x.id)+' • Urutan #'+(x.queue_no??'-')+'</p><p class="font-semibold text-amber-800 mt-1">'+esc(statusLabel(x.status))+'</p></div><span class="tag">'+esc(x.status)+'</span></div><div class="grid grid-cols-5 gap-1 mt-3 text-center">'+steps.map((v,i)=>'<div class="text-[10px] sm:text-xs"><div class="h-2 rounded '+(stage>=i?'bg-amber-600':'bg-stone-200')+' mb-1"></div><span class="'+(stage>=i?'text-amber-900 font-semibold':'text-stone-400')+'">'+v+'</span></div>').join('')+'</div>'+sampleDateComparison(x)+(x.status==='received'?'<div class="text-center mt-4"><img class="mx-auto w-36 bg-white border rounded-lg p-2" src="'+qr(x.id)+'" alt="QR sampel"><p class="muted mt-2">Sampel sudah diterima. Silakan isi ulasan.</p><button class="btn mt-2" onclick="openReview(\''+esc(x.id)+'\')">Review Sampel</button></div>':'')+(x.status==='reviewed'?'<p class="mt-2 text-sm">'+esc(formatReview(x.review_comment))+'</p>':'')+'</div>'}).join('')||'<p class="muted">Belum pernah mengajukan sampel.</p>'}

async function saveSettings(e){if(!state.adminSession){toast('Login Admin diperlukan',true);return nav('admin');}e.preventDefault();let v={sample_open:document.getElementById('sampleOpen').checked,sample_quota:Number(document.getElementById('quota').value),sample_per_member:Number(document.getElementById('perMember').value),stamp_per_item:Number(document.getElementById('stampPer').value),stamp_max_transaction:Number(document.getElementById('maxStamp').value),reward_cost:Number(document.getElementById('rewardCost').value),updated_at:new Date().toISOString()};try{await api('bn_settings?id=eq.1','PATCH',v);toast('Pengaturan tersimpan');nav('admin')}catch(e){}}
async function addProduct(e){if(!state.adminSession){toast('Login Admin diperlukan',true);return nav('admin');}e.preventDefault();let data={id:'MENU-'+crypto.randomUUID().slice(0,12),name:document.getElementById('itemName').value.trim(),category:document.getElementById('itemCategory').value,price_normal:Number(document.getElementById('normalPrice').value),price_member:Number(document.getElementById('memberPrice').value),sample_enabled:document.getElementById('sampleEligible').checked,stamp_enabled:document.getElementById('stampEligible').checked,active:true};try{await api('menu_bentarngopi','POST',data);toast('Produk ditambahkan');nav('admin')}catch(e){}}
async function editProduct(id){if(!state.adminSession){toast('Login Admin diperlukan',true);return nav('admin');}let x=state.menu.find(y=>y.id===id);if(!x)return;let name=prompt('Nama produk',x.name);if(name===null)return;let normal=prompt('Harga normal',x.price_normal);if(normal===null)return;let member=prompt('Harga member',x.price_member);if(member===null)return;let cat=prompt('Kategori: kopi / non-kopi',x.category);if(cat===null)return;let sampel=confirm('Aktifkan produk untuk pengajuan sampel?');let stamp=confirm('Produk ini menghasilkan stamp?');if(!name.trim()||!['kopi','non-kopi'].includes(cat)||Number(normal)<0||Number(member)<0)return toast('Data produk tidak valid',true);try{await api('menu_bentarngopi?id=eq.'+q(id),'PATCH',{name:name.trim(),category:cat,price_normal:Number(normal),price_member:Number(member),sample_enabled:sampel,stamp_enabled:stamp});toast('Produk diperbarui');nav('admin')}catch(e){}}
async function deleteProduct(id){if(!state.adminSession){toast('Login Admin diperlukan',true);return nav('admin');}if(!confirm('Nonaktifkan produk ini? Riwayat pembelian tetap ada.'))return;try{await api('menu_bentarngopi?id=eq.'+q(id),'PATCH',{active:false,sample_enabled:false});toast('Produk dinonaktifkan');nav('admin')}catch(e){}}
async function saveSampleETA(id){if(!state.adminSession){toast('Login Admin diperlukan',true);return nav('admin');}const field=document.getElementById('eta-'+id);if(!field)return;const value=field.value||null;try{const changed=await api('nama_bentarngopi?id=eq.'+q(id),'PATCH',{estimated_received_date:value});if(!changed?.length)throw Error('Permintaan sampel tidak ditemukan');toast(value?'Estimasi tanggal berhasil disimpan':'Estimasi tanggal dihapus');nav('admin')}catch(e){toast(e.message||'Gagal menyimpan estimasi',true)}}
async function advanceSample(id,next){if(!state.adminSession){toast('Login Admin diperlukan',true);return nav('admin');}const previous={approved:'pending',processing:'approved',received:'processing'}[next];if(!previous)return;try{const changed=await api('nama_bentarngopi?id=eq.'+q(id)+'&status=eq.'+previous,'PATCH',{status:next});if(!changed?.length)throw Error('Status telah berubah, refresh terlebih dahulu');toast('Status sampel: '+statusLabel(next));nav('admin')}catch(e){toast(e.message||'Gagal memperbarui status',true)}}
function addCart(){let id=document.getElementById('purchaseItem').value,qty=Number(document.getElementById('purchaseQty').value);if(!id||!Number.isInteger(qty)||qty<1||qty>100)return toast('Produk/jumlah tidak valid',true);let line=state.cart.find(x=>x.id===id);if(line)line.qty+=qty;else state.cart.push({id,qty});drawCart()}
function removeCart(i){state.cart.splice(i,1);drawCart()}
function drawCart(){const el=document.getElementById('cartList');if(!el)return;el.innerHTML=state.cart.length?state.cart.map((x,i)=>{let m=state.menu.find(z=>z.id===x.id);return '<div class=\"flex justify-between border-b py-2\"><span>'+esc(m?.name)+' × '+x.qty+'</span><button type=\"button\" class=\"text-red-700\" onclick=\"removeCart('+i+')\">Hapus</button></div>'}).join('')+'<p class=\"muted mt-2\">Estimasi stamp: '+Math.min(state.settings.stamp_max_transaction,state.cart.reduce((sum,x)=>{let m=state.menu.find(y=>y.id===x.id);return sum+(m?.stamp_enabled?x.qty:0)},0)*state.settings.stamp_per_item)+'</p>':'<p class=\"muted\">Belum ada produk dimasukkan ke transaksi.</p>'}
async function addPurchase(e){e.preventDefault();let p=phoneVal(document.getElementById('purchasePhone').value);if(!state.cart.length)return toast('Tambahkan produk ke transaksi terlebih dahulu',true);try{let r=await api('rpc/bn_record_purchase','POST',{p_phone:p,p_items:state.cart});state.cart=[];toast('Transaksi tercatat: +'+r.stamps+' stamp • '+money(r.total));await stopCamera();nav('admin')}catch(e){}}
async function startScanner(){if(!window.Html5Qrcode)return toast('Library kamera tidak termuat',true);await stopCamera();try{state.camera=new Html5Qrcode('scanner');await state.camera.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},async text=>{document.getElementById('purchasePhone').value=phoneVal(text);toast('QR Member terbaca');await stopCamera()},()=>{})}catch(e){console.error(e);toast('Kamera gagal dibuka. Gunakan HTTPS atau pilih galeri.',true)}}
async function scanGallery(e){let file=e.target.files?.[0];if(!file)return;if(!window.Html5Qrcode)return toast('Library QR tidak tersedia',true);await stopCamera();try{const reader=new Html5Qrcode('scanner');let text=await reader.scanFile(file,true);document.getElementById('purchasePhone').value=phoneVal(text);toast('QR Member terbaca dari galeri');reader.clear()}catch(err){console.error(err);toast('QR tidak terbaca dari gambar',true)}}
window.addEventListener('hashchange',()=>{if(location.hash==='#ngopidulu'&&state.view!=='admin')nav('admin');else if(location.hash!=='#ngopidulu'&&state.view==='admin')nav('home')});
if(state.view==='admin')sessionStorage.setItem('bnAdminVisited','1');updateAdminReturn();restoreAdmin().then(render);
</script></body></html>
