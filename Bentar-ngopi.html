<!DOCTYPE html>

body{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif} .fade-in{animation:fadein .28s ease-out}@keyframes fadein{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
.input{width:100%;border:1px solid #d6d3d1;border-radius:.85rem;padding:.78rem .95rem;background:white;outline:none}.input:focus{border-color:#b45309;box-shadow:0 0 0 3px #fef3c7} .btn{border-radius:.85rem;padding:.78rem 1rem;font-weight:700;transition:.2s;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.btn-primary{background:#523023;color:white}.btn-primary:not(:disabled):hover{background:#3e2217}.btn-amber{background:#d97706;color:white}.btn-amber:not(:disabled):hover{background:#b45309}.card{background:white;border:1px solid #e7e5e4;border-radius:1.2rem;box-shadow:0 10px 30px #3e221710} .tab-active{background:#f59e0b;color:#3e2217!important}.star-button{font-size:2rem;color:#d6d3d1}.star-button.selected{color:#f59e0b}.star-button:focus-visible{outline:2px solid #b45309;border-radius:8px}

<body class="min-h-screen flex flex-col bg-stone-50 text-stone-800">
<header class="bg-coffee-900 text-white sticky top-0 z-30 shadow-lg"><div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center gap-3"><button data-view="request" class="font-extrabold text-xl tracking-tight"><i class="fa-solid fa-mug-hot text-amber-400 mr-2"></i>Bentar<span class="text-amber-400">Ngopi</span></button><nav class="flex gap-1 sm:gap-2 text-xs sm:text-sm font-semibold"><button class="px-2 sm:px-4 py-2 rounded-xl nav-button" data-view="request">Sampel</button><button class="px-2 sm:px-4 py-2 rounded-xl nav-button" data-view="scan">Review</button><button class="px-2 sm:px-4 py-2 rounded-xl nav-button" data-view="member">Member</button></nav></div></header>

<script>
'use strict';
// Public client configuration: use only a Supabase anon/publishable key, NEVER a service_role key.
const SUPABASE_URL='https://fqaewybhgsxlkgkvjnjv.supabase.co/rest/v1';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxYWV3eWJoZ3N4bGtna3Zqbmp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyODc4MzQsImV4cCI6MjEwNjg2MzgzNH0.s4Frl_Mpj77Fc321j7MWykvxaXA7XWkKjWzJKEn-LXE';
const app=document.getElementById('app');
const state={view:'request',phone:null,rating:0,reviewId:null,scanStream:null,scanLoop:null,viewVersion:0};
const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eq=(v)=>encodeURIComponent(String(v));
const phoneClean=(v)=>String(v??'').replace(/[\s\-()]/g,'').trim();
const validPhone=(v)=>/^\+?[0-9]{9,16}$/.test(v);
const stars=(n)=>Array.from({length:5},(_,i)=>`<i class="fa-${i<Number(n)?'solid':'regular'} fa-star"></i>`).join('');
const qr=(v,size=160)=>`https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${eq(v)}`;
const wrap=(title,subtitle,content)=>`<div class="fade-in max-w-2xl mx-auto"><div class="mb-7 text-center"><div class="text-amber-600 text-3xl mb-3"><i class="fa-solid fa-mug-saucer"></i></div><h1 class="text-3xl font-extrabold text-coffee-900">${title}</h1><p class="text-stone-500 mt-2">${subtitle}</p></div>${content}</div>`;
const spinner=()=>`<div class="flex justify-center p-12 text-amber-600 text-3xl"><i class="fa-solid fa-spinner fa-spin"></i></div>`;
function toast(message,type='success') {const el=document.createElement('div');el.className=`pointer-events-auto flex items-center gap-3 rounded-xl px-4 py-4 text-white shadow-2xl fade-in ${type==='error'?'bg-red-700':'bg-green-700'}`;const ic=document.createElement('i');ic.className=`fa-solid ${type==='error'?'fa-circle-exclamation':'fa-circle-check'}`;const txt=document.createElement('span');txt.className='flex-1 text-sm font-semibold';txt.textContent=message;el.append(ic,txt);document.getElementById('toastRegion').append(el);setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),320)},4000)}
async function api(endpoint,method='GET',body=null){
 try{const options={method,headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json',Prefer:'return=representation'}};if(body!==null)options.body=JSON.stringify(body);
 const res=await fetch(`${SUPABASE_URL}/${endpoint}`,options);const raw=await res.text();let data=null;try{data=raw?JSON.parse(raw):null}catch{data=raw}
 if(!res.ok){const msg=(data&&typeof data==='object'&&(data.message||data.error_description||data.details))||`HTTP ${res.status}`;throw new Error(msg)}return data;
 }catch(error){console.error('BentarNgopi API:',{endpoint,method,error});toast(`Database: ${error.message}`,'error');throw error}
}
const select=(table,params='')=>api(`${table}?select=*${params?'&'+params:''}`);
const today=()=>new Date().toISOString().slice(0,10);
const sampleId=()=>`SMPL-${(globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random()}`).replace(/-/g,'').slice(0,14).toUpperCase()}`;
function nav(view){stopCamera();state.view=view;state.rating=0;state.reviewId=null;if(view==='admin')history.replaceState(null,'','#ngopidulu');else if(location.hash==='#ngopidulu')history.replaceState(null,'',location.pathname+location.search);document.querySelectorAll('.nav-button').forEach(el=>el.classList.toggle('tab-active',el.dataset.view===view));render()}
function renderError(){app.innerHTML=`<div class="card max-w-lg mx-auto p-6 text-center"><i class="fa-solid fa-triangle-exclamation text-red-600 text-3xl"></i><h2 class="mt-3 text-xl font-bold">Data belum dapat dimuat</h2><p class="text-stone-500 mt-2">Periksa koneksi dan konfigurasi tabel/fungsi SQL Supabase.</p><button class="btn btn-primary mt-5" data-action="retry">Coba Lagi</button></div>`}
async function render(){const stamp=++state.viewVersion;app.innerHTML=spinner();try{
 if(state.view==='request'){const menus=await select('menu_bentarngopi','order=name.asc');if(stamp!==state.viewVersion)return;
 app.innerHTML=wrap('Minta Sampel Kopi','Pilih varian favoritmu. Kami akan memproses permintaan tester.',`<section class="card overflow-hidden"><div class="bg-coffee-800 text-white p-5 font-bold"><i class="fa-solid fa-gift text-amber-400 mr-2"></i>Form Permintaan Sampel</div><form id="requestForm" class="p-6 space-y-4"><label class="block text-sm font-semibold">Nama lengkap<input name="name" class="input mt-2" required maxlength="120" autocomplete="name"></label><label class="block text-sm font-semibold">Nomor WhatsApp<input name="phone" class="input mt-2" type="tel" required placeholder="08xxxxxxxxxx" autocomplete="tel"></label><label class="block text-sm font-semibold">Alamat pengiriman<textarea name="address" class="input mt-2" rows="3" required maxlength="1000"></textarea></label><label class="block text-sm font-semibold">Jenis sampel<select name="type" class="input mt-2" required><option value="">Pilih jenis kopi</option>${menus.map(m=>`<option value="${esc(m.name)}">${esc(m.name)}</option>`).join('')}</select></label><button class="btn btn-amber w-full" type="submit" ${menus.length?'':'disabled'}>Kirim Permintaan <i class="fa-solid fa-paper-plane ml-2"></i></button>${menus.length?'':'<p class="text-red-600 text-xs">Menu belum tersedia. Tambahkan menu melalui admin.</p>'}</form></section>`);
 }else if(state.view==='scan'){app.innerHTML=wrap('Scan & Review','Masukkan ID sampel, pindai QR dengan scanner, atau gunakan kamera jika didukung.',`<section class="card p-6"><form id="scanForm" class="flex gap-2"><input id="scanInput" class="input min-w-0 uppercase" placeholder="SMPL-XXXXXXXX" required aria-label="ID sampel"><button class="btn btn-amber" type="submit">Cari</button></form><button data-action="camera" class="mt-3 text-sm text-coffee-700 underline"><i class="fa-solid fa-camera mr-1"></i>Scan dengan kamera</button><div id="cameraWrap" class="hidden mt-4"><video id="cameraVideo" autoplay playsinline muted class="w-full rounded-xl bg-black max-h-80"></video><button data-action="cameraStop" class="mt-2 text-sm text-red-600 underline">Tutup kamera</button></div><div id="scanResult" class="mt-5"></div></section>`);
 }else if(state.view==='member'){await renderMember(stamp)
 }else if(state.view==='admin'){await renderAdmin(stamp)}
 }catch(e){if(stamp===state.viewVersion)renderError()}}
async function renderMember(stamp){if(!state.phone){app.innerHTML=wrap('Member Area','Kumpulkan 15 stamps untuk menikmati satu kopi gratis.',`<form id="loginForm" class="card p-6 space-y-4"><label class="block text-sm font-semibold">Nomor WhatsApp<input name="phone" type="tel" class="input mt-2" required placeholder="08xxxxxxxxxx"></label><label class="block text-sm font-semibold">Nama (opsional untuk member baru)<input name="name" class="input mt-2" maxlength="120" placeholder="Nama panggilan"></label><button class="btn btn-primary w-full">Lihat Kartu Member</button><p class="text-xs text-stone-500">Masuk melalui nomor HP ini hanya cocok untuk demo, bukan autentikasi aman.</p></form>`);return}
 const data=await select('members_bentarngopi',`phone=eq.${eq(state.phone)}`);if(stamp!==state.viewVersion)return;if(!data.length){state.phone=null;toast('Member tidak ditemukan','error');return render()}
 const m=data[0],points=Number(m.stamps||0),mod=Math.min(15,points);app.innerHTML=wrap('Kartu Member','Tunjukkan QR kepada kasir setiap membeli kopi.',`<section class="card overflow-hidden"><div class="bg-gradient-to-r from-coffee-900 to-coffee-700 p-6 text-white flex justify-between items-start"><div><div class="text-xs uppercase tracking-widest text-coffee-200">BentarNgopi Member</div><h2 class="text-2xl font-bold mt-2">${esc(m.name)}</h2><p class="text-coffee-200 text-sm">${esc(m.phone)}</p></div><button data-action="logout" class="text-xs underline">Keluar</button></div><div class="p-6"><img class="mx-auto p-3 border rounded-xl" width="184" height="184" alt="QR nomor WhatsApp member" src="${qr(m.phone)}"><p class="text-center text-xs text-stone-500 mt-2">Scan QR ini di kasir</p><div class="bg-stone-50 border p-5 rounded-2xl mt-7"><div class="flex justify-between items-center mb-3"><b>Stamps Terkumpul</b><strong class="text-amber-700 text-2xl">${points} <span class="text-sm text-stone-400">/ 15</span></strong></div><div class="bg-stone-200 h-3 rounded-full overflow-hidden"><div class="h-full bg-amber-500 rounded-full transition-all" style="width:${100*mod/15}%"></div></div><div class="grid grid-cols-5 gap-2 mt-5">${Array.from({length:15},(_,i)=>`<div class="aspect-square rounded-full grid place-items-center text-xs font-bold ${i<mod?'bg-amber-500 text-white':'bg-white border text-stone-300'}">${i<mod?'<i class="fa-solid fa-check"></i>':i+1}</div>`).join('')}</div><button data-action="claim" class="btn w-full mt-6 ${points>=15?'bg-green-700 text-white':'bg-stone-200 text-stone-500'}" ${points>=15?'':'disabled'}>${points>=15?'Klaim Free Kopi (−15 Stamp)':`Butuh ${15-points} Stamp Lagi`}</button></div></div></section>`)
}
async function renderAdmin(stamp){const [requests,menus]=await Promise.all([select('nama_bentarngopi','order=date.desc'),select('menu_bentarngopi','order=name.asc')]);if(stamp!==state.viewVersion)return;const sorted=[...requests].sort((a,b)=>(a.status==='pending'?0:a.status==='approved'?1:2)-(b.status==='pending'?0:b.status==='approved'?1:2));
app.innerHTML=`<div class="fade-in"><div class="mb-7"><span class="text-xs uppercase tracking-widest text-amber-700 font-bold">Panel Pengelola</span><h1 class="font-extrabold text-3xl text-coffee-900">Dashboard Admin</h1><p class="text-stone-500 text-sm mt-2">Akses URL tersembunyi tidak membatasi akses database. Gunakan autentikasi untuk produksi.</p></div><div class="grid md:grid-cols-2 gap-5 mb-6"><section class="card p-5"><h2 class="font-bold text-lg mb-4"><i class="fa-solid fa-list text-amber-600 mr-2"></i>Manajemen Menu</h2><form id="menuForm" class="flex gap-2"><input class="input min-w-0" name="name" required maxlength="120" placeholder="Nama minuman"><button class="btn btn-primary">Tambah</button></form><div class="mt-4 max-h-60 overflow-auto divide-y">${menus.length?menus.map(m=>`<div class="flex justify-between items-center gap-2 py-3"><span class="text-sm break-all">${esc(m.name)}</span><button data-action="deleteMenu" data-id="${esc(m.id)}" class="text-red-600 text-sm px-2 py-1" aria-label="Hapus ${esc(m.name)}"><i class="fa-solid fa-trash"></i></button></div>`).join(''):'<p class="text-sm text-stone-500 py-3">Belum ada menu.</p>'}</div></section><section class="card p-5 bg-amber-50"><h2 class="font-bold text-lg mb-3"><i class="fa-solid fa-cash-register text-amber-700 mr-2"></i>Transaksi Reguler (+1)</h2><form id="trxForm" class="space-y-3"><input name="phone" id="trxPhone" class="input" type="tel" required placeholder="Nomor HP / hasil scan QR"><input name="name" class="input" placeholder="Nama pelanggan baru (opsional)"><button class="btn btn-amber w-full">Tambah 1 Stamp</button></form><p class="text-xs text-stone-500 mt-3">Scanner QR USB umumnya mengisi input nomor lalu Enter.</p></section></div><section class="card overflow-hidden"><div class="bg-coffee-800 text-white p-5 flex justify-between"><h2 class="font-bold"><i class="fa-solid fa-box-open mr-2"></i>Permintaan Sampel</h2><span class="text-sm">${sorted.length} permintaan</span></div><div class="divide-y max-h-[65vh] overflow-auto">${sorted.length?sorted.map(req=>{const labels={pending:'Menunggu',approved:'Disetujui',reviewed:'Direview'};return `<article class="p-5 flex flex-col sm:flex-row sm:justify-between gap-4"><div class="min-w-0"><div class="flex flex-wrap gap-2 items-center"><h3 class="font-bold text-coffee-900">${esc(req.name)}</h3><span class="text-xs px-2 py-1 rounded-full ${req.status==='pending'?'bg-amber-100 text-amber-800':req.status==='approved'?'bg-blue-100 text-blue-800':'bg-green-100 text-green-800'}">${esc(labels[req.status]||req.status)}</span></div><p class="text-sm mt-1">${esc(req.type)} • ${esc(req.phone)}</p><p class="text-stone-500 text-xs mt-1">${esc(req.date)} • ${esc(req.address)}</p><p class="text-xs font-mono mt-1 text-stone-500">${esc(req.id)}</p>${req.status==='reviewed'?`<div class="mt-2 text-amber-500">${stars(req.review_rating)}</div><p class="text-sm mt-1 whitespace-pre-wrap">${esc(req.review_comment)}</p>`:''}</div><div class="shrink-0">${req.status==='pending'?`<button data-action="approve" data-id="${esc(req.id)}" class="btn bg-green-700 text-white">Setujui</button>`:`<div class="text-center"><img class="mx-auto border rounded p-1" width="100" height="100" alt="QR sampel ${esc(req.id)}" loading="lazy" src="${qr(req.id,120)}"><span class="text-xs text-stone-500">QR ID Sampel</span></div>`}</div></article>`}).join(''):'<p class="p-8 text-center text-stone-500">Belum ada permintaan.</p>'}</div></section></div>`
}
function busy(form,yes){const b=form?.querySelector('button[type=submit],button:not([type])');if(b)b.disabled=yes}
async function withBusy(form,fn){busy(form,true);try{await fn()}catch(e){}finally{busy(form,false)}}
async function lookupSample(id){const data=await select('nama_bentarngopi',`id=eq.${eq(id)}`);const out=document.getElementById('scanResult');if(!out)return;if(!data.length){out.innerHTML='<p class="text-red-700 bg-red-50 p-4 rounded-xl">Kode sampel tidak ditemukan.</p>';return}const r=data[0];state.reviewId=r.id;if(r.status==='pending'){out.innerHTML='<p class="text-amber-900 bg-amber-50 p-4 rounded-xl"><i class="fa-solid fa-clock mr-2"></i>Sampel belum disetujui admin.</p>';return}if(r.status==='reviewed'){out.innerHTML=`<div class="bg-green-50 border border-green-200 p-5 rounded-xl"><h3 class="text-green-800 font-bold">Ulasan sudah diberikan</h3><p class="text-sm mt-2">${esc(r.type)}</p><div class="text-amber-500 mt-2">${stars(r.review_rating)}</div><p class="whitespace-pre-wrap mt-2">${esc(r.review_comment)}</p></div>`;return}if(r.status!=='approved'){out.innerHTML='<p class="bg-red-50 text-red-700 p-4 rounded-xl">Status tidak valid.</p>';return}
state.rating=0;out.innerHTML=`<form id="reviewForm" class="bg-stone-50 border rounded-xl p-5 space-y-4"><div><h3 class="font-bold text-lg text-coffee-900">Review: ${esc(r.type)}</h3><p class="text-xs text-stone-500">Untuk ${esc(r.name)}</p></div><div><label class="block font-semibold text-sm mb-2">Rating kopi</label><div class="flex gap-3" role="group" aria-label="Pilih rating">${[1,2,3,4,5].map(i=>`<button type="button" class="star-button" aria-label="${i} bintang" data-action="rating" data-value="${i}"><i class="fa-solid fa-star"></i></button>`).join('')}</div></div><label class="block font-semibold text-sm">Komentar<textarea name="comment" class="input mt-2" rows="4" required maxlength="2000" placeholder="Bagaimana rasa kopi ini?"></textarea></label><button type="submit" class="btn btn-primary w-full">Kirim Review & Dapat +2 Stamps</button></form>`
}
async function stopCamera(){if(state.scanStream){state.scanStream.getTracks().forEach(t=>t.stop());state.scanStream=null}if(state.scanLoop)cancelAnimationFrame(state.scanLoop);state.scanLoop=null;document.getElementById('cameraWrap')?.classList.add('hidden')}
async function startCamera(){if(!('BarcodeDetector'in window)||!navigator.mediaDevices?.getUserMedia){toast('Pemindaian kamera tidak didukung browser ini. Gunakan input ID/QR scanner.','error');return}try{const formats=await BarcodeDetector.getSupportedFormats();if(!formats.includes('qr_code'))throw Error('QR tidak didukung');const detector=new BarcodeDetector({formats:['qr_code']});const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});state.scanStream=stream;const video=document.getElementById('cameraVideo');if(!video){stopCamera();return}video.srcObject=stream;document.getElementById('cameraWrap').classList.remove('hidden');await video.play();let last=0;const scan=async(ts)=>{if(!state.scanStream)return;if(ts-last>350&&video.readyState>=2){last=ts;try{const codes=await detector.detect(video);if(codes.length){document.getElementById('scanInput').value=codes[0].rawValue.trim();stopCamera();lookupSample(codes[0].rawValue.trim()).catch(()=>{});return}}catch(e){console.warn('QR scan:',e)}}state.scanLoop=requestAnimationFrame(scan)};state.scanLoop=requestAnimationFrame(scan)}catch(e){stopCamera();toast('Kamera gagal dibuka. Periksa izin kamera / HTTPS.','error');console.error(e)}}
app.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;
if(f.id==='requestForm')await withBusy(f,async()=>{const d=new FormData(f),phone=phoneClean(d.get('phone'));if(!validPhone(phone)){toast('Nomor WhatsApp tidak valid','error');return}const obj={id:sampleId(),name:String(d.get('name')).trim(),phone,address:String(d.get('address')).trim(),type:String(d.get('type')),status:'pending',date:today(),review_rating:null,review_comment:null};await api('nama_bentarngopi','POST',obj);f.reset();toast(`Permintaan terkirim! ID: ${obj.id}`);const note=document.createElement('p');note.className='text-center mt-3 text-sm bg-green-50 p-3 rounded-xl';note.textContent=`ID permintaan Anda: ${obj.id}`;f.append(note)});
if(f.id==='menuForm')await withBusy(f,async()=>{await api('menu_bentarngopi','POST',{id:`MENU-${crypto.randomUUID().slice(0,12)}`,name:String(new FormData(f).get('name')).trim()});toast('Menu ditambahkan');render()});
if(f.id==='scanForm')await withBusy(f,async()=>{await lookupSample(document.getElementById('scanInput').value.trim())});
if(f.id==='reviewForm')await withBusy(f,async()=>{if(!state.rating){toast('Pilih bintang 1–5','error');return}const comment=String(new FormData(f).get('comment')).trim();if(!comment){toast('Isi komentar dahulu','error');return}const result=await api('rpc/bn_submit_review','POST',{p_id:state.reviewId,p_rating:state.rating,p_comment:comment});toast('Review tersimpan! +2 stamps diberikan');document.getElementById('scanResult').innerHTML=`<div class="bg-green-50 text-center rounded-xl p-6"><i class="fa-solid fa-circle-check text-green-700 text-4xl"></i><h3 class="text-xl font-bold mt-3">Terima kasih atas ulasanmu!</h3><p class="mt-2">Double Stamp <b>+2</b> berhasil ditambahkan.</p><p class="text-sm text-stone-600 mt-2">Total stamps: <b>${esc(result?.stamps??'—')}</b></p></div>`});
if(f.id==='loginForm')await withBusy(f,async()=>{const d=new FormData(f),phone=phoneClean(d.get('phone'));if(!validPhone(phone)){toast('Nomor WhatsApp tidak valid','error');return}let result=await select('members_bentarngopi',`phone=eq.${eq(phone)}`);if(!result.length){await api('members_bentarngopi','POST',{phone,name:String(d.get('name')||'').trim()||'Pelanggan Baru',stamps:0})}state.phone=phone;toast('Kartu member terbuka');render()});
if(f.id==='trxForm')await withBusy(f,async()=>{const d=new FormData(f),phone=phoneClean(d.get('phone'));if(!validPhone(phone)){toast('Nomor WhatsApp tidak valid','error');return}const val=await api('rpc/bn_add_stamp','POST',{p_phone:phone,p_name:String(d.get('name')||'').trim()||'Pelanggan'});toast(`+1 stamp berhasil. Total: ${val?.stamps??'—'}`);f.reset()});
});
app.addEventListener('click',async e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;
if(a==='retry'){render();return}if(a==='rating'){state.rating=Number(btn.dataset.value);document.querySelectorAll('.star-button').forEach(x=>x.classList.toggle('selected',Number(x.dataset.value)<=state.rating));return}if(a==='logout'){state.phone=null;render();return}if(a==='camera'){startCamera();return}if(a==='cameraStop'){stopCamera();return}
if(btn.disabled)return;btn.disabled=true;try{if(a==='approve'){await api(`nama_bentarngopi?id=eq.${eq(btn.dataset.id)}&status=eq.pending`,'PATCH',{status:'approved'});toast('Sampel disetujui, QR siap');render()}if(a==='deleteMenu'){await api(`menu_bentarngopi?id=eq.${eq(btn.dataset.id)}`,'DELETE');toast('Menu dihapus');render()}if(a==='claim'){const result=await api('rpc/bn_claim_reward','POST',{p_phone:state.phone});toast(`Reward diklaim! Sisa ${result?.stamps??0} stamps`);render()}}catch(e){}finally{btn.disabled=false}});
document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>nav(el.dataset.view)));
window.addEventListener('hashchange',()=>nav(location.hash==='#ngopidulu'?'admin':'request'));
nav(location.hash==='#ngopidulu'?'admin':'request');
</script></body></html>
