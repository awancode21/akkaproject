const ratingFields=[['taste','Rasa'],['aroma','Aroma'],['sweetness','Tingkat Manis'],['presentation','Penyajian']];
function reviewDetails(r){let d=null;try{const obj=JSON.parse(r.review_comment||'');if(obj?.format==='bn-review-v2' && obj.ratings && typeof obj.description==='string')d=obj}catch(e){}if(!d)return `<div class="text-amber-500">${stars(r.review_rating)}</div><p class="whitespace-pre-wrap mt-2 text-sm">${esc(r.review_comment||'')}</p>`;return `<div class="space-y-2 text-sm mt-2">${ratingFields.map(([key,label])=>`<div class="flex items-center justify-between gap-2"><span>${esc(key==='taste'?`Rasa ${r.type}`:label)}</span><span class="text-amber-500 whitespace-nowrap">${stars(d.ratings[key])}</span></div>`).join('')}<div class="mt-3 border-t pt-2"><b>Keterangan pelanggan:</b><p class="whitespace-pre-wrap mt-1">${esc(d.description)}</p></div></div>`}
const qr=(v,size=160)=>`https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${eq(v)}`;
const wrap=(title,subtitle,content)=>`<div class="fade-in max-w-2xl mx-auto"><div class="mb-7 text-center"><div class="text-amber-600 text-3xl mb-3"><i class="fa-solid fa-mug-saucer"></i></div><h1 class="text-3xl font-extrabold text-coffee-900">${title}</h1><p class="text-stone-500 mt-2">${subtitle}</p></div>${content}</div>`;

async function api(endpoint,method='GET',body=null){
 try{const options={method,headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json',Prefer:'return=representation'}};if(body!==null)options.body=JSON.stringify(body);
 const res=await fetch(`${SUPABASE_URL}/${endpoint}`,options);const raw=await res.text();let data=null;try{data=raw?JSON.parse(raw):null}catch{data=raw}
 if(!res.ok){const msg=(data&&typeof data==='object'&&(data.message||data.error_description||data.details))||`HTTP ${res.status}`;throw new Error(msg)}return data;
 }catch(error){console.error('BentarNgopi API:',{endpoint,method,error});toast(`Database: ${error.message}`,'error');throw error}
}

function renderError(){app.innerHTML=`<div class="card max-w-lg mx-auto p-6 text-center"><i class="fa-solid fa-triangle-exclamation text-red-600 text-3xl"></i><h2 class="mt-3 text-xl font-bold">Data belum dapat dimuat</h2><p class="text-stone-500 mt-2">Periksa koneksi dan konfigurasi tabel/fungsi SQL Supabase.</p><button class="btn btn-primary mt-5" data-action="retry">Coba Lagi</button></div>`}
async function render(){const stamp=++state.viewVersion;app.innerHTML=spinner();try{
 if(state.view==='request'){const menus=await select('menu_bentarngopi','order=name.asc');if(stamp!==state.viewVersion)return;
 app.innerHTML=wrap('Minta Sampel Kopi','Pilih varian favoritmu. Kami akan memproses permintaan tester.',`<section class="card overflow-hidden"><div class="bg-coffee-800 text-white p-5 font-bold"><i class="fa-solid fa-gift text-amber-400 mr-2"></i>Form Permintaan Sampel</div><form id="requestForm" class="p-6 space-y-4"><label class="block text-sm font-semibold">Nama lengkap<input name="name" class="input mt-2" required maxlength="120" autocomplete="name"></label><label class="block text-sm font-semibold">Nomor WhatsApp<input name="phone" class="input mt-2" type="tel" required placeholder="08xxxxxxxxxx" autocomplete="tel"></label><label class="block text-sm font-semibold">Alamat pengiriman<textarea name="address" class="input mt-2" rows="3" required maxlength="1000"></textarea></label><label class="block text-sm font-semibold">Jenis sampel<select name="type" class="input mt-2" required><option value="">Pilih jenis kopi</option>${menus.map(m=>`<option value="${esc(m.name)}">${esc(m.name)}</option>`).join('')}</select></label><button class="btn btn-amber w-full" type="submit" ${menus.length?'':'disabled'}>Kirim Permintaan <i class="fa-solid fa-paper-plane ml-2"></i></button>${menus.length?'':'<p class="text-red-600 text-xs">Menu belum tersedia. Tambahkan menu melalui admin.</p>'}</form></section>`);
 }else if(state.view==='scan'){app.innerHTML=wrap('Scan & Review','Scan QR melalui kamera, pilih foto dari galeri iPhone/Android, atau masukkan ID secara manual.',`<section class="card p-6"><form id="scanForm" class="flex gap-2"><input id="scanInput" class="input min-w-0 uppercase" placeholder="SMPL-XXXXXXXX" required aria-label="ID sampel"><button class="btn btn-amber" type="submit">Cari</button></form><button data-action="camera" class="mt-3 btn btn-primary w-full"><i class="fa-solid fa-camera mr-2"></i>Buka Kamera & Scan QR</button><label class="mt-3 btn bg-amber-50 border border-amber-300 text-coffee-900 w-full cursor-pointer text-center block"><i class="fa-solid fa-image mr-2"></i>Pilih QR dari Galeri<input type="file" id="galleryQrFile" accept="image/*" class="sr-only"></label><div id="galleryScanStatus" aria-live="polite" class="text-sm mt-2 text-stone-600"></div><div id="galleryQrReader" class="hidden"></div><div id="cameraWrap" class="hidden mt-4"><div id="cameraReader" class="w-full overflow-hidden rounded-xl bg-black"></div><button data-action="cameraStop" class="mt-3 btn bg-stone-200 w-full">Tutup Kamera</button></div><p class="text-xs text-stone-500 mt-3">Pilih gambar QR dari galeri atau gunakan kamera (kamera memerlukan HTTPS).</p><div id="scanResult" class="mt-5"></div></section>`);
 }else if(state.view==='member'){await renderMember(stamp)
 }else if(state.view==='admin'){await renderAdmin(stamp)}
 }catch(e){if(stamp===state.viewVersion)renderError()}}
async function renderMember(stamp){if(!state.phone){app.innerHTML=wrap('Member Area','Kumpulkan 15 stamps untuk menikmati satu kopi gratis.',`<form id="loginForm" class="card p-6 space-y-4"><label class="block text-sm font-semibold">Nomor WhatsApp<input name="phone" type="tel" class="input mt-2" required placeholder="08xxxxxxxxxx"></label><label class="block text-sm font-semibold">Nama (opsional untuk member baru)<input name="name" class="input mt-2" maxlength="120" placeholder="Nama panggilan"></label><button class="btn btn-primary w-full">Lihat Kartu Member</button><p class="text-xs text-stone-500">Masuk melalui nomor HP ini hanya cocok untuk demo, bukan autentikasi aman.</p></form>`);return}
 const [data,samples]=await Promise.all([select('members_bentarngopi',`phone=eq.${eq(state.phone)}`),select('nama_bentarngopi',`phone=eq.${eq(state.phone)}&order=date.desc`)]);if(stamp!==state.viewVersion)return;if(!data.length){state.phone=null;toast('Member tidak ditemukan','error');return render()}
 const m=data[0],points=Number(m.stamps||0),mod=Math.min(15,points);app.innerHTML=wrap('Kartu Member','Tunjukkan QR kepada kasir setiap membeli kopi.',`<section class="card overflow-hidden"><div class="bg-gradient-to-r from-coffee-900 to-coffee-700 p-6 text-white flex justify-between items-start"><div><div class="text-xs uppercase tracking-widest text-coffee-200">BentarNgopi Member</div><h2 class="text-2xl font-bold mt-2">${esc(m.name)}</h2><p class="text-coffee-200 text-sm">${esc(m.phone)}</p></div><button data-action="logout" class="text-xs underline">Keluar</button></div><div class="p-6"><img class="mx-auto p-3 border rounded-xl" width="184" height="184" alt="QR nomor WhatsApp member" src="${qr(m.phone)}"><p class="text-center text-xs text-stone-500 mt-2">Scan QR ini di kasir</p><div class="bg-stone-50 border p-5 rounded-2xl mt-7"><div class="flex justify-between items-center mb-3"><b>Stamps Terkumpul</b><strong class="text-amber-700 text-2xl">${points} <span class="text-sm text-stone-400">/ 15</span></strong></div><div class="bg-stone-200 h-3 rounded-full overflow-hidden"><div class="h-full bg-amber-500 rounded-full transition-all" style="width:${100*mod/15}%"></div></div><div class="grid grid-cols-5 gap-2 mt-5">${Array.from({length:15},(_,i)=>`<div class="aspect-square rounded-full grid place-items-center text-xs font-bold ${i<mod?'bg-amber-500 text-white':'bg-white border text-stone-300'}">${i<mod?'<i class="fa-solid fa-check"></i>':i+1}</div>`).join('')}</div><button data-action="claim" class="btn w-full mt-6 ${points>=15?'bg-green-700 text-white':'bg-stone-200 text-stone-500'}" ${points>=15?'':'disabled'}>${points>=15?'Klaim Free Kopi (−15 Stamp)':`Butuh ${15-points} Stamp Lagi`}</button></div></div></section><section class="card p-5 md:p-6 mt-5"><div class="flex flex-wrap items-center justify-between gap-3 mb-4"><div><h3 class="font-extrabold text-coffee-900 text-lg"><i class="fa-solid fa-mug-hot text-amber-600 mr-2"></i>Status Permintaan Sampel</h3><p class="text-xs text-stone-500 mt-1">Permintaan menggunakan WhatsApp ${esc(state.phone)}.</p></div><button type="button" data-action="refreshMember" class="btn bg-stone-100 text-coffee-900 text-sm"><i class="fa-solid fa-rotate mr-1"></i>Perbarui</button></div>${samples.length?samples.map(r=>{const status=r.status==='approved'?'approved':r.status==='reviewed'?'reviewed':'pending';const statusInfo={pending:{label:'Menunggu Persetujuan',color:'bg-amber-100 text-amber-900',icon:'fa-clock'},approved:{label:'Disetujui • QR Aktif',color:'bg-green-100 text-green-800',icon:'fa-circle-check'},reviewed:{label:'Sudah Direview',color:'bg-blue-100 text-blue-800',icon:'fa-star'}}[status];return `<article class="border border-stone-200 rounded-xl p-4 mb-3 last:mb-0"><div class="flex flex-wrap justify-between gap-3"><div class="min-w-0"><h4 class="font-bold text-coffee-900 break-words">${esc(r.type)}</h4><p class="text-xs text-stone-500 mt-1">ID: <span class="font-mono">${esc(r.id)}</span> · ${esc(r.date||'')}</p></div><span class="self-start text-xs font-semibold px-3 py-1 rounded-full ${statusInfo.color}"><i class="fa-solid ${statusInfo.icon} mr-1"></i>${statusInfo.label}</span></div>${status==='pending'?'<p class="text-sm text-stone-600 mt-3">Permintaan sudah dikirim dan sedang menunggu persetujuan admin. QR sampel akan muncul setelah disetujui.</p>':status==='approved'?`<div class="mt-4 bg-green-50 border border-green-100 rounded-xl p-4 text-center"><p class="font-bold text-green-800 mb-2">QR Sampel Sudah Aktif</p><img loading="lazy" class="mx-auto rounded-lg border bg-white p-2" width="176" height="176" alt="QR sampel ${esc(r.id)}" src="${qr(r.id,176)}"><p class="text-xs font-mono mt-2 text-stone-600">${esc(r.id)}</p><p class="text-xs mt-2 text-stone-500">Tunjukkan QR ini saat pengambilan atau scan untuk memberi ulasan.</p><button type="button" data-action="openSampleReview" data-id="${esc(r.id)}" class="btn btn-amber mt-3 w-full">Beri Review Sampel</button></div>`:`<div class="bg-stone-50 rounded-xl p-3 mt-3">${reviewDetails(r)}<p class="text-xs text-green-700 mt-2">Bonus double stamp sudah diproses saat review.</p></div>`}</article>`}).join(''):'<div class="rounded-xl bg-stone-50 text-stone-600 p-5 text-center text-sm">Belum ada permintaan sampel dengan nomor ini. <button type="button" class="font-semibold text-amber-800 underline" data-action="goRequest">Minta sampel sekarang</button>.</div>'}</section>`)
}
async function renderAdmin(stamp){const [requests,menus]=await Promise.all([select('nama_bentarngopi','order=date.desc'),select('menu_bentarngopi','order=name.asc')]);if(stamp!==state.viewVersion)return;const sorted=[...requests].sort((a,b)=>(a.status==='pending'?0:a.status==='approved'?1:2)-(b.status==='pending'?0:b.status==='approved'?1:2));
app.innerHTML=`<div class="fade-in"><div class="mb-7"><span class="text-xs uppercase tracking-widest text-amber-700 font-bold">Panel Pengelola</span><h1 class="font-extrabold text-3xl text-coffee-900">Dashboard Admin</h1><p class="text-stone-500 text-sm mt-2">Akses URL tersembunyi tidak membatasi akses database. Gunakan autentikasi untuk produksi.</p></div><div class="grid md:grid-cols-2 gap-5 mb-6"><section class="card p-5"><h2 class="font-bold text-lg mb-4"><i class="fa-solid fa-list text-amber-600 mr-2"></i>Manajemen Menu</h2><form id="menuForm" class="flex gap-2"><input class="input min-w-0" name="name" required maxlength="120" placeholder="Nama minuman"><button class="btn btn-primary">Tambah</button></form><div class="mt-4 max-h-60 overflow-auto divide-y">${menus.length?menus.map(m=>`<div class="flex justify-between items-center gap-2 py-3"><span class="text-sm break-all">${esc(m.name)}</span><button data-action="deleteMenu" data-id="${esc(m.id)}" class="text-red-600 text-sm px-2 py-1" aria-label="Hapus ${esc(m.name)}"><i class="fa-solid fa-trash"></i></button></div>`).join(''):'<p class="text-sm text-stone-500 py-3">Belum ada menu.</p>'}</div></section><section class="card p-5 bg-amber-50"><h2 class="font-bold text-lg mb-3"><i class="fa-solid fa-cash-register text-amber-700 mr-2"></i>Transaksi Reguler (+1)</h2><form id="trxForm" class="space-y-3"><input name="phone" id="trxPhone" class="input" type="tel" required placeholder="Nomor HP / hasil scan QR"><input name="name" class="input" placeholder="Nama pelanggan baru (opsional)"><button class="btn btn-amber w-full">Tambah 1 Stamp</button></form><button type="button" data-action="memberCamera" class="btn btn-primary w-full mt-3"><i class="fa-solid fa-qrcode mr-2"></i>Scan QR Member dengan Kamera</button><div id="memberCameraWrap" class="hidden mt-3"><div id="memberCameraReader" class="overflow-hidden rounded-xl bg-black"></div><button type="button" data-action="cameraStop" class="btn bg-stone-200 w-full mt-2">Tutup Kamera</button></div><p class="text-xs text-stone-500 mt-3">Scan QR member untuk mengisi nomor WA, lalu klik Tambah 1 Stamp.</p></section></div><section class="card overflow-hidden"><div class="bg-coffee-800 text-white p-5 flex justify-between"><h2 class="font-bold"><i class="fa-solid fa-box-open mr-2"></i>Permintaan Sampel</h2><span class="text-sm">${sorted.length} permintaan</span></div><div class="divide-y max-h-[65vh] overflow-auto">${sorted.length?sorted.map(req=>{const labels={pending:'Menunggu',approved:'Disetujui',reviewed:'Direview'};return `<article class="p-5 flex flex-col sm:flex-row sm:justify-between gap-4"><div class="min-w-0"><div class="flex flex-wrap gap-2 items-center"><h3 class="font-bold text-coffee-900">${esc(req.name)}</h3><span class="text-xs px-2 py-1 rounded-full ${req.status==='pending'?'bg-amber-100 text-amber-800':req.status==='approved'?'bg-blue-100 text-blue-800':'bg-green-100 text-green-800'}">${esc(labels[req.status]||req.status)}</span></div><p class="text-sm mt-1">${esc(req.type)} • ${esc(req.phone)}</p><p class="text-stone-500 text-xs mt-1">${esc(req.date)} • ${esc(req.address)}</p><p class="text-xs font-mono mt-1 text-stone-500">${esc(req.id)}</p>${req.status==='reviewed'?`<div class="mt-2">${reviewDetails(req)}</div>`:''}</div><div class="shrink-0">${req.status==='pending'?`<button data-action="approve" data-id="${esc(req.id)}" class="btn bg-green-700 text-white">Setujui</button>`:`<div class="text-center"><img class="mx-auto border rounded p-1" width="100" height="100" alt="QR sampel ${esc(req.id)}" loading="lazy" src="${qr(req.id,120)}"><span class="text-xs text-stone-500">QR ID Sampel</span></div>`}</div></article>`}).join(''):'<p class="p-8 text-center text-stone-500">Belum ada permintaan.</p>'}</div></section></div>`
}
function busy(form,yes){const b=form?.querySelector('button[type=submit],button:not([type])');if(b)b.disabled=yes}

async function lookupSample(id){const data=await select('nama_bentarngopi',`id=eq.${eq(id)}`);const out=document.getElementById('scanResult');if(!out)return;if(!data.length){out.innerHTML='<p class="text-red-700 bg-red-50 p-4 rounded-xl">Kode sampel tidak ditemukan.</p>';return}const r=data[0];state.reviewId=r.id;if(r.status==='pending'){out.innerHTML='<p class="text-amber-900 bg-amber-50 p-4 rounded-xl"><i class="fa-solid fa-clock mr-2"></i>Sampel belum disetujui admin.</p>';return}if(r.status==='reviewed'){out.innerHTML=`<div class="bg-green-50 border border-green-200 p-5 rounded-xl"><h3 class="text-green-800 font-bold">Ulasan sudah diberikan</h3><p class="text-sm mt-2">${esc(r.type)}</p>${reviewDetails(r)}</div>`;return}if(r.status!=='approved'){out.innerHTML='<p class="bg-red-50 text-red-700 p-4 rounded-xl">Status tidak valid.</p>';return}
state.ratings={taste:0,aroma:0,sweetness:0,presentation:0};
const starGroup=(key,label)=>`<div class="bg-white rounded-xl p-3 border"><label class="block font-semibold text-sm text-coffee-900 mb-2">${esc(label)} <span class="text-red-600">*</span></label><div class="flex items-center gap-1 flex-wrap" role="group" aria-label="Rating ${esc(label)}">${[1,2,3,4,5].map(i=>`<button type="button" class="star-button text-2xl" aria-label="${i} bintang untuk ${esc(label)}" aria-pressed="false" data-action="rating" data-category="${key}" data-value="${i}"><i class="fa-solid fa-star"></i></button>`).join('')}<span id="ratingLabel-${key}" class="text-xs text-stone-500 ml-2">Belum dinilai</span></div></div>`;
out.innerHTML=`<form id="reviewForm" class="bg-stone-50 border rounded-xl p-5 space-y-4"><div><h3 class="font-bold text-lg text-coffee-900">Review: ${esc(r.type)}</h3><p class="text-xs text-stone-500">Untuk ${esc(r.name)} • Berikan nilai 1 sampai 5 bintang pada setiap aspek</p></div>${ratingFields.map(([key,label])=>starGroup(key,key==='taste'?`Rasa ${r.type}`:label)).join('')}<label class="block font-semibold text-sm">Keterangan Review (tulis sendiri) <span class="text-red-600">*</span><textarea name="comment" class="input mt-2" rows="4" required maxlength="2000" placeholder="Ceritakan pengalamanmu, kelebihan, kekurangan, dan saran untuk kopi ini..."></textarea></label><p class="text-xs text-stone-500">Semua penilaian wajib diisi. Setelah dikirim, kamu akan memperoleh +2 stamps.</p><button type="submit" class="btn btn-primary w-full">Kirim Review & Dapat +2 Stamps</button></form>`
}
async function scanImageFromGallery(file){
 const status=document.getElementById('galleryScanStatus');
 if(!file)return;
 if(!file.type.startsWith('image/')){toast('Pilih file gambar QR (JPG, PNG, HEIC jika didukung browser).','error');return}
 if(typeof Html5Qrcode==='undefined'){toast('Library pemindai belum termuat. Periksa internet.','error');return}
 if(status)status.textContent='Membaca QR dari gambar…';
 let scanner=null;
 try{
  await stopCamera();
  const container=document.getElementById('galleryQrReader');if(!container)return;
  scanner=new Html5Qrcode('galleryQrReader',{verbose:false});
  const raw=await scanner.scanFile(file,true);
  let code=String(raw||'').trim();
  try{const url=new URL(code);code=url.searchParams.get('id')||code}catch(e){}
  if(!code)throw new Error('Kode tidak terbaca');
  if(status)status.textContent=`QR terbaca: ${code}`;
  const input=document.getElementById('scanInput');if(input)input.value=code;
  await lookupSample(code);
 }catch(e){console.error('Scan QR galeri:',e);if(status)status.textContent='QR tidak ditemukan pada gambar. Coba foto lebih jelas atau ketik ID sampel.';toast('Tidak bisa membaca QR dari foto tersebut.','error')}
 finally{if(scanner)try{scanner.clear()}catch(e){}const input=document.getElementById('galleryQrFile');if(input)input.value=''}
}
async function stopCamera(){
 const scanner=state.scanner;
 state.scanner=null;state.scannerMode=null;
 if(scanner){try{await scanner.stop()}catch(e){console.debug('Scanner stop:',e)}try{scanner.clear()}catch(e){console.debug('Scanner clear:',e)}}
 document.getElementById('cameraWrap')?.classList.add('hidden');
 document.getElementById('memberCameraWrap')?.classList.add('hidden');
}
async function startCamera(mode='sample'){
 if(state.scannerBusy)return;
 if(!window.isSecureContext || !navigator.mediaDevices?.getUserMedia){toast('Kamera membutuhkan HTTPS atau localhost. Buka aplikasi melalui alamat HTTPS.','error');return}
 if(typeof Html5Qrcode==='undefined'){toast('Pustaka QR belum termuat. Periksa koneksi internet.','error');return}
 state.scannerBusy=true;
 try{
  await stopCamera();
  const isMember=mode==='member';
  const wrap=document.getElementById(isMember?'memberCameraWrap':'cameraWrap');
  const id=isMember?'memberCameraReader':'cameraReader';
  if(!wrap)return;
  wrap.classList.remove('hidden');
  const scanner=new Html5Qrcode(id,{verbose:false});
  state.scanner=scanner;state.scannerMode=mode;
  const onSuccess=async raw=>{
   if(state.scanner!==scanner || scanner.__bnConsumed)return;
   scanner.__bnConsumed=true;
   let value=String(raw||'').trim();
   try{const url=new URL(value);value=url.searchParams.get('id')||url.searchParams.get('phone')||value}catch(e){}
   await stopCamera();
   if(isMember){const input=document.getElementById('trxPhone');if(input){input.value=phoneClean(value);input.focus();toast('QR member terbaca. Periksa nomor lalu tambah stamp.')}}
   else{const input=document.getElementById('scanInput');if(input){input.value=value;lookupSample(value).catch(e=>console.error('Pencarian sampel gagal:',e))}}
  };
  await scanner.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>{const side=Math.max(140,Math.min(260,Math.floor(Math.min(w,h)*.75)));return {width:side,height:side}},aspectRatio:1.333333},onSuccess,()=>{});
 }catch(e){console.error('QR camera:',e);await stopCamera();toast('Kamera tidak dapat dibuka. Izinkan kamera di pengaturan browser atau gunakan input manual.','error')}
 finally{state.scannerBusy=false}
}
app.addEventListener('submit',async e=>{e.preventDefault();const f=e.target;
if(f.id==='requestForm')await withBusy(f,async()=>{const d=new FormData(f),phone=phoneClean(d.get('phone'));if(!validPhone(phone)){toast('Nomor WhatsApp tidak valid','error');return}const obj={id:sampleId(),name:String(d.get('name')).trim(),phone,address:String(d.get('address')).trim(),type:String(d.get('type')),status:'pending',date:today(),review_rating:null,review_comment:null};await api('nama_bentarngopi','POST',obj);f.reset();toast(`Permintaan terkirim! ID: ${obj.id}`);const note=document.createElement('p');note.className='text-center mt-3 text-sm bg-green-50 p-3 rounded-xl';note.textContent=`ID permintaan Anda: ${obj.id}`;f.append(note);const go=document.createElement('button');go.type='button';go.dataset.action='goMember';go.className='btn btn-primary w-full mt-3';go.textContent='Cek Status di Member Area';f.append(go)});
if(f.id==='menuForm')await withBusy(f,async()=>{await api('menu_bentarngopi','POST',{id:`MENU-${crypto.randomUUID().slice(0,12)}`,name:String(new FormData(f).get('name')).trim()});toast('Menu ditambahkan');render()});
if(f.id==='scanForm')await withBusy(f,async()=>{await lookupSample(document.getElementById('scanInput').value.trim())});
if(f.id==='reviewForm')await withBusy(f,async()=>{const scores=ratingFields.map(([key])=>Number(state.ratings?.[key]||0));if(scores.some(v=>v<1||v>5)){toast('Isi semua 4 kategori dengan rating bintang 1–5','error');return}const comment=String(new FormData(f).get('comment')).trim();if(!comment){toast('Isi keterangan review dahulu','error');return}const average=Math.round(scores.reduce((a,b)=>a+b,0)/scores.length);const detail=JSON.stringify({format:'bn-review-v2',ratings:Object.fromEntries(ratingFields.map(([key],i)=>[key,scores[i]])),description:comment});const result=await api('rpc/bn_submit_review','POST',{p_id:state.reviewId,p_rating:average,p_comment:detail});toast('Review tersimpan! +2 stamps diberikan');document.getElementById('scanResult').innerHTML=`<div class="bg-green-50 text-center rounded-xl p-6"><i class="fa-solid fa-circle-check text-green-700 text-4xl"></i><h3 class="text-xl font-bold mt-3">Terima kasih atas ulasanmu!</h3><p class="mt-2">Double Stamp <b>+2</b> berhasil ditambahkan.</p><p class="text-sm text-stone-600 mt-2">Total stamps: <b>${esc(result?.stamps??'—')}</b></p></div>`});
if(f.id==='loginForm')await withBusy(f,async()=>{const d=new FormData(f),phone=phoneClean(d.get('phone'));if(!validPhone(phone)){toast('Nomor WhatsApp tidak valid','error');return}let result=await select('members_bentarngopi',`phone=eq.${eq(phone)}`);if(!result.length){const ownRequests=await select('nama_bentarngopi',`phone=eq.${eq(phone)}&order=date.desc&limit=1`);await api('members_bentarngopi','POST',{phone,name:String(d.get('name')||'').trim()||ownRequests[0]?.name||'Pelanggan Baru',stamps:0})}state.phone=phone;toast('Kartu member terbuka');render()});
if(f.id==='trxForm')await withBusy(f,async()=>{const d=new FormData(f),phone=phoneClean(d.get('phone'));if(!validPhone(phone)){toast('Nomor WhatsApp tidak valid','error');return}const val=await api('rpc/bn_add_stamp','POST',{p_phone:phone,p_name:String(d.get('name')||'').trim()||'Pelanggan'});toast(`+1 stamp berhasil. Total: ${val?.stamps??'—'}`);f.reset()});
});
app.addEventListener('change',e=>{if(e.target.id==='galleryQrFile'&&e.target.files?.[0])scanImageFromGallery(e.target.files[0])});
app.addEventListener('click',async e=>{const btn=e.target.closest('[data-action]');if(!btn)return;const a=btn.dataset.action;
if(a==='goMember'){nav('member');return}if(a==='goRequest'){nav('request');return}if(a==='refreshMember'){render();return}if(a==='openSampleReview'){nav('scan');const field=document.getElementById('scanInput');if(field){field.value=btn.dataset.id;lookupSample(btn.dataset.id).catch(e=>console.error(e))}return}if(a==='retry'){render();return}if(a==='rating'){const category=btn.dataset.category;state.ratings=state.ratings||{};state.ratings[category]=Number(btn.dataset.value);document.querySelectorAll('.star-button').forEach(x=>{if(x.dataset.category!==category)return;const selected=Number(x.dataset.value)<=state.ratings[category];x.classList.toggle('selected',selected);x.setAttribute('aria-pressed',String(selected))});const lbl=document.getElementById(`ratingLabel-${category}`);if(lbl)lbl.textContent=`${state.ratings[category]}/5 bintang`;return}if(a==='logout'){state.phone=null;render();return}if(a==='camera'){startCamera('sample');return}if(a==='memberCamera'){startCamera('member');return}if(a==='cameraStop'){stopCamera();return}
if(btn.disabled)return;btn.disabled=true;try{if(a==='approve'){await api(`nama_bentarngopi?id=eq.${eq(btn.dataset.id)}&status=eq.pending`,'PATCH',{status:'approved'});toast('Sampel disetujui, QR siap');render()}if(a==='deleteMenu'){await api(`menu_bentarngopi?id=eq.${eq(btn.dataset.id)}`,'DELETE');toast('Menu dihapus');render()}if(a==='claim'){const result=await api('rpc/bn_claim_reward','POST',{p_phone:state.phone});toast(`Reward diklaim! Sisa ${result?.stamps??0} stamps`);render()}}catch(e){}finally{btn.disabled=false}});
document.querySelectorAll('[data-view]').forEach(el=>el.addEventListener('click',()=>nav(el.dataset.view)));
window.addEventListener('hashchange',()=>nav(location.hash==='#ngopidulu'?'admin':'request'));
nav(location.hash==='#ngopidulu'?'admin':'request');
