const state={view:location.hash==='#ngopidulu'?'admin':'home',phone:sessionStorage.getItem('bnphone')||'',menu:[],settings:null,member:null,samples:[],purchases:[],rewards:[],camera:null,selectedSample:null,ratings:[0,0,0,0],cart:[]};
const app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let toastTimer;
function toast(t,bad=false){const x=document.getElementById('toast');x.textContent=t;x.className='fixed bottom-5 right-4 left-4 sm:left-auto z-50 rounded-xl px-4 py-3 text-white shadow-2xl '+(bad?'bg-red-700':'bg-green-700');clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.classList.add('hidden'),3600)}
async function api(endpoint,method='GET',body){try{const r=await fetch(BASE+'/'+endpoint,{method,headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=representation'},...(body!==undefined?{body:JSON.stringify(body)}:{})});if(!r.ok){let e=await r.json().catch(()=>({}));throw Error(e.message||'HTTP '+r.status)}return r.status===204?true:await r.json()}catch(e){console.error('Supabase',endpoint,e);toast(e.message||'Database tidak tersedia',true);throw e}}
const q=s=>encodeURIComponent(s);
async function loadCore(){const [m,c]=await Promise.all([api('menu_bentarngopi?select=*&order=name.asc'),api('bn_settings?id=eq.1&select=*')]);state.menu=m||[];state.settings=c?.[0]||null}

function menuCards(member=false){let arr=state.menu.filter(x=>x.active);if(!arr.length)return '<div class="card">Belum ada menu. Admin dapat menambah produk.</div>';return ['kopi','non-kopi'].map(cat=>'<section class="mb-7"><h2 class="font-extrabold text-xl mb-3 capitalize">'+(cat==='kopi'?'☕ Kopi':'🥛 Non Kopi')+'</h2><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">'+(arr.filter(x=>x.category===cat).map(x=>'<div class="card"><div class="flex justify-between gap-2"><div><b>'+esc(x.name)+'</b><p class="muted">Harga normal '+money(x.price_normal)+'</p><p class="font-bold text-amber-700">Harga member '+money(x.price_member)+'</p></div><span class="text-3xl">'+(cat==='kopi'?'☕':'🥤')+'</span></div>'+(x.stamp_enabled?'<p class="text-xs mt-2 text-green-700">'+icon('stamp')+' Produk dapat stamp</p>':'')+'</div>').join('')||'<p class="muted">Belum ada produk</p>')+'</div></section>').join('')}
async function render(){app.innerHTML='<div class="text-center p-12 text-amber-700">'+icon('spinner fa-spin')+' Memuat...</div>';try{await loadCore();if(state.view==='home')return renderHome();if(state.view==='member')return await renderMember();if(state.view==='admin')return await renderAdmin();if(state.view==='register')return renderRegister();if(state.view==='login')return renderLogin();if(state.view==='request')return await renderRequest();if(state.view==='review')return await renderReview();}catch(e){app.innerHTML='<div class="card text-red-700">Tidak dapat memuat data. Periksa SQL Supabase dan koneksi internet. <button class="btn mt-3" onclick="render()">Coba Lagi</button></div>'}}
function renderHome(){app.innerHTML='<div class="fade"><div class="rounded-2xl bg-gradient-to-br from-coffee-900 to-coffee-700 text-white p-7 mb-6"><p class="text-amber-300 font-bold">SELAMAT DATANG</p><h1 class="text-3xl font-black my-2">Seduh momen, kumpulkan reward.</h1><p class="text-coffee-200 mb-5">Lihat menu kopi dan non-kopi. Gabung member untuk harga spesial, sampel terbatas, dan stamps.</p><button class="bg-amber-500 text-coffee-900 font-bold rounded-xl px-5 py-3" onclick="nav(\'member\')">Gabung / Masuk Member '+icon('arrow-right')+'</button></div>'+menuCards()+'</div>'}
function renderLogin(){app.innerHTML='<div class="card max-w-md mx-auto fade">'+title('Masuk Member','Gunakan nomor WhatsApp yang terdaftar.')+'<form onsubmit="login(event)" class="space-y-3"><input class="field" id="phone" type="tel" placeholder="08xxxxxxxxxx" required><button class="btn w-full">Masuk</button></form><button class="mt-4 underline text-sm" onclick="nav(\'register\')">Belum punya akun? Buat member</button></div>'}
function renderRegister(){app.innerHTML='<div class="card max-w-md mx-auto fade">'+title('Buat Member')+'<form onsubmit="register(event)" class="space-y-3"><input class="field" id="regName" placeholder="Nama lengkap" required><input class="field" id="regPhone" type="tel" placeholder="Nomor WhatsApp" required><button class="btn w-full">Daftar Member</button></form><button class="mt-4 underline text-sm" onclick="nav(\'login\')">Sudah terdaftar? Masuk</button></div>'}
const phoneVal=v=>v.replace(/[^\d+]/g,'');
async function login(e){e.preventDefault();const p=phoneVal(document.getElementById('phone').value);try{let a=await api('members_bentarngopi?phone=eq.'+q(p)+'&select=*');if(!a.length)return toast('Nomor belum terdaftar. Pilih Buat Member.',true);state.phone=p;sessionStorage.setItem('bnphone',p);toast('Selamat datang, '+a[0].name);nav('member')}catch(e){}}
async function register(e){e.preventDefault();let name=document.getElementById('regName').value.trim(),p=phoneVal(document.getElementById('regPhone').value);if(!/^\+?\d{9,16}$/.test(p))return toast('Nomor HP tidak valid',true);try{let ex=await api('members_bentarngopi?phone=eq.'+q(p)+'&select=phone');if(ex.length)return toast('Nomor sudah terdaftar. Silakan masuk.',true);await api('members_bentarngopi','POST',{phone:p,name,stamps:0});state.phone=p;sessionStorage.setItem('bnphone',p);toast('Pendaftaran member berhasil');nav('member')}catch(e){}}
function logout(){state.phone='';sessionStorage.removeItem('bnphone');nav('member')}
async function loadMember(){const p=q(state.phone);let [m,s,tx,re]=await Promise.all([api('members_bentarngopi?phone=eq.'+p+'&select=*'),api('nama_bentarngopi?phone=eq.'+p+'&select=*&order=created_at.desc'),api('bn_purchases?phone=eq.'+p+'&select=*,bn_purchase_items(*)&order=created_at.desc'),api('bn_rewards?phone=eq.'+p+'&select=*&order=created_at.desc')]);state.member=m?.[0];state.samples=s||[];state.purchases=tx||[];state.rewards=re||[]}
const sampleStages=['pending','approved','processing','received','reviewed'];
const statusLabel=s=>({pending:'Menunggu persetujuan',approved:'Disetujui • menunggu proses',processing:'Sampel sedang diproses',received:'Sampel sudah diterima • review tersedia',reviewed:'Sudah direview'}[s]||s);
function etaDisplay(value){if(!value)return '';const p=value.split('-');if(p.length!==3)return esc(value);return new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(value+'T12:00:00Z'))}
function sampleRows(){return state.samples.map(x=>{let stage=sampleStages.indexOf(x.status);let steps=['Diajukan','Disetujui','Diproses','Diterima','Direview'];return '<div class="border-t py-4"><div class="flex justify-between items-start gap-2"><div><b>'+esc(x.type)+'</b><p class="muted">Kode '+esc(x.id)+' • Urutan #'+(x.queue_no??'-')+'</p><p class="font-semibold text-amber-800 mt-1">'+esc(statusLabel(x.status))+'</p></div><span class="tag">'+esc(x.status)+'</span></div><div class="grid grid-cols-5 gap-1 mt-3 text-center">'+steps.map((v,i)=>'<div class="text-[10px] sm:text-xs"><div class="h-2 rounded '+(stage>=i?'bg-amber-600':'bg-stone-200')+' mb-1"></div><span class="'+(stage>=i?'text-amber-900 font-semibold':'text-stone-400')+'">'+v+'</span></div>').join('')+'</div>'+(x.estimated_received_date?'<div class="mt-3 p-3 bg-amber-50 border border-amber-200 rounded-lg text-sm"><i class="fa-regular fa-calendar-check mr-1"></i><b>'+(x.status==='received'||x.status==='reviewed'?'Estimasi tanggal diterima sebelumnya':'Estimasi sampel diterima')+':</b> '+etaDisplay(x.estimated_received_date)+(x.status==='processing'?'<p class="text-xs text-amber-800 mt-1">Sampel sedang disiapkan, tanggal dapat berubah.</p>':'')+'</div>':'<p class="muted mt-3">Estimasi tanggal diterima belum ditentukan admin.</p>')+(x.status==='received'?'<div class="text-center mt-4"><img class="mx-auto w-36 bg-white border rounded-lg p-2" src="'+qr(x.id)+'" alt="QR sampel"><p class="muted mt-2">Sampel sudah diterima. Silakan isi ulasan.</p><button class="btn mt-2" onclick="openReview(\''+esc(x.id)+'\')">Review Sampel</button></div>':'')+(x.status==='reviewed'?'<p class="mt-2 text-sm">'+esc(formatReview(x.review_comment))+'</p>':'')+'</div>'}).join('')||'<p class="muted">Belum pernah mengajukan sampel.</p>'}

async function renderMember(){if(!state.phone){app.innerHTML='<div class="max-w-md mx-auto fade">'+title('Member Area','Pilih masuk jika sudah member atau daftar sebagai member baru.')+'<div class="grid grid-cols-2 gap-3"><button class="card text-center p-7 font-bold" onclick="nav(\'login\')">'+icon('right-to-bracket')+'<br>Masuk Member</button><button class="card text-center p-7 font-bold" onclick="nav(\'register\')">'+icon('user-plus')+'<br>Buat Member</button></div></div>';return}await loadMember();if(!state.member){logout();return}const cost=state.settings.reward_cost;const used=state.samples.length,remaining=Math.max(0,state.settings.sample_quota-(await api('nama_bentarngopi?select=id')).length);const sampleText=!state.settings.sample_open?'Sampel Belum Dibuka':remaining<=0?'Sampel Habis':used>=state.settings.sample_per_member?'Batas Pengajuan Tercapai':'Ajukan Free Sampel';let disable=sampleText!=='Ajukan Free Sampel';const m=state.member;app.innerHTML='<div class="fade">'+title('Halo, '+esc(m.name)+' 👋','Dashboard member & riwayat aktivitas')+'<div class="grid md:grid-cols-2 gap-4 mb-4"><div class="card text-center"><h3 class="font-bold">Kartu Member</h3><img class="mx-auto my-3 w-36 border p-2 rounded-xl" src="'+qr(state.phone)+'" alt="QR member"><p class="font-mono font-bold">'+esc(state.phone)+'</p><button class="text-red-700 text-sm mt-3 underline" onclick="logout()">Keluar</button></div><div class="card"><h3 class="font-bold mb-2">'+icon('stamp')+' Stamps Anda</h3><div class="text-4xl font-black text-amber-700">'+m.stamps+' <span class="text-sm text-stone-500">/ '+cost+' untuk reward</span></div><div class="bg-stone-200 h-3 rounded-full overflow-hidden my-4"><div class="bg-amber-600 h-full" style="width:'+Math.min(100,m.stamps/cost*100)+'%"></div></div><p class="muted">'+state.settings.stamp_per_item+' stamp per produk memenuhi syarat, maksimal '+state.settings.stamp_max_transaction+' / transaksi.</p><button class="btn mt-4 w-full" '+(m.stamps<cost?'disabled':'')+' onclick="claimReward()">Klaim Free Kopi ('+cost+' stamp)</button></div></div><div class="card mb-4"><div class="flex justify-between gap-2 items-center"><h2 class="font-extrabold text-lg">Free Sampel</h2><span class="tag">Sisa '+remaining+' / '+state.settings.sample_quota+'</span></div><p class="muted my-2">'+(state.settings.sample_open?'Pengajuan sedang dibuka':'Pengajuan sedang ditutup')+' • Maks. '+state.settings.sample_per_member+' pengajuan per member</p><button class="btn my-2" '+(disable?'disabled':'')+' onclick="nav(\'request\')">'+esc(sampleText)+'</button><div class="mt-3"><h3 class="font-semibold">Riwayat & status sampel</h3>'+sampleRows()+'</div></div><div class="card mb-4"><h2 class="font-extrabold text-lg">Riwayat Pembelian</h2>'+(state.purchases.map(x=>'<div class="border-t py-3"><div class="flex justify-between"><b>'+fmt(x.created_at)+'</b><b>'+money(x.total)+'</b></div><p class="muted">+'+x.stamps_earned+' stamp • '+(x.bn_purchase_items||[]).map(y=>esc(y.name)+' × '+y.quantity).join(', ')+'</p></div>').join('')||'<p class="muted mt-3">Belum ada pembelian tercatat.</p>')+'</div><div class="card"><h2 class="font-extrabold text-lg">Riwayat Klaim Free Kopi</h2>'+(state.rewards.map(x=>'<p class="border-t py-3 text-sm">'+fmt(x.created_at)+' • Klaim kopi gratis • -'+x.stamps_spent+' stamp</p>').join('')||'<p class="muted mt-3">Belum ada reward diklaim.</p>')+'</div><div class=\"mt-8\">'+menuCards(true)+'</div></div>'}
async function claimReward(){if(!confirm('Klaim free kopi menggunakan stamp Anda?'))return;try{await api('rpc/bn_claim_reward_v2','POST',{p_phone:state.phone});toast('Klaim free kopi berhasil. Tunjukkan riwayat klaim ke kasir.');nav('member')}catch(e){}}
async function renderRequest(){if(!state.phone)return nav('member');const available=state.menu.filter(x=>x.sample_enabled&&x.active);app.innerHTML='<div class="card max-w-xl mx-auto fade">'+title('Pengajuan Free Sampel','Hanya tersedia selama program dibuka dan kuota belum habis.')+'<form onsubmit="requestSample(event)" class="space-y-3"><p class="muted">Member: '+esc(state.phone)+'</p><select class="field" id="sampleMenu" required><option value="">Pilih jenis sampel</option>'+available.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('')+'</select><textarea class="field" id="sampleAddress" placeholder="Alamat lengkap untuk sampel" rows="3" required></textarea><button class="btn w-full" '+(!available.length?'disabled':'')+'>Ajukan Sampel</button></form><button class="underline mt-4 text-sm" onclick="nav(\'member\')">Kembali ke Member</button></div>'}
async function requestSample(e){e.preventDefault();try{let r=await api('rpc/bn_request_sample','POST',{p_phone:state.phone,p_menu_id:document.getElementById('sampleMenu').value,p_address:document.getElementById('sampleAddress').value});toast('Pengajuan berhasil! Nomor antrean #'+r.queue_no);nav('member')}catch(e){}}
async function openReview(id){state.selectedSample=id;state.view='review';await render()}
async function renderReview(){if(!state.phone)return nav('member');await loadMember();let s=state.samples.find(x=>x.id===state.selectedSample);if(!s)return nav('member');if(s.status!=='received'){app.innerHTML='<div class="card">Review tersedia setelah admin menandai sampel sudah diterima.<button onclick="nav(\'member\')" class="btn mt-4">Kembali</button></div>';return}state.ratings=[0,0,0,0];const fields=['Rasa '+s.type,'Aroma','Tingkat Manis','Penyajian'];app.innerHTML='<div class="card max-w-xl mx-auto fade">'+title('Review '+esc(s.type),'Beri bintang untuk setiap aspek dan tuliskan keterangan sendiri.')+'<form onsubmit="saveReview(event)" class="space-y-5">'+fields.map((f,i)=>'<div><b>'+esc(f)+'</b><div id="rating'+i+'" class="flex gap-2 mt-2">'+[1,2,3,4,5].map(n=>'<button type="button" class="text-3xl text-stone-300" onclick="rate('+i+','+n+')">★</button>').join('')+'</div></div>').join('')+'<textarea class="field" id="reviewNote" rows="4" required placeholder="Tuliskan keterangan review kopi berdasarkan pengalaman Anda"></textarea><button class="btn w-full">Kirim Review & Dapatkan +2 Stamp</button></form></div>'}
function rate(i,n){state.ratings[i]=n;document.querySelectorAll('#rating'+i+' button').forEach((b,j)=>{b.style.color=j<n?'#d97706':'#d6d3d1'})}
async function saveReview(e){e.preventDefault();if(state.ratings.some(x=>!x))return toast('Beri semua penilaian bintang',true);let k=document.getElementById('reviewNote').value.trim();if(!k)return toast('Isi keterangan review',true);let [rasa,aroma,manis,penyajian]=state.ratings;let data=JSON.stringify({rasa,aroma,manis,penyajian,keterangan:k});try{await api('rpc/bn_submit_review','POST',{p_id:state.selectedSample,p_rating:Math.round((rasa+aroma+manis+penyajian)/4),p_comment:data});toast('Review terkirim, +2 stamp!');nav('member')}catch(e){}}
function optionMenu(pred=()=>true){return state.menu.filter(pred).map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('')}
async function renderAdmin(){const [samples,purchases]=await Promise.all([api('nama_bentarngopi?select=*&order=created_at.desc'),api('bn_purchases?select=id')]);let cfg=state.settings;app.innerHTML='<div class="fade">'+title('Dashboard Admin','Akses melalui #ngopidulu — prototipe tanpa autentikasi aman')+'<div class="grid lg:grid-cols-2 gap-4"><section class="card">'+title('Pengaturan Program')+'<form class="space-y-3" onsubmit="saveSettings(event)"><label class="flex gap-2 items-center"><input type="checkbox" id="sampleOpen" '+(cfg.sample_open?'checked':'')+'> Buka pengajuan sampel</label><label class="block text-sm">Kuota total sampel<input class="field" type="number" min="0" id="quota" value="'+cfg.sample_quota+'" required></label><label class="block text-sm">Maks. sampel per member<input class="field" type="number" min="1" id="perMember" value="'+cfg.sample_per_member+'" required></label><label class="block text-sm">Stamp per produk yang memenuhi syarat<input class="field" type="number" min="0" id="stampPer" value="'+cfg.stamp_per_item+'" required></label><label class="block text-sm">Maks. stamp per transaksi<input class="field" type="number" min="0" id="maxStamp" value="'+cfg.stamp_max_transaction+'" required></label><label class="block text-sm">Stamp untuk 1 free kopi<input class="field" type="number" min="1" id="rewardCost" value="'+cfg.reward_cost+'" required></label><button class="btn w-full">Simpan Pengaturan</button></form><p class="muted mt-3">Terpakai: '+samples.length+' / '+cfg.sample_quota+' pengajuan</p></section><section class="card">'+title('Produk & Harga')+'<form onsubmit="addProduct(event)" class="space-y-2"><input class="field" id="itemName" placeholder="Nama produk" required><select class="field" id="itemCategory"><option value="kopi">Kopi</option><option value="non-kopi">Non Kopi</option></select><div class="grid grid-cols-2 gap-2"><input class="field" type="number" min="0" id="normalPrice" placeholder="Harga normal" required><input class="field" type="number" min="0" id="memberPrice" placeholder="Harga member" required></div><label class="block"><input type="checkbox" id="sampleEligible"> Bisa diajukan sebagai sampel</label><label class="block"><input type="checkbox" id="stampEligible" checked> Mendapat stamp</label><button class="btn w-full">Tambah Produk</button></form><div class="mt-4 max-h-72 overflow-auto">'+state.menu.map(x=>'<div class="border-t py-3 flex items-center justify-between gap-2"><div><b>'+esc(x.name)+'</b><p class="muted">'+money(x.price_normal)+' / member '+money(x.price_member)+'</p><p class="text-xs">'+esc(x.category)+' • sampel '+(x.sample_enabled?'✓':'—')+' • stamp '+(x.stamp_enabled?'✓':'—')+'</p></div><div class="flex gap-2"><button class="text-amber-700 underline text-sm" onclick="editProduct(\''+esc(x.id)+'\')">Edit</button><button class="text-red-700 underline text-sm" onclick="deleteProduct(\''+esc(x.id)+'\')">Hapus</button></div></div>').join('')+'</div></section><section class="card">'+title('Transaksi Pembelian Member','1 stamp per produk memenuhi syarat, maksimum sesuai pengaturan')+'<form onsubmit="addPurchase(event)" class="space-y-3"><input id="purchasePhone" type="tel" class="field" required placeholder="Nomor WhatsApp / hasil scan QR"><div class="grid grid-cols-2 gap-2"><select id="purchaseItem" class="field">'+optionMenu(x=>x.active)+'</select><input id="purchaseQty" class="field" type="number" min="1" max="100" value="1" required></div><button class="btn w-full">Catat Pembelian & Tambah Stamp</button></form><div class="flex gap-2 mt-3"><button class="btn !bg-amber-600" onclick="startScanner()">'+icon('camera')+' Scan QR Member</button><label class="btn !bg-stone-700 cursor-pointer">'+icon('image')+' Galeri QR<input class="hidden" type="file" accept="image/*" onchange="scanGallery(event)"></label></div><div id="scanner" class="mt-3"></div></section><section class="card">'+title('Permintaan Sampel','Ubah tahap pengiriman; review baru dibuka setelah diterima')+'<div class="max-h-[500px] overflow-auto">'+samples.map(x=>'<div class="border-t py-3"><div class="flex justify-between gap-2"><b>#'+(x.queue_no??'-')+' '+esc(x.name)+'</b><span class="tag">'+esc(x.status)+'</span></div><p class="muted">'+esc(x.type)+' • '+esc(x.phone)+' • '+esc(x.id)+'</p><div class="mt-3 mb-2"><label class="block text-xs font-semibold text-stone-600 mb-1" for="eta-'+esc(x.id)+'">Estimasi tanggal sampel diterima</label><div class="flex flex-wrap items-center gap-2"><input type="date" id="eta-'+esc(x.id)+'" value="'+esc(x.estimated_received_date||'')+'" class="field !w-auto min-w-[180px]"><button type="button" class="btn" onclick="saveSampleETA(\''+esc(x.id)+'\')">Simpan Estimasi</button></div><p class="text-xs text-stone-500 mt-1">Kosongkan tanggal lalu simpan untuk menghapus estimasi.</p></div>'+(x.status==='pending'?'<button class="btn mt-2" onclick="advanceSample(\''+esc(x.id)+'\',\'approved\')">Setujui Sampel</button>':x.status==='approved'?'<button class="btn mt-2" onclick="advanceSample(\''+esc(x.id)+'\',\'processing\')">Mulai Proses Sampel</button>':x.status==='processing'?'<button class="btn mt-2" onclick="advanceSample(\''+esc(x.id)+'\',\'received\')">Tandai Sampel Sudah Diterima</button>':x.status==='received'?'<p class="muted mt-2">Sampel diterima, menunggu review member.</p>':'<p class="muted">'+esc(formatReview(x.review_comment))+'</p>')+'</div>').join('')+'</div></section></div></div>';drawCart()}
async function saveSettings(e){e.preventDefault();let v={sample_open:document.getElementById('sampleOpen').checked,sample_quota:Number(document.getElementById('quota').value),sample_per_member:Number(document.getElementById('perMember').value),stamp_per_item:Number(document.getElementById('stampPer').value),stamp_max_transaction:Number(document.getElementById('maxStamp').value),reward_cost:Number(document.getElementById('rewardCost').value),updated_at:new Date().toISOString()};try{await api('bn_settings?id=eq.1','PATCH',v);toast('Pengaturan tersimpan');nav('admin')}catch(e){}}
async function addProduct(e){e.preventDefault();let data={id:'MENU-'+crypto.randomUUID().slice(0,12),name:document.getElementById('itemName').value.trim(),category:document.getElementById('itemCategory').value,price_normal:Number(document.getElementById('normalPrice').value),price_member:Number(document.getElementById('memberPrice').value),sample_enabled:document.getElementById('sampleEligible').checked,stamp_enabled:document.getElementById('stampEligible').checked,active:true};try{await api('menu_bentarngopi','POST',data);toast('Produk ditambahkan');nav('admin')}catch(e){}}
async function editProduct(id){let x=state.menu.find(y=>y.id===id);if(!x)return;let name=prompt('Nama produk',x.name);if(name===null)return;let normal=prompt('Harga normal',x.price_normal);if(normal===null)return;let member=prompt('Harga member',x.price_member);if(member===null)return;let cat=prompt('Kategori: kopi / non-kopi',x.category);if(cat===null)return;let sampel=confirm('Aktifkan produk untuk pengajuan sampel?');let stamp=confirm('Produk ini menghasilkan stamp?');if(!name.trim()||!['kopi','non-kopi'].includes(cat)||Number(normal)<0||Number(member)<0)return toast('Data produk tidak valid',true);try{await api('menu_bentarngopi?id=eq.'+q(id),'PATCH',{name:name.trim(),category:cat,price_normal:Number(normal),price_member:Number(member),sample_enabled:sampel,stamp_enabled:stamp});toast('Produk diperbarui');nav('admin')}catch(e){}}
async function deleteProduct(id){if(!confirm('Nonaktifkan produk ini? Riwayat pembelian tetap ada.'))return;try{await api('menu_bentarngopi?id=eq.'+q(id),'PATCH',{active:false,sample_enabled:false});toast('Produk dinonaktifkan');nav('admin')}catch(e){}}
async function saveSampleETA(id){const field=document.getElementById('eta-'+id);if(!field)return;const value=field.value||null;try{const changed=await api('nama_bentarngopi?id=eq.'+q(id),'PATCH',{estimated_received_date:value});if(!changed?.length)throw Error('Permintaan sampel tidak ditemukan');toast(value?'Estimasi tanggal berhasil disimpan':'Estimasi tanggal dihapus');nav('admin')}catch(e){toast(e.message||'Gagal menyimpan estimasi',true)}}
async function advanceSample(id,next){const previous={approved:'pending',processing:'approved',received:'processing'}[next];if(!previous)return;try{const changed=await api('nama_bentarngopi?id=eq.'+q(id)+'&status=eq.'+previous,'PATCH',{status:next});if(!changed?.length)throw Error('Status telah berubah, refresh terlebih dahulu');toast('Status sampel: '+statusLabel(next));nav('admin')}catch(e){toast(e.message||'Gagal memperbarui status',true)}}
function addCart(){let id=document.getElementById('purchaseItem').value,qty=Number(document.getElementById('purchaseQty').value);if(!id||!Number.isInteger(qty)||qty<1||qty>100)return toast('Produk/jumlah tidak valid',true);let line=state.cart.find(x=>x.id===id);if(line)line.qty+=qty;else state.cart.push({id,qty});drawCart()}
function removeCart(i){state.cart.splice(i,1);drawCart()}
function drawCart(){const el=document.getElementById('cartList');if(!el)return;el.innerHTML=state.cart.length?state.cart.map((x,i)=>{let m=state.menu.find(z=>z.id===x.id);return '<div class=\"flex justify-between border-b py-2\"><span>'+esc(m?.name)+' × '+x.qty+'</span><button type=\"button\" class=\"text-red-700\" onclick=\"removeCart('+i+')\">Hapus</button></div>'}).join('')+'<p class=\"muted mt-2\">Estimasi stamp: '+Math.min(state.settings.stamp_max_transaction,state.cart.reduce((sum,x)=>{let m=state.menu.find(y=>y.id===x.id);return sum+(m?.stamp_enabled?x.qty:0)},0)*state.settings.stamp_per_item)+'</p>':'<p class=\"muted\">Belum ada produk dimasukkan ke transaksi.</p>'}
async function addPurchase(e){e.preventDefault();let p=phoneVal(document.getElementById('purchasePhone').value);if(!state.cart.length)return toast('Tambahkan produk ke transaksi terlebih dahulu',true);try{let r=await api('rpc/bn_record_purchase','POST',{p_phone:p,p_items:state.cart});state.cart=[];toast('Transaksi tercatat: +'+r.stamps+' stamp • '+money(r.total));await stopCamera();nav('admin')}catch(e){}}
async function startScanner(){if(!window.Html5Qrcode)return toast('Library kamera tidak termuat',true);await stopCamera();try{state.camera=new Html5Qrcode('scanner');await state.camera.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},async text=>{document.getElementById('purchasePhone').value=phoneVal(text);toast('QR Member terbaca');await stopCamera()},()=>{})}catch(e){console.error(e);toast('Kamera gagal dibuka. Gunakan HTTPS atau pilih galeri.',true)}}
async function scanGallery(e){let file=e.target.files?.[0];if(!file)return;if(!window.Html5Qrcode)return toast('Library QR tidak tersedia',true);await stopCamera();try{const reader=new Html5Qrcode('scanner');let text=await reader.scanFile(file,true);document.getElementById('purchasePhone').value=phoneVal(text);toast('QR Member terbaca dari galeri');reader.clear()}catch(err){console.error(err);toast('QR tidak terbaca dari gambar',true)}}
window.addEventListener('hashchange',()=>{if(location.hash==='#ngopidulu')nav('admin');else if(state.view==='admin')nav('home')});
render();
</script></body></html>
