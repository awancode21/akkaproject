async function staffRPC(name,data){
 const response=await fetch(BASE+'/rpc/'+name,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(data)});
 const result=await response.json().catch(()=>null);
 if(!response.ok)throw Error(result?.message||'Login gagal');
 return result;
}

}

async function login(e){e.preventDefault();const p=phoneVal(document.getElementById('phone').value);try{let a=await api('members_bentarngopi?phone=eq.'+q(p)+'&select=*');if(!a.length)return toast('Nomor belum terdaftar. Pilih Buat Member.',true);state.phone=p;sessionStorage.setItem('bnphone',p);syncOnlineMember();toast('Selamat datang, '+a[0].name);nav('member')}catch(e){}}
async function register(e){e.preventDefault();let name=document.getElementById('regName').value.trim(),p=phoneVal(document.getElementById('regPhone').value);if(!/^\+?\d{9,16}$/.test(p))return toast('Nomor HP tidak valid',true);try{let ex=await api('members_bentarngopi?phone=eq.'+q(p)+'&select=phone');if(ex.length)return toast('Nomor sudah terdaftar. Silakan masuk.',true);await api('members_bentarngopi','POST',{phone:p,name,stamps:0});state.phone=p;sessionStorage.setItem('bnphone',p);syncOnlineMember();toast('Pendaftaran member berhasil');nav('member')}catch(e){}}
function logout(){state.phone='';sessionStorage.removeItem('bnphone');syncOnlineMember();nav('member')}
async function loadMember(){const p=q(state.phone);let [m,s,tx,re]=await Promise.all([api('members_bentarngopi?phone=eq.'+p+'&select=*'),api('nama_bentarngopi?phone=eq.'+p+'&select=*&order=created_at.desc'),api('bn_purchases?phone=eq.'+p+'&select=*,bn_purchase_items(*)&order=created_at.desc'),api('bn_rewards?phone=eq.'+p+'&select=*&order=created_at.desc')]);state.member=m?.[0];state.samples=s||[];state.purchases=tx||[];state.rewards=re||[]}
const sampleStages=['pending','approved','processing','received','reviewed'];
const statusLabel=s=>({pending:'Menunggu persetujuan',approved:'Disetujui • menunggu proses',processing:'Sampel sedang diproses',received:'Sampel sudah diterima • review tersedia',reviewed:'Sudah direview'}[s]||s);
function etaDisplay(value){if(!value)return '';const p=value.split('-');if(p.length!==3)return esc(value);return new Intl.DateTimeFormat('id-ID',{day:'numeric',month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(value+'T12:00:00Z'))}
function actualDate(value){if(!value)return null;return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(value))}
function sampleDateComparison(x){const actual=actualDate(x.actual_received_at);const estimated=x.estimated_received_date;if(!actual)return estimated?'<div class="mt-3 p-3 bg-amber-50 border border-amber-200 rounded-lg text-sm"><b>Estimasi diterima:</b> '+etaDisplay(estimated)+'<p class="text-xs mt-1">Tanggal aktual belum dicatat (akan otomatis tercatat saat admin menandai diterima).</p></div>':'<p class="muted mt-3">Estimasi belum ditentukan; tanggal aktual belum tercatat.</p>';let note='';if(estimated){const days=Math.round((Date.parse(actual+'T00:00:00Z')-Date.parse(estimated+'T00:00:00Z'))/86400000);note=days===0?'Tepat sesuai estimasi':days<0?'Lebih cepat '+Math.abs(days)+' hari dari estimasi':'Terlambat '+days+' hari dari estimasi'}return '<div class="mt-3 p-3 bg-stone-50 border border-stone-200 rounded-lg text-sm"><div><b>Estimasi diterima:</b> '+(estimated?etaDisplay(estimated):'Belum ditentukan')+'</div><div class="mt-1"><b>Aktual diterima:</b> '+etaDisplay(actual)+'</div>'+(note?'<p class="font-semibold mt-2 '+(actual>estimated?'text-red-700':'text-green-700')+'">'+note+'</p>':'<p class="muted mt-2">Tidak ada estimasi untuk dibandingkan.</p>')+'</div>'}
function sampleRows(){return state.samples.map(x=>{const stage=sampleStages.indexOf(x.status),steps=['Diajukan','Disetujui','Diproses','Diterima','Direview'];return '<div class="border-t py-4"><div class="flex justify-between items-start gap-2"><div><b>'+esc(x.type)+'</b><p class="muted">Kode '+esc(x.id)+' • Urutan #'+(x.queue_no??'-')+'</p><p class="font-semibold text-amber-800 mt-1">'+esc(statusLabel(x.status))+'</p></div><span class="tag">'+esc(x.status)+'</span></div><div class="grid grid-cols-5 gap-1 mt-3 text-center">'+steps.map((v,i)=>'<div class="text-[10px] sm:text-xs"><div class="h-2 rounded '+(stage>=i?'bg-amber-600':'bg-stone-200')+' mb-1"></div><span class="'+(stage>=i?'text-amber-900 font-semibold':'text-stone-400')+'">'+v+'</span></div>').join('')+'</div>'+sampleDateComparison(x)+(x.status==='received'?'<div class="text-center mt-4"><img class="mx-auto w-36 bg-white border rounded-lg p-2" src="'+qr(x.id)+'" alt="QR sampel"><p class="muted mt-2">Sampel sudah diterima. Silakan isi ulasan.</p><button class="btn mt-2" onclick="openReview(\''+esc(x.id)+'\')">Review Sampel</button></div>':'')+(x.status==='reviewed'?'<p class="mt-2 text-sm">'+esc(formatReview(x.review_comment))+'</p>':'')+'</div>'}).join('')||'<p class="muted">Belum pernah mengajukan sampel.</p>'}

async function renderMember(){if(!state.phone){app.innerHTML='<div class="max-w-md mx-auto fade">'+title('Member Area','Pilih masuk jika sudah member atau daftar sebagai member baru.')+'<div class="grid grid-cols-2 gap-3"><button class="card text-center p-7 font-bold" onclick="nav(\'login\')">'+icon('right-to-bracket')+'<br>Masuk Member</button><button class="card text-center p-7 font-bold" onclick="nav(\'register\')">'+icon('user-plus')+'<br>Buat Member</button></div></div>';return}await loadMember();setTimeout(loadMyOrders,0);if(!state.member){logout();return}const cost=state.settings.reward_cost;const used=state.samples.length,remaining=Math.max(0,state.settings.sample_quota-(await api('nama_bentarngopi?select=id')).length);const sampleText=!state.settings.sample_open?'Sampel Belum Dibuka':remaining<=0?'Sampel Habis':used>=state.settings.sample_per_member?'Batas Pengajuan Tercapai':'Ajukan Free Sampel';let disable=sampleText!=='Ajukan Free Sampel';const m=state.member;app.innerHTML='<div class="fade">'+title('Halo, '+esc(m.name)+' 👋','Dashboard member & riwayat aktivitas')+'<div class="grid md:grid-cols-2 gap-4 mb-4"><div class="card text-center"><h3 class="font-bold">Kartu Member</h3><img class="mx-auto my-3 w-36 border p-2 rounded-xl" src="'+qr(state.phone)+'" alt="QR member"><p class="font-mono font-bold">'+esc(state.phone)+'</p><button class="text-red-700 text-sm mt-3 underline" onclick="logout()">Keluar</button></div><div class="card"><h3 class="font-bold mb-2">'+icon('stamp')+' Stamps Anda</h3><div class="text-4xl font-black text-amber-700">'+m.stamps+' <span class="text-sm text-stone-500">/ '+cost+' untuk reward</span></div><div class="bg-stone-200 h-3 rounded-full overflow-hidden my-4"><div class="bg-amber-600 h-full" style="width:'+Math.min(100,m.stamps/cost*100)+'%"></div></div><p class="muted">'+state.settings.stamp_per_item+' stamp per produk memenuhi syarat, maksimal '+state.settings.stamp_max_transaction+' / transaksi.</p><button class="btn mt-4 w-full" '+(m.stamps<cost?'disabled':'')+' onclick="claimReward()">Klaim Free Kopi ('+cost+' stamp)</button></div></div><div class="card mb-4"><div class="flex justify-between gap-2 items-center"><h2 class="font-extrabold text-lg">Free Sampel</h2><span class="tag">Sisa '+remaining+' / '+state.settings.sample_quota+'</span></div><p class="muted my-2">'+(state.settings.sample_open?'Pengajuan sedang dibuka':'Pengajuan sedang ditutup')+' • Maks. '+state.settings.sample_per_member+' pengajuan per member</p><button class="btn my-2" '+(disable?'disabled':'')+' onclick="nav(\'request\')">'+esc(sampleText)+'</button><div class="mt-3"><h3 class="font-semibold">Riwayat & status sampel</h3>'+sampleRows()+'</div></div><div class="card mb-4"><h2 class="font-extrabold text-lg">Riwayat Pembelian</h2>'+(state.purchases.map(x=>'<div class="border-t py-3"><div class="flex justify-between"><b>'+fmt(x.created_at)+'</b><b>'+money(x.total)+'</b></div><p class="muted">+'+x.stamps_earned+' stamp • '+(x.bn_purchase_items||[]).map(y=>esc(y.name)+' × '+y.quantity).join(', ')+'</p></div>').join('')||'<p class="muted mt-3">Belum ada pembelian tercatat.</p>')+'</div><div class="card"><h2 class="font-extrabold text-lg">Riwayat Klaim Free Kopi</h2>'+(state.rewards.map(x=>'<p class="border-t py-3 text-sm">'+fmt(x.created_at)+' • Klaim kopi gratis • -'+x.stamps_spent+' stamp</p>').join('')||'<p class="muted mt-3">Belum ada reward diklaim.</p>')+'</div><div class=\"mt-8\">'+menuCards(true)+'</div></div>'}
async function claimReward(){if(!confirm('Klaim free kopi menggunakan stamp Anda?'))return;try{await api('rpc/bn_claim_reward_v2','POST',{p_phone:state.phone});toast('Klaim free kopi berhasil. Tunjukkan riwayat klaim ke kasir.');nav('member')}catch(e){}}
async function renderRequest(){if(!state.phone)return nav('member');const available=state.menu.filter(x=>x.sample_enabled&&x.active);app.innerHTML='<div class="card max-w-xl mx-auto fade">'+title('Pengajuan Free Sampel','Hanya tersedia selama program dibuka dan kuota belum habis.')+'<form onsubmit="requestSample(event)" class="space-y-3"><p class="muted">Member: '+esc(state.phone)+'</p><select class="field" id="sampleMenu" required><option value="">Pilih jenis sampel</option>'+available.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('')+'</select><textarea class="field" id="sampleAddress" placeholder="Alamat lengkap untuk sampel" rows="3" required></textarea><button class="btn w-full" '+(!available.length?'disabled':'')+'>Ajukan Sampel</button></form><button class="underline mt-4 text-sm" onclick="nav(\'member\')">Kembali ke Member</button></div>'}
async function requestSample(e){e.preventDefault();try{let r=await api('rpc/bn_request_sample','POST',{p_phone:state.phone,p_menu_id:document.getElementById('sampleMenu').value,p_address:document.getElementById('sampleAddress').value});toast('Pengajuan berhasil! Nomor antrean #'+r.queue_no);nav('member')}catch(e){}}
async function openReview(id){state.selectedSample=id;state.view='review';await render()}
async function renderReview(){if(!state.phone)return nav('member');await loadMember();let s=state.samples.find(x=>x.id===state.selectedSample);if(!s)return nav('member');if(s.status!=='received'){app.innerHTML='<div class="card">Review tersedia setelah admin menandai sampel sudah diterima.<button onclick="nav(\'member\')" class="btn mt-4">Kembali</button></div>';return}state.ratings=[0,0,0,0];const fields=['Rasa '+s.type,'Aroma','Tingkat Manis','Penyajian'];app.innerHTML='<div class="card max-w-xl mx-auto fade">'+title('Review '+esc(s.type),'Beri bintang untuk setiap aspek dan tuliskan keterangan sendiri.')+'<form onsubmit="saveReview(event)" class="space-y-5">'+fields.map((f,i)=>'<div><b>'+esc(f)+'</b><div id="rating'+i+'" class="flex gap-2 mt-2">'+[1,2,3,4,5].map(n=>'<button type="button" class="text-3xl text-stone-300" onclick="rate('+i+','+n+')">★</button>').join('')+'</div></div>').join('')+'<textarea class="field" id="reviewNote" rows="4" required placeholder="Tuliskan keterangan review kopi berdasarkan pengalaman Anda"></textarea><button class="btn w-full">Kirim Review & Dapatkan +2 Stamp</button></form></div>'}
function rate(i,n){state.ratings[i]=n;document.querySelectorAll('#rating'+i+' button').forEach((b,j)=>{b.style.color=j<n?'#d97706':'#d6d3d1'})}
async function saveReview(e){e.preventDefault();if(state.ratings.some(x=>!x))return toast('Beri semua penilaian bintang',true);let k=document.getElementById('reviewNote').value.trim();if(!k)return toast('Isi keterangan review',true);let [rasa,aroma,manis,penyajian]=state.ratings;let data=JSON.stringify({rasa,aroma,manis,penyajian,keterangan:k});try{await api('rpc/bn_submit_review','POST',{p_id:state.selectedSample,p_rating:Math.round((rasa+aroma+manis+penyajian)/4),p_comment:data});toast('Review terkirim, +2 stamp!');nav('member')}catch(e){}}
function optionMenu(pred=()=>true){return state.menu.filter(pred).map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('')}
let adminMemberRows=[];
async function loadMembers(){
 const target=document.getElementById('memberList');if(target)target.innerHTML='<p class="muted">Memuat member...</p>';
 try{const data=await staffRPC('bn_admin_list_members',{p_token:state.adminSession.token});adminMemberRows=Array.isArray(data)?data:[];filterMembers();}
 catch(e){if(target)target.innerHTML='<p class="text-red-700">'+esc(e.message)+'</p>';toast('Gagal memuat member: '+e.message,true)}
}
function filterMembers(){
 const target=document.getElementById('memberList');if(!target)return;
 const term=(document.getElementById('memberSearch')?.value||'').trim().toLowerCase();
 const rows=adminMemberRows.filter(m=>(m.name||'').toLowerCase().includes(term)||(m.phone||'').toLowerCase().includes(term));
 target.innerHTML=rows.length?rows.map(m=>'<div class="rounded-xl border border-stone-200 p-4 flex flex-col sm:flex-row sm:justify-between gap-3"><div><b class="text-coffee-900">'+esc(m.name)+'</b><p class="muted">'+esc(m.phone)+'</p><p class="text-sm mt-2"><span class="tag">'+Number(m.stamps||0)+' stamp</span> <span class="text-stone-600 ml-2">'+Number(m.sample_count||0)+' permintaan sampel</span></p></div><div class="flex gap-2 flex-wrap"><button type="button" class="btn !bg-coffee-800" onclick="openMemberDetail('+JSON.stringify(m.phone).replaceAll('"','&quot;')+')">Detail</button><button type="button" class="btn !bg-amber-700" onclick="renameMember('+JSON.stringify(m.phone).replaceAll('"','&quot;')+')">Edit Nama</button></div></div>').join(''):'<p class="muted">Tidak ada member yang cocok.</p>';
}
let memberDetailPhone=null;
function readableReview(v){
 if(!v)return '<span class="muted">Belum ada review</span>';
 let x;try{x=JSON.parse(v)}catch(e){return '<p class="text-sm">'+esc(String(v))+'</p>'}
 if(!x||typeof x!=='object')return '<p>'+esc(String(v))+'</p>';
 return '<div class="grid grid-cols-2 gap-2 text-sm">'+[['Rasa',x.rasa],['Aroma',x.aroma],['Tingkat Manis',x.manis],['Penyajian',x.penyajian]].map(([k,n])=>'<div class="rounded-lg bg-amber-50 p-2"><b>'+k+'</b><br><span class="text-amber-700">'+('★'.repeat(Math.max(0,Math.min(5,Number(n)||0))))+'</span> '+esc(n??'-')+'/5</div>').join('')+'</div><p class="mt-2 text-sm">'+esc(x.keterangan||'')+'</p>';
}
function detailSection(titleTxt,body){return '<section class="rounded-xl border border-stone-200 p-4"><h3 class="font-bold text-coffee-900 mb-3">'+titleTxt+'</h3>'+body+'</section>'}
async function openMemberDetail(phone){
 if(state.adminSession?.role!=='admin')return toast('Hanya Admin yang dapat membuka detail member',true);
 memberDetailPhone=phone;
 const panel=document.getElementById('memberDetailPanel'), list=document.getElementById('memberList');
 if(!panel)return;
 panel.classList.remove('hidden');if(list)list.classList.add('hidden');
 panel.innerHTML='<button type="button" class="btn !bg-stone-700 mb-3" onclick="closeMemberDetail()">← Kembali ke Daftar Member</button><p class="muted">Memuat detail member...</p>';
 try{
  const d=await staffRPC('bn_admin_member_detail',{p_token:state.adminSession.token,p_phone:phone});
  if(!d||!d.member)throw Error('Member tidak ditemukan');
  const m=d.member, samples=d.samples||[], purchases=d.purchases||[], rewards=d.rewards||[], changes=d.stamp_changes||[];
  const sampleHTML=samples.map(x=>'<div class="border-t py-3"><div class="flex flex-wrap justify-between gap-2"><b>'+esc(x.type)+' · #'+esc(x.queue_no??'-')+'</b><span class="tag">'+esc(statusLabel(x.status))+'</span></div><p class="muted">'+esc(x.id)+' · Diajukan '+fmt(x.created_at||x.date)+'</p><p class="text-xs">Estimasi: '+(x.estimated_received_date?fmt(x.estimated_received_date):'-')+' · Aktual: '+(x.actual_received_at?fmt(x.actual_received_at):'-')+'</p>'+(x.review_comment?'<div class="mt-2 rounded-lg bg-stone-50 p-3"><b>Hasil Review · '+esc(x.review_rating??'-')+'/5</b>'+readableReview(x.review_comment)+'</div>':'')+'</div>').join('')||'<p class="muted">Belum mengajukan sampel.</p>';
  const purchaseHTML=purchases.map(x=>'<div class="border-t py-3"><div class="flex flex-wrap justify-between gap-2"><b>'+fmt(x.created_at)+'</b><b>'+money(x.total)+'</b></div><p class="text-sm">+'+Number(x.stamps_earned||0)+' stamp · ID '+esc(String(x.id).slice(0,12))+'</p><p class="muted">'+(x.items||[]).map(i=>esc(i.name)+' × '+Number(i.quantity||0)+' ('+money(i.unit_price)+')').join(', ')+'</p></div>').join('')||'<p class="muted">Belum ada pembelian.</p>';
  const rewardHTML=rewards.map(x=>'<div class="border-t py-3"><b>'+fmt(x.created_at)+'</b><p class="muted">'+esc(x.status||'claimed')+' · -'+Number(x.stamps_spent||0)+' stamp</p></div>').join('')||'<p class="muted">Belum ada klaim reward.</p>';
  const changesHTML=changes.map(x=>'<div class="border-t py-3 flex justify-between gap-2"><div><b>'+fmt(x.created_at)+'</b><p class="muted">'+esc(x.reason||'Perubahan saldo stamp')+' · '+Number(x.stamps_before)+' → '+Number(x.stamps_after)+'</p></div><b class="'+(x.delta>=0?'text-green-700':'text-red-700')+'">'+(x.delta>0?'+':'')+Number(x.delta)+'</b></div>').join('')||'<p class="muted">Belum ada catatan perubahan sejak audit log diaktifkan.</p>';
  panel.innerHTML='<div class="flex flex-wrap gap-2 justify-between items-center"><button class="btn !bg-stone-700" onclick="closeMemberDetail()">← Daftar Member</button><button class="btn" onclick="openMemberDetail(memberDetailPhone)">↻ Refresh</button></div>'+
   '<div class="bg-coffee-900 text-white rounded-xl p-4"><h2 class="text-xl font-bold">'+esc(m.name)+'</h2><p>'+esc(m.phone)+'</p><p class="mt-3 font-bold text-amber-300">Saldo saat ini: '+Number(m.stamps||0)+' stamp</p></div>'+
   '<div class="grid gap-3">'+detailSection('Riwayat Sampel & Hasil Review ('+samples.length+')',sampleHTML)+detailSection('Histori Pembelian ('+purchases.length+')',purchaseHTML)+detailSection('Perubahan Stamp ('+changes.length+')',changesHTML)+detailSection('Riwayat Klaim Reward ('+rewards.length+')',rewardHTML)+'</div>'+
   '<p class="text-xs text-stone-500">Log perubahan stamp hanya tersedia mulai saat upgrade audit diterapkan. Transaksi dan klaim sebelumnya tetap muncul pada riwayat masing-masing jika datanya tersimpan.</p>';
 }catch(e){panel.innerHTML='<button class="btn !bg-stone-700" onclick="closeMemberDetail()">← Kembali</button><p class="mt-3 text-red-700">'+esc(e.message||'Gagal memuat detail')+'</p>';toast(e.message||'Gagal memuat detail',true)}
}
function closeMemberDetail(){memberDetailPhone=null;const p=document.getElementById('memberDetailPanel');if(p){p.classList.add('hidden');p.innerHTML=''}const l=document.getElementById('memberList');if(l)l.classList.remove('hidden')}
async function renameMember(phone){
 const record=adminMemberRows.find(m=>m.phone===phone);if(!record)return;
 const name=prompt('Nama member baru',record.name||'');if(name===null)return;
 if(!name.trim()||name.trim().length>100)return toast('Nama wajib diisi (maksimal 100 karakter)',true);
 try{await staffRPC('bn_admin_rename_member',{p_token:state.adminSession.token,p_phone:phone,p_name:name.trim()});toast('Nama member diperbarui');await loadMembers();}
 catch(e){toast(e.message,true)}
}
async function loadStaffUsers(){
 try{
  const users=await staffRPC('bn_list_staff',{p_token:state.adminSession.token});
  const target=document.getElementById('staffList');
  if(target)target.innerHTML=users.length?users.map(u=>'<div class="rounded-xl border border-stone-200 p-3 space-y-2"><div class="flex justify-between gap-3 items-center"><div><b>'+esc(u.username)+'</b><p class="text-xs text-stone-500">'+esc(u.role)+' · '+(u.active?'Aktif':'Nonaktif')+'</p></div><span class="tag">'+(u.active?'Aktif':'Nonaktif')+'</span></div><div class="grid grid-cols-2 sm:grid-cols-3 gap-2"><button class="btn text-xs !py-2" onclick="changeStaffRole(\''+u.id+'\',\''+u.role+'\')">Ubah Role</button><button class="btn text-xs !py-2 !bg-amber-700" onclick="resetStaffPin(\''+u.id+'\')">Ganti PIN</button><button class="btn text-xs !py-2 !bg-stone-700" onclick="toggleStaff(\''+u.id+'\','+(!u.active)+')">'+(u.active?'Nonaktifkan':'Aktifkan')+'</button></div></div>').join(''):'<p class="muted">Belum ada akun.</p>';
 }catch(e){toast('Gagal membaca daftar user: '+e.message,true)}
}
async function createStaff(e){e.preventDefault();const form=e.target;
 const name=form.querySelector('[name=username]').value.trim().toLowerCase(),pin=form.querySelector('[name=pin]').value,role=form.querySelector('[name=role]').value;
 if(!/^[a-z0-9_]{3,32}$/.test(name)||!/^[0-9]{8,12}$/.test(pin))return toast('Username 3-32 karakter, PIN 8-12 angka',true);
 const btn=form.querySelector('button');btn.disabled=true;
 try{await staffRPC('bn_manage_staff',{p_token:state.adminSession.token,p_action:'create',p_username:name,p_pin:pin,p_role:role});form.reset();toast('User berhasil dibuat');await loadStaffUsers()}
 catch(err){toast(err.message,true)}finally{btn.disabled=false}
}
async function changeStaffRole(id,role){const next=role==='admin'?'kasir':'admin';if(!confirm('Ubah role menjadi '+next+'? Sesi user akan berakhir.'))return;
 try{await staffRPC('bn_manage_staff',{p_token:state.adminSession.token,p_action:'role',p_user_id:id,p_role:next});toast('Role diubah');await loadStaffUsers()}catch(e){toast(e.message,true)}
}
async function resetStaffPin(id){const pin=prompt('Masukkan PIN baru (8–12 angka):');if(pin===null)return;if(!/^[0-9]{8,12}$/.test(pin))return toast('PIN harus 8-12 digit',true);
 try{await staffRPC('bn_manage_staff',{p_token:state.adminSession.token,p_action:'pin',p_user_id:id,p_pin:pin});toast('PIN diperbarui dan sesi lama diakhiri');await loadStaffUsers()}catch(e){toast(e.message,true)}
}
async function toggleStaff(id,active){if(!confirm(active?'Aktifkan akun ini?':'Nonaktifkan akun ini?'))return;

function drawCart(){const el=document.getElementById('cartList');if(!el)return;el.innerHTML=state.cart.length?state.cart.map((x,i)=>{let m=state.menu.find(z=>z.id===x.id);return '<div class=\"flex justify-between border-b py-2\"><span>'+esc(m?.name)+' × '+x.qty+'</span><button type=\"button\" class=\"text-red-700\" onclick=\"removeCart('+i+')\">Hapus</button></div>'}).join('')+'<p class=\"muted mt-2\">Estimasi stamp: '+Math.min(state.settings.stamp_max_transaction,state.cart.reduce((sum,x)=>{let m=state.menu.find(y=>y.id===x.id);return sum+(m?.stamp_enabled?x.qty:0)},0)*state.settings.stamp_per_item)+'</p>':'<p class=\"muted\">Belum ada produk dimasukkan ke transaksi.</p>'}
async function addPurchase(e){e.preventDefault();let p=phoneVal(document.getElementById('purchasePhone').value);if(!state.cart.length)return toast('Tambahkan produk ke transaksi terlebih dahulu',true);try{let r=await api('rpc/bn_record_purchase','POST',{p_phone:p,p_items:state.cart});state.cart=[];toast('Transaksi tercatat: +'+r.stamps+' stamp • '+money(r.total));await stopCamera();nav('admin')}catch(e){}}
async function startScanner(){if(!window.Html5Qrcode)return toast('Library kamera tidak termuat',true);await stopCamera();try{state.camera=new Html5Qrcode('scanner');await state.camera.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},async text=>{document.getElementById('purchasePhone').value=phoneVal(text);toast('QR Member terbaca');await stopCamera()},()=>{})}catch(e){console.error(e);toast('Kamera gagal dibuka. Gunakan HTTPS atau pilih galeri.',true)}}
async function scanGallery(e){let file=e.target.files?.[0];if(!file)return;if(!window.Html5Qrcode)return toast('Library QR tidak tersedia',true);await stopCamera();try{const reader=new Html5Qrcode('scanner');let text=await reader.scanFile(file,true);document.getElementById('purchasePhone').value=phoneVal(text);toast('QR Member terbaca dari galeri');reader.clear()}catch(err){console.error(err);toast('QR tidak terbaca dari gambar',true)}}


function savedOrderAccess(){try{return JSON.parse(localStorage.getItem('bnOrderAccessV1')||'[]')}catch{return []}}
function storeOrderAccess(id,secret){if(!id||!secret)return;const rows=savedOrderAccess().filter(x=>x.id!==id);rows.unshift({id,secret});localStorage.setItem('bnOrderAccessV1',JSON.stringify(rows.slice(0,80)))}
function importOrderAccess(){const v=document.getElementById('orderAccess')?.value.trim()||'';const a=v.split(':');if(a.length!==2||!/^[0-9a-f-]{36}$/i.test(a[0])||!/^[0-9a-f]{64}$/i.test(a[1]))return toast('Kode akses tidak valid',true);storeOrderAccess(a[0],a[1]);loadMyOrders()}
async function loadMyOrders(){
 const el=document.getElementById('myOrders');if(!el)return;
 const saved=savedOrderAccess();if(!saved.length){el.innerHTML='<p class="muted">Belum ada pesanan tersimpan di perangkat ini.</p>';return}
 el.innerHTML='<p class="muted">Memuat status pesanan...</p>';
 const results=await Promise.all(saved.map(async a=>{try{return await api('rpc/bn_customer_order_detail','POST',{p_order_id:a.id,p_access_token:a.secret})}catch{return null}}));
 const orders=results.filter(Boolean);
 el.innerHTML=orders.length?orders.map(o=>'<article class="border-t py-4 space-y-2"><div class="flex justify-between gap-2"><b>'+esc(o.order_no)+'</b><span class="tag">'+esc(({pending:'Menunggu',confirmed:'Dikonfirmasi',processing:'Diproses',completed:'Selesai',cancelled:'Dibatalkan'})[o.status]||o.status)+'</span></div><p class="muted">'+fmt(o.created_at)+' · '+esc(o.customer_name)+'</p><p class="text-sm">'+(o.items||[]).map(i=>esc(i.product_name)+' × '+Number(i.quantity)).join(', ')+'</p><b>'+money(o.total)+'</b><div class="flex flex-wrap gap-2"><button class="btn !bg-green-700" onclick="contactOrderAdmin('+JSON.stringify(o.order_no)+')">WhatsApp Admin</button><button class="btn !bg-stone-700" onclick="copyOrderAccess('+JSON.stringify(o.id)+')">Salin Kode Akses</button></div></article>').join(''):'<p class="muted">Pesanan tidak ditemukan atau kode akses sudah tidak berlaku.</p>';
}
function contactOrderAdmin(no){window.open('https://wa.me/'+ADMIN_WA+'?text='+encodeURIComponent('Halo Admin BentarNgopi, saya ingin menanyakan status pesanan '+no),'_blank','noopener,noreferrer')}
function copyOrderAccess(id){const a=savedOrderAccess().find(x=>x.id===id);if(a)navigator.clipboard.writeText(a.id+':'+a.secret).then(()=>toast('Kode akses disalin')).catch(()=>toast('Gagal menyalin kode',true))}


async function renderBnToppingAdmin(){
 if(state.adminSession?.role!=='admin')return toast('Khusus Admin',true);
 const all=await api('bn_toppings?select=*&order=name','GET').catch(()=>[]);
 bnToppings=all.filter(t=>t.active);
 app.innerHTML='<div class="max-w-3xl mx-auto space-y-4"><button class="underline" onclick="nav(\'admin\')">← Dashboard Admin</button><div class="card"><h2 class="text-xl font-bold">Manajemen Topping & Harga</h2><p class="muted mb-3">Di sini hanya mengelola daftar topping dan harga. Ketersediaan topping untuk masing-masing produk diatur melalui Manajemen Produk.</p><button class="btn" onclick="bnEditTopping()">+ Tambah Topping</button><div class="mt-4 space-y-2">'+all.map(t=>'<div class="flex items-center justify-between border rounded-xl p-3 gap-3"><div><b>'+esc(t.name)+'</b><p class="muted">'+money(t.price)+' · '+(t.active?'Aktif':'Nonaktif')+'</p></div><button class="btn" onclick="bnEditTopping('+JSON.stringify(t.id)+')">Edit</button></div>').join('')+'</div></div></div>';
}
async function bnEditTopping(id){
 const old=bnToppings.find(t=>t.id===id);
 const name=prompt('Nama topping',old?.name||'');if(!name)return;
 const price=Number(prompt('Harga topping (Rp)',String(old?.price||0)));if(!Number.isFinite(price)||price<0)return toast('Harga tidak valid',true);
 const active=confirm('Topping aktif dan tersedia untuk pelanggan?');
 await staffRPC('bn_admin_set_topping',{p_token:state.adminSession.token,p_id:id||null,p_name:name,p_price:price,p_active:active});
 renderBnToppingAdmin();
}
async function bnSaveMenuToppings(id){
 const ids=[...document.querySelectorAll('[data-bn-menu="'+CSS.escape(id)+'"]:checked')].map(e=>e.value);
 await staffRPC('bn_admin_set_menu_toppings',{p_token:state.adminSession.token,p_menu_id:id,p_topping_ids:ids});
 renderBnToppingAdmin();toast('Pilihan topping tersimpan');
}

let bnToppings=[],bnAllowed=[];
async function loadBnToppings(){try{bnToppings=await api('bn_toppings?select=id,name,price&active=eq.true&order=name','GET');bnAllowed=await api('bn_menu_toppings?select=menu_id,topping_id','GET')}catch(e){bnToppings=[];bnAllowed=[]}}
function bnChoices(id){return bnToppings.filter(t=>bnAllowed.some(a=>a.menu_id===id&&a.topping_id===t.id))}
function bnSelect(id,field,val){const x=state.onlineCart.find(z=>z.id===id);if(x){x[field]=val;renderOnlineOrder()}}
function bnTopping(id,toppingId,checked){const x=state.onlineCart.find(z=>z.id===id);if(!x)return;x.toppings=x.toppings||[];x.toppings=checked?[...new Set([...x.toppings,toppingId])]:x.toppings.filter(v=>v!==toppingId);renderOnlineOrder()}
const ADMIN_WA='6287880862888';
loadBnToppings().then(()=>{if(state.view==='order')renderOnlineOrder()});
function addOnlineProduct(id){const m=state.menu.find(x=>x.id===id&&x.active);if(!m)return toast('Produk tidak tersedia',true);const found=state.onlineCart.find(x=>x.id===id);if(found){if(found.qty>=100)return toast('Maksimal 100 per produk',true);found.qty++}else state.onlineCart.push({id,qty:1,sugar:m.sugar_enabled===false?'none':(m.default_sugar||'normal'),ice:m.default_ice||'normal',toppings:[]});toast(m.name+' masuk keranjang');if(state.view==='home')renderHome();else renderOnlineOrder()}
function setOnlineQty(id,value){const x=state.onlineCart.find(z=>z.id===id);if(!x)return;const q=Math.floor(Number(value));if(!Number.isFinite(q)||q<1){state.onlineCart=state.onlineCart.filter(z=>z!==x)}else x.qty=Math.min(100,q);renderOnlineOrder()}
function changeOnlineQty(id,delta){const x=state.onlineCart.find(z=>z.id===id);if(!x)return;x.qty+=delta;if(x.qty<=0)state.onlineCart=state.onlineCart.filter(z=>z!==x);else x.qty=Math.min(100,x.qty);renderOnlineOrder()}
function onlineItemTotal(x){const m=state.menu.find(z=>z.id===x.id);if(!m)return 0;const extras=(x.toppings||[]).reduce((sum,id)=>sum+Number(bnChoices(x.id).find(t=>t.id===id)?.price||0),0);return (Number(state.phone?m.price_member:m.price_normal)+extras)*x.qty}
function onlineCalc(){return state.onlineCart.reduce((sum,x)=>{const m=state.menu.find(z=>z.id===x.id);const extra=(x.toppings||[]).reduce((n,id)=>n+Number(bnChoices(x.id).find(t=>t.id===id)?.price||0),0);return sum+(m?(Number(state.phone?m.price_member:m.price_normal)+extra)*x.qty:0)},0)}
function setOnlineType(t){syncOnlineMember();renderOnlineOrder()}
function renderOnlineOrder(){
 const oldForm={};
 for(const id of ['onName','onPhone','onAddress','onNotes']){const el=document.getElementById(id);if(el)oldForm[id]=el.value;}
 const member=state.onlineType==='member';
 state.onlineCart=state.onlineCart.filter(x=>state.menu.some(m=>m.id===x.id&&m.active));
 const rows=state.onlineCart.map(x=>{
  const m=state.menu.find(z=>z.id===x.id&&z.active);if(!m)return '';if(m.sugar_enabled===false)x.sugar='none';
  const select=(field,label)=>'<label class="text-sm font-semibold">'+label+'<select class="field mt-1" onchange="bnSelect('+JSON.stringify(x.id)+','+JSON.stringify(field)+',this.value)">'+['less','normal','extra'].map(v=>'<option value="'+v+'" '+((x[field]||'normal')===v?'selected':'')+'>'+({less:'Less',normal:'Normal',extra:'Extra'}[v])+'</option>').join('')+'</select></label>';
  const topping=bnChoices(x.id).map(t=>'<label class="flex items-center justify-between gap-2 text-sm py-1"><span><input type="checkbox" '+((x.toppings||[]).includes(t.id)?'checked':'')+' onchange="bnTopping('+JSON.stringify(x.id)+','+JSON.stringify(t.id)+',this.checked)"> '+esc(t.name)+'</span><span>+'+money(t.price)+'</span></label>').join('');
  return '<div class="border-b py-4"><div class="flex justify-between items-center gap-2"><div><b>'+esc(m.name)+'</b><p class="muted">'+money(member?m.price_member:m.price_normal)+' / produk</p></div><div class="flex items-center gap-2"><button class="border rounded-lg px-3 py-1" onclick="changeOnlineQty('+JSON.stringify(x.id)+',-1)">−</button><input aria-label="Jumlah produk" type="number" min="1" max="100" class="w-14 border rounded-lg text-center p-1" value="'+x.qty+'" onchange="setOnlineQty('+JSON.stringify(x.id)+',this.value)"><button class="border rounded-lg px-3 py-1" onclick="changeOnlineQty('+JSON.stringify(x.id)+',1)">+</button></div></div><div class="grid grid-cols-2 gap-3 mt-3">'+(m.sugar_enabled===false?'<div class="text-sm bg-stone-100 rounded-xl p-3">Sugar: <b>No Sugar</b></div>':select('sugar','Sugar'))+select('ice','Ice')+'</div>'+(topping?'<div class="mt-3"><b class="text-sm">Extra Topping</b>'+topping+'</div>':'')+'<div class="text-right mt-2 font-bold text-amber-800">Subtotal: '+money(onlineItemTotal(x))+'</div></div>';
 }).join('');
 app.innerHTML='<div class="fade max-w-2xl mx-auto w-full space-y-4 pb-28"><div class="flex justify-between items-center"><h1 class="text-2xl font-black text-coffee-900">Pesan Minuman</h1><button class="underline" onclick="nav(\'home\')">← Katalog</button></div>'+
'<div class="card"><h2 class="font-bold mb-3">Keranjang Pesanan · Edit Qty & Topping</h2>'+(rows||'<p class="muted">Keranjang masih kosong. Pilih minuman dari katalog.</p>')+'<div class="flex justify-between font-bold text-lg mt-4"><span>Total Estimasi</span><span>'+money(onlineCalc())+'</span></div></div>'+
'<div class="card"><h2 class="font-bold mb-3">Data Pemesan</h2><p class="muted mb-3">'+(member?'Anda masuk sebagai Member. Harga Member otomatis berlaku.':'Belum masuk Member. Harga Normal berlaku. Masuk Member untuk mendapatkan harga Member.')+'</p>'+
(member?'<label class="flex items-center gap-2 text-sm mb-3"><input type="checkbox" id="onlineUseMember" onchange="fillOnlineMember(this.checked)" '+(state.member&&state.phone?'checked':'')+'> Gunakan data sama seperti profil member</label>':'')+
'<form onsubmit="submitOnlineOrder(event)" class="space-y-3">'+
'<label class="block text-sm font-semibold">Nama Lengkap<input id="onName" maxlength="100" class="field mt-1" required value="'+esc(member?(state.member?.name||''):'')+'"></label>'+
'<label class="block text-sm font-semibold">No. WhatsApp<input id="onPhone" type="tel" inputmode="tel" class="field mt-1" required value="'+esc(member?(state.phone||''):'')+'" '+(member?'readonly':'')+' placeholder="08xxxxxxxxxx"></label>'+
'<label class="block text-sm font-semibold">Alamat Lengkap<textarea id="onAddress" required minlength="8" maxlength="500" rows="3" class="field mt-1" placeholder="Jalan, nomor rumah, RT/RW, kelurahan, kecamatan, kota/kabupaten, patokan"></textarea></label>'+
'<label class="block text-sm font-semibold">Catatan (opsional)<textarea id="onNotes" maxlength="500" rows="2" class="field mt-1" placeholder="Contoh: less ice, tanpa gula"></textarea></label>'+
'<p class="muted">'+(member?'Harga member berlaku jika nomor WA terdaftar.':'Harga normal untuk non-member.')+' Pesanan tercatat terlebih dahulu, lalu bisa dibagikan melalui WhatsApp.</p>'+
'<button type="submit" class="btn w-full" '+(!state.onlineCart.length?'disabled':'')+'>Kirim Pesanan</button></form></div></div>'+
'<div class="fixed bottom-0 left-0 right-0 z-50 bg-amber-50 border-t-4 border-amber-600 shadow-2xl p-3"><div class="max-w-2xl mx-auto flex justify-between items-center gap-3"><div><div class="text-xs text-stone-500">Keranjang · '+state.onlineCart.reduce((n,x)=>n+x.qty,0)+' item</div><b class="text-lg text-amber-800">'+money(onlineCalc())+'</b></div><button class="btn" onclick="document.getElementById(\'onName\')?.scrollIntoView({behavior: \'smooth\',block: \'center\'})">Lanjut Checkout</button></div></div>';
 bnRestoreOrderForm(oldForm);
}
function bnRestoreOrderForm(values){
 for(const [id,value] of Object.entries(values)){const el=document.getElementById(id);if(el)el.value=value;}
}
function fillOnlineMember(on){if(!on)return;const n=document.getElementById('onName');const p=document.getElementById('onPhone');if(n)n.value=state.member?.name||'';if(p)p.value=state.phone||''}
async function submitOnlineOrder(e){e.preventDefault();syncOnlineMember();if(!state.onlineCart.length)return toast('Keranjang masih kosong',true);const btn=e.target.querySelector('button[type=submit]');btn.disabled=true;const name=document.getElementById('onName').value.trim(),phone=state.phone||phoneVal(document.getElementById('onPhone').value),address=document.getElementById('onAddress').value.trim(),notes=document.getElementById('onNotes').value.trim();if(!/^\+?[0-9]{9,16}$/.test(phone)){btn.disabled=false;return toast('Nomor WhatsApp tidak valid',true)}try{const items=state.onlineCart.map(x=>({...x,sugar:state.menu.find(m=>m.id===x.id)?.sugar_enabled===false?'normal':x.sugar}));const result=await api('rpc/bn_place_online_order','POST',{p_type:state.onlineType,p_name:name,p_phone:phone,p_address:address,p_notes:notes,p_items:items});state.lastOrder={...result,name,phone,address,notes,items:items.map(x=>{const m=state.menu.find(z=>z.id===x.id);return {name:m?.name||x.id,qty:x.qty,price:Number(state.onlineType==='member'?m?.price_member:m?.price_normal||0)+(x.toppings||[]).reduce((v,id)=>v+Number(bnToppings.find(t=>t.id===id)?.price||0),0),sugar:state.menu.find(m=>m.id===x.id)?.sugar_enabled===false?'none':x.sugar,ice:x.ice,toppings:(x.toppings||[]).map(id=>bnToppings.find(t=>t.id===id)?.name||id)}})};storeOrderAccess(result.order_id,result.access_token);state.onlineCart=[];renderOrderSuccess();toast('Pesanan tersimpan dan masuk ke Admin')}catch(error){btn.disabled=false}}
function orderWaText(o){return ['*PESANAN BENTAR NGOPI*','No: '+o.order_no,'Jenis: '+(o.customer_type==='member'?'Member':'Non-member'),'Nama: '+o.name,'WA: '+o.phone,'Alamat: '+o.address,'','*Pesanan:*',...o.items.map(x=>'- '+x.name+' x'+x.qty+' ('+x.sugar+' sugar, '+x.ice+' ice'+(x.toppings.length?', topping: '+x.toppings.join(', '):'')+') = '+money(x.price*x.qty)),'','*Total: '+money(o.total)+'*',o.notes?'Catatan: '+o.notes:'','Status: Menunggu konfirmasi Admin'].filter(Boolean).join('\n')}
function shareOnlineOrder(){if(!state.lastOrder)return;window.open('https://wa.me/'+ADMIN_WA+'?text='+encodeURIComponent(orderWaText(state.lastOrder)),'_blank','noopener,noreferrer')}
function renderOrderSuccess(){const o=state.lastOrder;if(!o)return nav('home');app.innerHTML='<div class="card max-w-xl mx-auto text-center fade p-7"><div class="text-5xl text-green-700 mb-4">'+icon('circle-check')+'</div><h1 class="text-2xl font-black">Pesanan Tersimpan!</h1><p class="muted mt-2">Nomor pesanan</p><p class="font-black text-xl text-coffee-800">'+esc(o.order_no)+'</p><p class="font-extrabold my-4">'+money(o.total)+'</p><p class="muted mb-5">Pesanan sudah masuk ke dashboard Admin. Tekan tombol berikut untuk mengirim ringkasan ke WhatsApp Admin.</p><button class="btn w-full !bg-green-700 mb-2" onclick="shareOnlineOrder()">'+icon('whatsapp')+' Bagikan Pesanan ke WhatsApp</button><button class="btn w-full !bg-stone-700" onclick="nav(\'home\')">Kembali ke Katalog</button></div>'}
async function loadAdminOrders(){const el=document.getElementById('onlineAdminOrders');if(!el||state.adminSession?.role!=='admin')return;el.innerHTML='<p class="muted">Memuat pesanan...</p>';try{const data=await staffRPC('bn_admin_online_orders',{p_token:state.adminSession.token});const orders=Array.isArray(data)?data:[];el.innerHTML=orders.length?orders.map(o=>'<article class="rounded-xl border p-3 space-y-2"><div class="flex items-center justify-between gap-2"><b>'+esc(o.order_no)+'</b><span class="tag">'+esc(o.status)+'</span></div><div class="text-sm">'+esc(o.customer_name)+' · '+esc(o.customer_phone)+' · '+esc(o.customer_type)+'</div><p class="text-xs text-stone-500">'+new Date(o.created_at).toLocaleString('id-ID')+'</p><div class="text-sm">'+esc(o.delivery_address)+'</div>'+(o.notes?'<p class="muted">Catatan: '+esc(o.notes)+'</p>':'')+'<div class="text-sm">'+(o.items||[]).map(i=>esc(i.product_name)+' × '+i.quantity).join(' • ')+'</div><b>'+money(o.total)+'</b><div class="flex flex-wrap gap-2">'+(o.status==='pending'?'<button class="btn" onclick="setAdminOrderStatus(\''+o.id+'\',\'confirmed\')">Konfirmasi</button>':o.status==='confirmed'?'<button class="btn" onclick="setAdminOrderStatus(\''+o.id+'\',\'processing\')">Proses</button>':o.status==='processing'?'<button class="btn" onclick="setAdminOrderStatus(\''+o.id+'\',\'completed\')">Selesai</button>':'')+(['pending','confirmed','processing'].includes(o.status)?'<button class="btn !bg-red-700" onclick="setAdminOrderStatus(\''+o.id+'\',\'cancelled\')">Batalkan</button>':'')+'</div></article>').join(''):'<p class="muted">Belum ada pesanan.</p>'}catch(e){el.innerHTML='<p class="text-red-700">Gagal memuat pesanan. Pastikan SQL Pemesanan Online sudah dijalankan.</p>'}}
async function setAdminOrderStatus(id,status){if(!confirm('Ubah status pesanan menjadi '+status+'?'))return;try{await staffRPC('bn_admin_order_status',{p_token:state.adminSession.token,p_id:id,p_status:status});toast('Status pesanan diperbarui');loadAdminOrders()}catch(e){toast('Tidak dapat memperbarui status',true)}}

window.addEventListener('hashchange',()=>{if(location.hash==='#ngopidulu'&&state.view!=='admin')nav('admin');else if(location.hash!=='#ngopidulu'&&state.view==='admin')nav('home')});
if(state.view==='admin')sessionStorage.setItem('bnAdminVisited','1');updateAdminReturn();restoreAdmin().then(render);
</script></body></html>
