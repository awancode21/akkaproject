<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Revisi SO Mobile</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .custom-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .modal-animate {
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const SPREADSHEET_ID = "10I100dl5URh59Y7hiwxBfW8cyWPBE1R0wDY75Q5XcqA";
    const GID_REVISI_SO = "1723800282";
    const DEFAULT_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxk8sBWXYGZghCvlGMkzsmP4uf8LWOaL6e9tkyBg1m237nKlHS0qjKK-4QO2q1Ewxxq/exec";

    const DEFAULT_OFFICERS = {
      "TIM 1": ["Budi Santoso", "Andi Wijaya", "Agus Pratama", "Rian Hidayat", "Dedi Kurniawan", "Wildan"],
      "TIM 2": ["Eko Susilo", "Siti Aminah", "Hendra Saputra", "Maya Indah", "Rudi Hermawan", "Rillo"],
      "TIM1": ["Budi Santoso", "Andi Wijaya", "Agus Pratama", "Rian Hidayat", "Dedi Kurniawan", "Wildan"],
      "TIM2": ["Eko Susilo", "Siti Aminah", "Hendra Saputra", "Maya Indah", "Rudi Hermawan", "Rillo"]
    };

    const parseSORows = (rows) => {
      if (!rows || rows.length < 2) return [];
      
      const parseNum = (val) => {
        if (val === undefined || val === null || val === '') return 0;
        const cleaned = val.toString().replace(/,/g, '').trim();
        const num = parseInt(cleaned, 10);
        return isNaN(num) ? 0 : num;
      };

      const parsedItems = [];
      // Skip header row (index 0)
      for (let i = 1; i < rows.length; i++) {
        const cols = rows[i];
        if (!cols || cols.length < 3) continue;
        
        // Yellow Columns (A - H)
        const petugasAwal = cols[0] ? String(cols[0]).trim() : "";
        const rak = cols[1] ? String(cols[1]).trim() : "";
        const kodeItem = cols[2] ? String(cols[2]).trim() : "";
        const kodeOriginal = cols[3] ? String(cols[3]).trim() : "";
        const namaItem = cols[4] ? String(cols[4]).trim() : "";
        
        if (!kodeItem && !namaItem) continue;

        const tim1 = parseNum(cols[5]);
        const tim2 = parseNum(cols[6]);
        const selisih = cols[7] !== undefined && cols[7] !== "" ? parseNum(cols[7]) : (tim1 - tim2);
        
        // Red Input Columns (I - L)
        const rawQtyRev = cols[8] !== undefined && cols[8] !== null ? String(cols[8]).trim() : "";
        const qtyRevisiVal = rawQtyRev !== "" && !isNaN(parseInt(rawQtyRev, 10)) ? parseInt(rawQtyRev, 10) : null;
        
        const petugasRevisi = cols[9] ? String(cols[9]).trim() : "";
        const rawStatus = cols[10] ? String(cols[10]).trim() : "";
        const statusRevisi = rawStatus !== "" ? rawStatus : (qtyRevisiVal !== null ? "Sudah Revisi" : "Belum Revisi");
        const keterangan = cols[11] ? String(cols[11]).trim() : "";

        parsedItems.push({
          id: i,
          petugasAwal,
          rak,
          kodeItem,
          kodeOriginal,
          namaItem,
          tim1,
          tim2,
          selisih,
          qtyRevisi: qtyRevisiVal,
          petugasRevisi,
          timRevisi: petugasRevisi.includes("TIM 2") ? "TIM 2" : (petugasRevisi.includes("TIM 1") ? "TIM 1" : ""),
          status: statusRevisi,
          keterangan: keterangan,
          catatan: keterangan
        });
      }
      return parsedItems;
    };

    const parseOfficersRows = (rows) => {
      if (!rows || rows.length < 1) return DEFAULT_OFFICERS;
      
      const tim1List = [];
      const tim2List = [];

      const header0 = String(rows[0][0] || '').toUpperCase();
      let startRow = 0;
      if (header0.includes("TIM") || header0.includes("PETUGAS")) {
        startRow = 1;
      }

      for (let i = startRow; i < rows.length; i++) {
        const col0 = rows[i][0] ? String(rows[i][0]).trim() : '';
        const col1 = rows[i][1] ? String(rows[i][1]).trim() : '';

        if (col0) tim1List.push(col0);
        if (col1) tim2List.push(col1);
      }

      const resTim1 = tim1List.length > 0 ? tim1List : DEFAULT_OFFICERS["TIM 1"];
      const resTim2 = tim2List.length > 0 ? tim2List : DEFAULT_OFFICERS["TIM 2"];

      return {
        "TIM 1": resTim1,
        "TIM 2": resTim2,
        "TIM1": resTim1,
        "TIM2": resTim2
      };
    };

    const parseCSVTextToRows = (csvText) => {
      const lines = csvText.split(/\r?\n/).filter(line => line.trim().length > 0);
      const parseLine = (line) => {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') {
            if (inQuotes && line[i+1] === '"') { cur += '"'; i++; }
            else { inQuotes = !inQuotes; }
          } else if (c === ',' && !inQuotes) {
            result.push(cur.trim());
            cur = '';
          } else {
            cur += c;
          }
        }
        result.push(cur.trim());
        return result;
      };
      return lines.map(l => parseLine(l).map(c => c.replace(/^"|"$/g, '')));
    };

    function App() {
      const [items, setItems] = React.useState([]);
      const [officers, setOfficers] = React.useState(DEFAULT_OFFICERS);
      const [searchQuery, setSearchQuery] = React.useState("");
      const [selectedRak, setSelectedRak] = React.useState("ALL");
      const [statusFilter, setStatusFilter] = React.useState("ALL");
      
      const [isLoading, setIsLoading] = React.useState(false);
      const [activeModalItem, setActiveModalItem] = React.useState(null);
      const [showSettingsModal, setShowSettingsModal] = React.useState(false);
      const [showScriptModal, setShowScriptModal] = React.useState(false);
      const [appsScriptUrl, setAppsScriptUrl] = React.useState(DEFAULT_APPS_SCRIPT_URL);
      const [toastMsg, setToastMsg] = React.useState("");

      // State Session Officer Lock
      const [sessionOfficer, setSessionOfficer] = React.useState(() => {
        try {
          const saved = localStorage.getItem("so_session_officer");
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      const [showSessionModal, setShowSessionModal] = React.useState(() => {
        try {
          return !localStorage.getItem("so_session_officer");
        } catch (e) {
          return true;
        }
      });

      // Default Session State starts empty
      const [tempSessionTeam, setTempSessionTeam] = React.useState("TIM 1");
      const [tempSessionOfficer, setTempSessionOfficer] = React.useState("");

      // Revision Form Inputs
      const [qtyInput, setQtyInput] = React.useState("");
      const [notesInput, setNotesInput] = React.useState("");

      const fetchFromGoogleSheet = React.useCallback(async () => {
        setIsLoading(true);
        let fetchedSuccess = false;

        if (appsScriptUrl) {
          try {
            const apiRes = await fetch(appsScriptUrl);
            if (apiRes.ok) {
              const resJson = await apiRes.json();
              if (resJson && resJson.status === "Success") {
                if (resJson.dataSO && resJson.dataSO.length > 0) {
                  const parsedSO = parseSORows(resJson.dataSO);
                  setItems(parsedSO);
                  fetchedSuccess = true;
                }
                if (resJson.dataPetugas && resJson.dataPetugas.length > 0) {
                  const parsedOff = parseOfficersRows(resJson.dataPetugas);
                  setOfficers(parsedOff);
                }
                triggerToast("✅ Data Live Google Sheets berhasil dimuat!");
              }
            }
          } catch (apiErr) {
            console.warn("Fetch dari Apps Script GET gagal, mencoba CSV fallback:", apiErr);
          }
        }

        if (!fetchedSuccess) {
          try {
            const csvUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID_REVISI_SO}`;
            const response = await fetch(csvUrl);
            if (response.ok) {
              const csvText = await response.text();
              const rows = parseCSVTextToRows(csvText);
              const parsedData = parseSORows(rows);

              if (parsedData && parsedData.length > 0) {
                setItems(parsedData);
                fetchedSuccess = true;
                triggerToast("✅ Data dimuat dari Spreadsheet CSV!");
              }
            }

            try {
              const officersUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Petugas`;
              const offRes = await fetch(officersUrl);
              if (offRes.ok) {
                const offCsvText = await offRes.text();
                const offRows = parseCSVTextToRows(offCsvText);
                const parsedOfficers = parseOfficersRows(offRows);
                if (parsedOfficers) setOfficers(parsedOfficers);
              }
            } catch (offErr) {
              console.warn("Gagal membaca sheet Petugas CSV:", offErr);
            }

          } catch (csvErr) {
            console.error("Fetch CSV Error:", csvErr);
          }
        }

        if (!fetchedSuccess) {
          triggerToast("⚠️ Gagal memuat data online. Memakai data lokal.");
        }
        setIsLoading(false);
      }, [appsScriptUrl]);

      React.useEffect(() => {
        fetchFromGoogleSheet();
      }, [fetchFromGoogleSheet]);

      React.useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [items, activeModalItem, showSettingsModal, showScriptModal, showSessionModal, toastMsg, statusFilter, selectedRak, officers]);

      React.useEffect(() => {
        if (showSessionModal) {
          if (sessionOfficer) {
            setTempSessionTeam(sessionOfficer.team || "TIM 1");
            setTempSessionOfficer(sessionOfficer.name || "");
          } else {
            setTempSessionTeam("TIM 1");
            setTempSessionOfficer("");
          }
        }
      }, [showSessionModal, sessionOfficer]);

      const triggerToast = React.useCallback((msg) => {
        setToastMsg(msg);
        setTimeout(() => {
          setToastMsg("");
        }, 3000);
      }, []);

      const handleSaveSession = (team, officerName) => {
        if (!team) {
          triggerToast("⚠️ Silakan pilih Tim terlebih dahulu!");
          return;
        }
        if (!officerName || officerName.trim() === "") {
          triggerToast("⚠️ Silakan pilih Nama Petugas!");
          return;
        }
        const sessionData = { name: officerName, team };
        setSessionOfficer(sessionData);
        try {
          localStorage.setItem("so_session_officer", JSON.stringify(sessionData));
        } catch (e) {
          console.warn("Gagal simpan session", e);
        }
        setShowSessionModal(false);
        triggerToast(`🔒 Sesi dikunci: ${officerName} (${team})`);
      };

      const handleTempTeamChange = (team) => {
        setTempSessionTeam(team);
        setTempSessionOfficer("");
      };

      const openRevisionModal = (item) => {
        if (!sessionOfficer) {
          setShowSessionModal(true);
          triggerToast("⚠️ Kunci sesi nama petugas Anda terlebih dahulu!");
          return;
        }

        setActiveModalItem(item);
        setQtyInput(item.qtyRevisi !== null && item.qtyRevisi !== undefined ? String(item.qtyRevisi) : String(item.tim1 !== undefined ? item.tim1 : 0));
        setNotesInput(item.keterangan || item.catatan || "");
      };

      const saveRevision = async () => {
        if (!activeModalItem || !sessionOfficer) return;
        
        const finalOfficer = sessionOfficer.name;
        const selectedTeam = sessionOfficer.team;

        const parsedQty = parseInt(qtyInput, 10);
        if (isNaN(parsedQty) || parsedQty < 0) {
          triggerToast("⚠️ Jumlah QTY Revisi tidak valid");
          return;
        }

        const updatedOfficerName = `${finalOfficer} (${selectedTeam})`;

        const updatedItems = items.map(item => {
          if (item.id === activeModalItem.id) {
            return {
              ...item,
              qtyRevisi: parsedQty,
              petugasRevisi: updatedOfficerName,
              timRevisi: selectedTeam,
              status: "Sudah Revisi",
              keterangan: notesInput,
              catatan: notesInput
            };
          }
          return item;
        });

        setItems(updatedItems);

        // Send POST payload to Apps Script updating Columns I, J, K, L
        if (appsScriptUrl) {
          try {
            fetch(appsScriptUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                action: "updateRevision",
                kodeItem: activeModalItem.kodeItem,
                rak: activeModalItem.rak,
                qtyRevisi: parsedQty,
                petugasRevisi: updatedOfficerName,
                statusRevisi: "Sudah Revisi",
                keterangan: notesInput,
                catatan: notesInput
              })
            });
            triggerToast("💾 Ter-sync ke Kolom I, J, K, & L Google Sheets!");
          } catch (e) {
            console.error("Apps Script Sync Error:", e);
            triggerToast("⚠️ Tersimpan di HP (Gagal sync Apps Script)");
          }
        } else {
          triggerToast("💾 Status diperbarui ke SUDAH REVISI");
        }

        setActiveModalItem(null);
      };

      const rakList = React.useMemo(() => {
        const raks = items.map(i => i.rak).filter(Boolean);
        return ["ALL", ...Array.from(new Set(raks)).sort()];
      }, [items]);

      const filteredItems = items.filter(item => {
        const matchesSearch = 
          item.namaItem.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.kodeItem.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.kodeOriginal.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.rak.toLowerCase().includes(searchQuery.toLowerCase());
        
        const matchesRak = selectedRak === "ALL" || item.rak === selectedRak;
        const matchesStatus = statusFilter === "ALL" || item.status === statusFilter;

        return matchesSearch && matchesRak && matchesStatus;
      });

      const totalItems = items.length;
      const sudahRevisiCount = items.filter(i => i.status === "Sudah Revisi").length;
      const belumRevisiCount = totalItems - sudahRevisiCount;

      const exportToCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "petugas,Rak,kode item,kode original,nama item,Tim1,Tim2,Selisih,QTY Revisi,Petugas Revisi,Status Revisi,Keterangan\n";
        
        items.forEach(i => {
          const row = [
            `"${i.petugasAwal || ''}"`,
            `"${i.rak || ''}"`,
            `"${i.kodeItem || ''}"`,
            `"${i.kodeOriginal || ''}"`,
            `"${i.namaItem || ''}"`,
            i.tim1,
            i.tim2,
            i.selisih,
            i.qtyRevisi !== null && i.qtyRevisi !== undefined ? i.qtyRevisi : "",
            `"${i.petugasRevisi || ''}"`,
            `"${i.status || ''}"`,
            `"${i.keterangan || i.catatan || ''}"`
          ].join(",");
          csvContent += row + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Revisi_SO_Updated_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        triggerToast("📥 Unduh CSV Berhasil");
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col shadow-xl relative pb-20">
          
          {/* Top Header */}
          <header className="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-md">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-red-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-red-500/30">
                  SO
                </div>
                <div>
                  <h1 className="font-bold text-base leading-tight">Revisi Stock Opname</h1>
                  <p className="text-xs text-slate-400">Tim 1 & Tim 2 Opname</p>
                </div>
              </div>
              <div className="flex items-center gap-1.5">
                <button 
                  onClick={fetchFromGoogleSheet}
                  disabled={isLoading}
                  className="p-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 rounded-lg transition-all border border-slate-700"
                  title="Reload dari Spreadsheet"
                >
                  <i data-lucide="refresh-cw" className={`w-4 h-4 ${isLoading ? 'animate-spin text-blue-400' : ''}`}></i>
                </button>
                <button 
                  onClick={() => setShowSettingsModal(true)}
                  className="p-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 rounded-lg transition-all border border-slate-700"
                  title="Pengaturan Integrasi"
                >
                  <i data-lucide="settings" className="w-4 h-4"></i>
                </button>
              </div>
            </div>

            {/* Active Session Lock Bar */}
            <div className="mt-3 pt-2.5 border-t border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span className="text-xs font-semibold text-slate-300">
                  Sesi Petugas:
                </span>
                {sessionOfficer ? (
                  <span className="text-xs font-bold text-emerald-400 bg-emerald-950/80 px-2.5 py-0.5 rounded-full border border-emerald-800/60">
                    👤 {sessionOfficer.name} ({sessionOfficer.team})
                  </span>
                ) : (
                  <span className="text-xs text-amber-400 bg-amber-950/60 px-2 py-0.5 rounded-full border border-amber-800/50">
                    ⚠️ Belum dikunci
                  </span>
                )}
              </div>
              <button 
                onClick={() => setShowSessionModal(true)}
                className="text-[11px] font-bold text-red-400 hover:text-red-300 bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded-lg border border-slate-700 flex items-center gap-1 active:scale-95 transition-all"
              >
                <i data-lucide="user-check" className="w-3.5 h-3.5"></i>
                {sessionOfficer ? "Ganti" : "Kunci Sesi"}
              </button>
            </div>

            {/* Quick Summary Cards */}
            <div className="grid grid-cols-3 gap-2 mt-3 text-center">
              <div className="bg-slate-800/80 rounded-lg p-2 border border-slate-700/50">
                <span className="text-[10px] uppercase tracking-wider text-slate-400 block font-medium">Total Item</span>
                <span className="text-lg font-bold text-white">{totalItems}</span>
              </div>
              <div className="bg-amber-950/40 rounded-lg p-2 border border-amber-800/40">
                <span className="text-[10px] uppercase tracking-wider text-amber-400 block font-medium">Belum Revisi</span>
                <span className="text-lg font-bold text-amber-400">{belumRevisiCount}</span>
              </div>
              <div className="bg-emerald-950/40 rounded-lg p-2 border border-emerald-800/40">
                <span className="text-[10px] uppercase tracking-wider text-emerald-400 block font-medium">Sudah Revisi</span>
                <span className="text-lg font-bold text-emerald-400">{sudahRevisiCount}</span>
              </div>
            </div>
          </header>

          {}
          <section className="p-3 bg-white border-b border-slate-200 sticky top-[125px] z-20 shadow-sm space-y-2.5">
            <div className="relative">
              <i data-lucide="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
              <input 
                type="text"
                placeholder="Cari Rak, Nama, atau Kode Item..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full pl-9 pr-8 py-2 bg-slate-100 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 border border-slate-200 text-slate-800 placeholder-slate-400"
              />
              {searchQuery && (
                <button 
                  onClick={() => setSearchQuery("")}
                  className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
                >
                  <i data-lucide="x" className="w-4 h-4"></i>
                </button>
              )}
            </div>

            <div className="flex items-center gap-2 overflow-x-auto custom-scrollbar pb-0.5">
              <div className="flex bg-slate-100 p-1 rounded-lg border border-slate-200 text-xs shrink-0">
                <button 
                  onClick={() => setStatusFilter("ALL")}
                  className={`px-2.5 py-1 rounded-md font-medium transition-all ${statusFilter === "ALL" ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}
                >
                  Semua ({totalItems})
                </button>
                <button 
                  onClick={() => setStatusFilter("Belum Revisi")}
                  className={`px-2.5 py-1 rounded-md font-medium transition-all ${statusFilter === "Belum Revisi" ? 'bg-amber-500 text-white shadow-sm' : 'text-slate-500'}`}
                >
                  Belum ({belumRevisiCount})
                </button>
                <button 
                  onClick={() => setStatusFilter("Sudah Revisi")}
                  className={`px-2.5 py-1 rounded-md font-medium transition-all ${statusFilter === "Sudah Revisi" ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-500'}`}
                >
                  Sudah ({sudahRevisiCount})
                </button>
              </div>

              <div className="relative shrink-0">
                <select 
                  value={selectedRak}
                  onChange={(e) => setSelectedRak(e.target.value)}
                  className="bg-slate-100 border border-slate-200 text-slate-700 text-xs font-semibold rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 pr-6 appearance-none cursor-pointer"
                >
                  <option value="ALL">📍 Semua Rak</option>
                  {rakList.filter(r => r !== "ALL").map(rak => (
                    <option key={rak} value={rak}>Rak {rak}</option>
                  ))}
                </select>
                <i data-lucide="chevron-down" className="w-3 h-3 absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
              </div>
            </div>
          </section>

          <main className="flex-1 p-3 space-y-3">
            {filteredItems.length === 0 ? (
              <div className="text-center py-12 px-4 bg-white rounded-2xl border border-dashed border-slate-300 my-4">
                <i data-lucide="package-search" className="w-10 h-10 text-slate-300 mx-auto mb-2"></i>
                <p className="text-sm font-bold text-slate-600">Tidak ada item ditemukan</p>
                <p className="text-xs text-slate-400 mt-1">Coba sesuaikan pencarian atau tekan tombol reload di atas.</p>
              </div>
            ) : (
              filteredItems.map(item => {
                const isRevised = item.status === "Sudah Revisi";
                return (

    // 1. Ambil Data Sheet "Revisi SO"

    // 2. Ambil Data Sheet "Petugas"
    var sheetPetugas = ss.getSheetByName("Petugas");
    var dataPetugas = sheetPetugas ? sheetPetugas.getDataRange().getValues() : [];
    
    return ContentService.createTextOutput(JSON.stringify({
      status: "Success",
      dataSO: dataSO,
      dataPetugas: dataPetugas
    })).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({
      status: "Error",
      error: err.toString()
    })).setMimeType(ContentService.MimeType.JSON);
  }
}

function doPost(e) {
  try {
    var data = JSON.parse(e.postData.contents);
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName("Revisi SO");
    var values = sheet.getDataRange().getValues();
    
    for (var i = 1; i < values.length; i++) {
      var rak = String(values[i][1] || "").trim().toUpperCase();
      var kodeItem = String(values[i][2] || "").trim();
      
      var targetRak = String(data.rak || "").trim().toUpperCase();
      var targetKode = String(data.kodeItem || "").trim();
      
      if (kodeItem === targetKode && (rak === targetRak || !data.rak)) { 
        sheet.getRange(i + 1, 9).setValue(data.qtyRevisi);                  // Col I (9): QTY Revisi
        sheet.getRange(i + 1, 10).setValue(data.petugasRevisi);             // Col J (10): Petugas Revisi
        sheet.getRange(i + 1, 11).setValue(data.statusRevisi);              // Col K (11): Status Revisi
        sheet.getRange(i + 1, 12).setValue(data.keterangan || data.catatan || ""); // Col L (12): Keterangan
        break;
      }
    }
    return ContentService.createTextOutput(JSON.stringify({status: "Success"}))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({status: "Error", error: err.toString()}))
      .setMimeType(ContentService.MimeType.JSON);
  }
}`}

            <button 
              onClick={() => setStatusFilter("Sudah Revisi")}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${statusFilter === 'Sudah Revisi' ? 'text-emerald-600' : 'text-slate-400'}`}
            >
              <i data-lucide="check-circle" className="w-5 h-5"></i>
              Sudah ({sudahRevisiCount})
            </button>
            <button 
              onClick={exportToCSV}
              className="flex flex-col items-center gap-0.5 text-[10px] font-bold text-slate-400 hover:text-slate-700"
            >
              <i data-lucide="download" className="w-5 h-5"></i>
              Export
            </button>
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

  </script>
</body>
</html>
