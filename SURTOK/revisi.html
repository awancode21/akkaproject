<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Revisi SO Mobile</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Styles for Mobile App UI -->
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .custom-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .modal-animate {
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const SPREADSHEET_ID = "10I100dl5URh59Y7hiwxBfW8cyWPBE1R0wDY75Q5XcqA";
    const GID_REVISI_SO = "1723800282";
    const DEFAULT_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxk8sBWXYGZghCvlGMkzsmP4uf8LWOaL6e9tkyBg1m237nKlHS0qjKK-4QO2q1Ewxxq/exec";

    // Data Sample awal jika fetch offline/CORS
    const INITIAL_ITEMS = [
      { id: 1, rak: "A-01-1", kodeItem: "ITM001", kodeOriginal: "ORG-8812", namaItem: "Minyak Goreng 2L Pouch", tim1: 15, tim2: 12, selisih: 3, qtyRevisi: null, petugas: "", timRevisi: "", status: "Belum Revisi", catatan: "" },
      { id: 2, rak: "A-01-2", kodeItem: "ITM002", kodeOriginal: "ORG-8815", namaItem: "Gula Pasir Kristal 1Kg", tim1: 50, tim2: 50, selisih: 0, qtyRevisi: 50, petugas: "Budi Santoso (TIM 1)", timRevisi: "TIM 1", status: "Sudah Revisi", catatan: "Akurat" },
      { id: 3, rak: "B-02-1", kodeItem: "ITM003", kodeOriginal: "ORG-9920", namaItem: "Beras Pandan Wangi 5Kg", tim1: 20, tim2: 18, selisih: 2, qtyRevisi: null, petugas: "", timRevisi: "", status: "Belum Revisi", catatan: "" },
      { id: 4, rak: "B-02-3", kodeItem: "ITM004", kodeOriginal: "ORG-1021", namaItem: "Tepung Terigu Segitiga 1Kg", tim1: 30, tim2: 35, selisih: -5, qtyRevisi: null, petugas: "", timRevisi: "", status: "Belum Revisi", catatan: "" },
      { id: 5, rak: "C-03-1", kodeItem: "ITM005", kodeOriginal: "ORG-3341", namaItem: "Susu Kental Manis Can 370g", tim1: 100, tim2: 95, selisih: 5, qtyRevisi: 98, petugas: "Siti Aminah (TIM 2)", timRevisi: "TIM 2", status: "Sudah Revisi", catatan: "2 kaleng penyok" },
      { id: 6, rak: "C-03-2", kodeItem: "ITM006", kodeOriginal: "ORG-4412", namaItem: "Kopi Bubuk Murni 200g", tim1: 40, tim2: 40, selisih: 0, qtyRevisi: null, petugas: "", timRevisi: "", status: "Belum Revisi", catatan: "" }
    ];

    const DEFAULT_OFFICERS = {
      TIM1: ["Budi Santoso", "Andi Wijaya", "Agus Pratama", "Rian Hidayat", "Dedi Kurniawan"],
      TIM2: ["Eko Susilo", "Siti Aminah", "Hendra Saputra", "Maya Indah", "Rudi Hermawan"]
    };

    const parseCSV = (csvText) => {
      const lines = csvText.split(/\r?\n/).filter(line => line.trim().length > 0);
      if (lines.length < 2) return [];

      const parseLine = (line) => {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') {
            if (inQuotes && line[i+1] === '"') { cur += '"'; i++; }
            else { inQuotes = !inQuotes; }
          } else if (c === ',' && !inQuotes) {
            result.push(cur.trim());
            cur = '';
          } else {
            cur += c;
          }
        }
        result.push(cur.trim());
        return result;
      };

      const parsedItems = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = parseLine(lines[i]).map(c => c.replace(/^"|"$/g, ''));
        if (cols.length < 5) continue;
        
        const rak = cols[1] || cols[0] || "";
        const kodeItem = cols[2] || cols[1] || "";
        const kodeOriginal = cols[3] || cols[2] || "";
        const namaItem = cols[4] || cols[3] || "";
        const tim1 = parseInt(cols[5]) || 0;
        const tim2 = parseInt(cols[6]) || 0;
        const selisih = parseInt(cols[7]) || (tim1 - tim2);
        const qtyRevisiVal = cols[8] !== "" && cols[8] !== undefined && !isNaN(parseInt(cols[8])) ? parseInt(cols[8]) : null;
        const petugas = cols[0] || "";
        const status = qtyRevisiVal !== null ? "Sudah Revisi" : "Belum Revisi";
        const catatan = cols[10] || cols[9] || "";

        parsedItems.push({
          id: i,
          rak,
          kodeItem,
          kodeOriginal,
          namaItem,
          tim1,
          tim2,
          selisih,
          qtyRevisi: qtyRevisiVal,
          petugas,
          timRevisi: petugas.includes("TIM 2") ? "TIM 2" : "TIM 1",
          status,
          catatan
        });
      }
      return parsedItems;
    };

    function App() {
      const [items, setItems] = React.useState(INITIAL_ITEMS);
      const [officers, setOfficers] = React.useState(DEFAULT_OFFICERS);
      const [searchQuery, setSearchQuery] = React.useState("");
      const [selectedRak, setSelectedRak] = React.useState("ALL");
      const [statusFilter, setStatusFilter] = React.useState("ALL"); // ALL, Belum Revisi, Sudah Revisi
      
      const [isLoading, setIsLoading] = React.useState(false);
      const [activeModalItem, setActiveModalItem] = React.useState(null);
      const [showSettingsModal, setShowSettingsModal] = React.useState(false);
      const [showScriptModal, setShowScriptModal] = React.useState(false);
      const [appsScriptUrl, setAppsScriptUrl] = React.useState(DEFAULT_APPS_SCRIPT_URL);
      const [toastMsg, setToastMsg] = React.useState("");

      // Form state modal revisi
      const [selectedTeam, setSelectedTeam] = React.useState("TIM 1");
      const [selectedOfficer, setSelectedOfficer] = React.useState("");
      const [qtyInput, setQtyInput] = React.useState("");
      const [notesInput, setNotesInput] = React.useState("");

      // Refresh icons on state change
      React.useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [items, activeModalItem, showSettingsModal, showScriptModal, toastMsg, statusFilter, selectedRak]);

      const triggerToast = React.useCallback((msg) => {
        setToastMsg(msg);
        setTimeout(() => {
          setToastMsg("");
        }, 3000);
      }, []);

      const fetchFromGoogleSheet = async () => {
        setIsLoading(true);
        try {
          let fetchedData = null;
          if (appsScriptUrl) {
            try {
              const response = await fetch(`${appsScriptUrl}?action=getData`);
              if (response.ok) {
                const result = await response.json();
                if (result && result.items) {
                  fetchedData = result.items;
                  if (result.officers) setOfficers(result.officers);
                }
              }
            } catch (err) {
              console.warn("Apps Script GET endpoint offline or CORS restricted, trying public CSV endpoint...", err);
            }
          }

          if (!fetchedData) {
            const csvUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID_REVISI_SO}`;
            const response = await fetch(csvUrl);
            if (response.ok) {
              const csvText = await response.text();
              const parsed = parseCSV(csvText);
              if (parsed && parsed.length > 0) {
                setItems(parsed);
                triggerToast("🔄 Data berhasil di-load dari Google Sheets!");
                setIsLoading(false);
                return;
              }
            }
          } else {
            setItems(fetchedData);
            triggerToast("🔄 Data berhasil diperbarui dari Apps Script!");
            setIsLoading(false);
            return;
          }

          triggerToast("⚡ Menggunakan data lokal (Koneksi offline)");
        } catch (error) {
          console.error("Error fetching sheet:", error);
          triggerToast("⚠️ Menggunakan data lokal.");
        } finally {
          setIsLoading(false);
        }
      };

      const handleTeamChange = (team) => {
        setSelectedTeam(team);
        const teamOfficers = officers[team] || [];
        if (teamOfficers.length > 0) {
          setSelectedOfficer(teamOfficers[0]);
        } else {
          setSelectedOfficer("");
        }
      };

      const openRevisionModal = (item) => {
        setActiveModalItem(item);
        const team = item.timRevisi || "TIM 1";
        setSelectedTeam(team);

        let defaultOfficer = item.petugas || "";
        if (defaultOfficer.includes("(")) {
          defaultOfficer = defaultOfficer.split("(")[0].trim();
        }

        const teamOfficers = officers[team] || [];
        if (teamOfficers.includes(defaultOfficer)) {
          setSelectedOfficer(defaultOfficer);
        } else {
          setSelectedOfficer(teamOfficers[0] || "");
        }

        setQtyInput(item.qtyRevisi !== null && item.qtyRevisi !== undefined ? String(item.qtyRevisi) : String(item.tim1 !== undefined ? item.tim1 : 0));
        setNotesInput(item.catatan || "");
      };

      const saveRevision = async () => {
        if (!activeModalItem) return;
        
        if (!selectedOfficer) {
          triggerToast("⚠️ Silakan pilih nama petugas terlebih dahulu");
          return;
        }

        const parsedQty = parseInt(qtyInput);
        if (isNaN(parsedQty) || parsedQty < 0) {
          triggerToast("⚠️ Jumlah QTY Revisi tidak valid");
          return;
        }

        const updatedOfficerName = `${selectedOfficer} (${selectedTeam})`;

        const updatedItems = items.map(item => {
          if (item.id === activeModalItem.id) {
            return {
              ...item,
              qtyRevisi: parsedQty,
              petugas: updatedOfficerName,
              timRevisi: selectedTeam,
              status: "Sudah Revisi",
              catatan: notesInput
            };
          }
          return item;
        });

        setItems(updatedItems);

        // Kirim data revisi ke Google Apps Script Web App
        if (appsScriptUrl) {
          try {
            fetch(appsScriptUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                action: "updateRevision",
                kodeItem: activeModalItem.kodeItem,
                rak: activeModalItem.rak,
                qtyRevisi: parsedQty,
                petugas: updatedOfficerName,
                timRevisi: selectedTeam,
                status: "Sudah Revisi",
                catatan: notesInput
              })
            });
            triggerToast("💾 Tersimpan & ter-sync ke Google Sheets!");
          } catch (e) {
            console.error("Apps Script Sync Error:", e);
            triggerToast("⚠️ Tersimpan lokal (Gagal kirim ke Apps Script)");
          }
        } else {
          triggerToast("💾 Status diperbarui menjadi SUDAH REVISI");
        }

        setActiveModalItem(null);
      };

      const rakList = React.useMemo(() => {
        const raks = items.map(i => i.rak).filter(Boolean);
        return ["ALL", ...Array.from(new Set(raks)).sort()];
      }, [items]);

      const filteredItems = items.filter(item => {
        const matchesSearch = 
          item.namaItem.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.kodeItem.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.kodeOriginal.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.rak.toLowerCase().includes(searchQuery.toLowerCase());
        
        const matchesRak = selectedRak === "ALL" || item.rak === selectedRak;
        const matchesStatus = statusFilter === "ALL" || item.status === statusFilter;

        return matchesSearch && matchesRak && matchesStatus;
      });

      const totalItems = items.length;
      const sudahRevisiCount = items.filter(i => i.status === "Sudah Revisi").length;
      const belumRevisiCount = totalItems - sudahRevisiCount;

      const exportToCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "Petugas,Rak,Kode Item,Kode Original,Nama Item,Tim1,Tim2,Selisih,QTY Revisi,Status,Catatan\n";
        
        items.forEach(i => {
          const row = [
            `"${i.petugas || ''}"`,
            `"${i.rak || ''}"`,
            `"${i.kodeItem || ''}"`,
            `"${i.kodeOriginal || ''}"`,
            `"${i.namaItem || ''}"`,
            i.tim1,
            i.tim2,
            i.selisih,
            i.qtyRevisi !== null && i.qtyRevisi !== undefined ? i.qtyRevisi : "",
            `"${i.status || ''}"`,
            `"${i.catatan || ''}"`
          ].join(",");
          csvContent += row + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Revisi_SO_Updated_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        triggerToast("📥 File CSV berhasil diunduh");
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col shadow-xl relative pb-20">
          
          {/* Header Bar */}
          <header className="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-md">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-blue-500/30">
                  SO
                </div>
                <div>
                  <h1 className="font-bold text-base leading-tight">Revisi Stock Opname</h1>
                  <p className="text-xs text-slate-400">Tim 1 & Tim 2 Opname</p>
                </div>
              </div>
              <div className="flex items-center gap-1.5">
                <button 
                  onClick={fetchFromGoogleSheet}
                  disabled={isLoading}
                  className="p-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 rounded-lg transition-all border border-slate-700"
                  title="Reload dari Spreadsheet"
                >
                  <i data-lucide="refresh-cw" className={`w-4 h-4 ${isLoading ? 'animate-spin text-blue-400' : ''}`}></i>
                </button>
                <button 
                  onClick={() => setShowSettingsModal(true)}
                  className="p-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 rounded-lg transition-all border border-slate-700"
                  title="Pengaturan Integrasi"
                >
                  <i data-lucide="settings" className="w-4 h-4"></i>
                </button>
              </div>
            </div>

            {/* Quick Summary Cards */}
            <div className="grid grid-cols-3 gap-2 mt-4 pt-3 border-t border-slate-800">
              <div className="bg-slate-800/80 rounded-lg p-2 text-center border border-slate-700/50">
                <span className="text-[10px] uppercase tracking-wider text-slate-400 block font-medium">Total Item</span>
                <span className="text-lg font-bold text-white">{totalItems}</span>
              </div>
              <div className="bg-amber-950/40 rounded-lg p-2 text-center border border-amber-800/40">
                <span className="text-[10px] uppercase tracking-wider text-amber-400 block font-medium">Belum Revisi</span>
                <span className="text-lg font-bold text-amber-400">{belumRevisiCount}</span>
              </div>
              <div className="bg-emerald-950/40 rounded-lg p-2 text-center border border-emerald-800/40">
                <span className="text-[10px] uppercase tracking-wider text-emerald-400 block font-medium">Sudah Revisi</span>
                <span className="text-lg font-bold text-emerald-400">{sudahRevisiCount}</span>
              </div>
            </div>
          </header>

          {}
          <section className="p-3 bg-white border-b border-slate-200 sticky top-[125px] z-20 shadow-sm space-y-2.5">
            {/* Search Input */}
            <div className="relative">
              <i data-lucide="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
              <input 
                type="text"
                placeholder="Cari Rak, Nama, atau Kode Item..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
                className="w-full pl-9 pr-8 py-2 bg-slate-100 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 border border-slate-200 text-slate-800 placeholder-slate-400"
              />
              {searchQuery && (
                <button 
                  onClick={() => setSearchQuery("")}
                  className="absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"
                >
                  <i data-lucide="x" className="w-4 h-4"></i>
                </button>
              )}
            </div>

            {/* Filters Row */}
            <div className="flex items-center gap-2 overflow-x-auto custom-scrollbar pb-0.5">
              <div className="flex bg-slate-100 p-1 rounded-lg border border-slate-200 text-xs shrink-0">
                <button 
                  onClick={() => setStatusFilter("ALL")}
                  className={`px-2.5 py-1 rounded-md font-medium transition-all ${statusFilter === "ALL" ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}
                >
                  Semua ({totalItems})
                </button>
                <button 
                  onClick={() => setStatusFilter("Belum Revisi")}
                  className={`px-2.5 py-1 rounded-md font-medium transition-all ${statusFilter === "Belum Revisi" ? 'bg-amber-500 text-white shadow-sm' : 'text-slate-500'}`}
                >
                  Belum ({belumRevisiCount})
                </button>
                <button 
                  onClick={() => setStatusFilter("Sudah Revisi")}
                  className={`px-2.5 py-1 rounded-md font-medium transition-all ${statusFilter === "Sudah Revisi" ? 'bg-emerald-600 text-white shadow-sm' : 'text-slate-500'}`}
                >
                  Sudah ({sudahRevisiCount})
                </button>
              </div>

              {/* Rak Dropdown Selector */}
              <div className="relative shrink-0">
                <select 
                  value={selectedRak}
                  onChange={(e) => setSelectedRak(e.target.value)}
                  className="bg-slate-100 border border-slate-200 text-slate-700 text-xs font-semibold rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 pr-6 appearance-none cursor-pointer"
                >
                  <option value="ALL">📍 Semua Rak</option>
                  {rakList.filter(r => r !== "ALL").map(rak => (
                    <option key={rak} value={rak}>Rak {rak}</option>
                  ))}
                </select>
                <i data-lucide="chevron-down" className="w-3 h-3 absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
              </div>
            </div>
          </section>

          {}
          <main className="flex-1 p-3 space-y-3">
            {filteredItems.length === 0 ? (
              <div className="text-center py-12 px-4 bg-white rounded-2xl border border-dashed border-slate-300 my-4">
                <div className="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center mx-auto mb-3 text-slate-400">
                  <i data-lucide="package-search" className="w-6 h-6"></i>
                </div>
                <p className="text-slate-700 font-medium text-sm">Item Tidak Ditemukan</p>
                <p className="text-slate-400 text-xs mt-1">Coba sesuaikan kata kunci atau filter status Anda.</p>
              </div>
            ) : (
              filteredItems.map((item) => {
                const isRevised = item.status === "Sudah Revisi";
                const hasDifference = item.selisih !== 0;

                return (
                  <div 
                    key={item.id} 
                    className={`bg-white rounded-2xl border transition-all shadow-sm p-3.5 relative overflow-hidden ${
                      isRevised ? 'border-emerald-300 ring-1 ring-emerald-200/50' : 'border-slate-200 hover:border-slate-300'
                    }`}
                  >
                    {/* Top Tag & Rak Badge */}
                    <div className="flex items-center justify-between mb-2">
                      <div className="flex items-center gap-1.5">
                        <span className="px-2 py-0.5 rounded-md bg-slate-900 text-white font-mono text-[11px] font-bold tracking-wide">
                          📍 {item.rak}
                        </span>
                        <span className="text-[11px] text-slate-400 font-mono">
                          {item.kodeItem}
                        </span>
                      </div>

                      <span className={`px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider flex items-center gap-1 ${
                        isRevised 
                          ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' 
                          : 'bg-amber-100 text-amber-800 border border-amber-300'
                      }`}>
                        <i data-lucide={isRevised ? "check-circle-2" : "clock"} className="w-3 h-3"></i>
                        {item.status}
                      </span>
                    </div>

                    {/* Item Name */}
                    <h3 className="font-bold text-slate-900 text-sm leading-snug line-clamp-2">
                      {item.namaItem}
                    </h3>
                    <p className="text-[11px] text-slate-500 mt-0.5 font-mono">
                      Kode Orig: <span className="text-slate-700">{item.kodeOriginal}</span>
                    </p>

                    {/* Quantity Comparison Matrix */}
                    <div className="grid grid-cols-3 gap-1.5 bg-slate-50 p-2 rounded-xl border border-slate-100 mt-2 text-center">
                      <div className="bg-white p-1.5 rounded-lg border border-slate-200/60">
                        <span className="text-[10px] font-semibold text-slate-400 uppercase block">Tim 1</span>
                        <span className="text-sm font-bold text-slate-700">{item.tim1}</span>
                      </div>
                      <div className="bg-white p-1.5 rounded-lg border border-slate-200/60">
                        <span className="text-[10px] font-semibold text-slate-400 uppercase block">Tim 2</span>
                        <span className="text-sm font-bold text-slate-700">{item.tim2}</span>
                      </div>
                      <div className={`p-1.5 rounded-lg border ${
                        hasDifference ? 'bg-red-50 border-red-200 text-red-700' : 'bg-emerald-50 border-emerald-200 text-emerald-700'
                      }`}>
                        <span className="text-[10px] font-semibold uppercase block opacity-80">Selisih</span>
                        <span className="text-sm font-bold">
                          {item.selisih > 0 ? `+${item.selisih}` : item.selisih}
                        </span>
                      </div>
                    </div>

                    {/* Revised Info Bar */}
                    {isRevised && (
                      <div className="mt-2.5 pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
                        <div>
                          <span className="text-slate-400 text-[11px]">Petugas: </span>
                          <span className="font-semibold text-slate-800">{item.petugas || "-"}</span>
                        </div>
                        <div className="text-right">
                          <span className="text-slate-400 text-[11px]">QTY Revisi: </span>
                          <span className="font-extrabold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200 text-sm">
                            {item.qtyRevisi}
                          </span>
                        </div>
                      </div>
                    )}

                    {/* Notes */}
                    {item.catatan && (
                      <p className="mt-2 text-[11px] text-slate-500 italic bg-amber-50/60 p-1.5 rounded border border-amber-100">
                        💬 "{item.catatan}"
                      </p>
                    )}

                    {/* Revision Action Button */}
                    <button 
                      onClick={() => openRevisionModal(item)}
                      className={`w-full mt-3 py-2.5 px-4 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 active:scale-[0.98] shadow-sm ${
                        isRevised 
                          ? 'bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-300' 
                          : 'bg-blue-600 hover:bg-blue-700 text-white shadow-blue-500/20'
                      }`}
                    >
                      <i data-lucide={isRevised ? "edit-3" : "edit-2"} className="w-4 h-4"></i>
                      {isRevised ? "Edit Hasil Revisi" : "Input QTY Revisi SO"}
                    </button>
                  </div>
                );
              })
            )}
          </main>

          {}
          {activeModalItem && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
              <div className="bg-white w-full max-w-md rounded-t-3xl sm:rounded-2xl p-5 shadow-2xl modal-animate max-h-[90vh] overflow-y-auto">
                
                {/* Modal Header */}
                <div className="flex items-start justify-between border-b border-slate-100 pb-3">
                  <div>
                    <span className="px-2 py-0.5 bg-blue-100 text-blue-800 rounded font-mono text-[10px] font-bold">
                      Rak {activeModalItem.rak} • {activeModalItem.kodeItem}
                    </span>
                    <h2 className="font-bold text-slate-900 text-base mt-1 line-clamp-1">
                      {activeModalItem.namaItem}
                    </h2>
                  </div>
                  <button 
                    onClick={() => setActiveModalItem(null)}
                    className="p-1.5 rounded-full hover:bg-slate-100 text-slate-400 hover:text-slate-600 transition-colors"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                {/* Info Summary Matrix in Modal */}
                <div className="grid grid-cols-3 gap-2 my-3 text-center text-xs">
                  <div className="bg-slate-50 p-2 rounded-xl border border-slate-200">
                    <span className="text-slate-400 block text-[10px]">TIM 1</span>
                    <span className="font-bold text-slate-800 text-sm">{activeModalItem.tim1}</span>
                  </div>
                  <div className="bg-slate-50 p-2 rounded-xl border border-slate-200">
                    <span className="text-slate-400 block text-[10px]">TIM 2</span>
                    <span className="font-bold text-slate-800 text-sm">{activeModalItem.tim2}</span>
                  </div>
                  <div className="bg-red-50 p-2 rounded-xl border border-red-200 text-red-700">
                    <span className="text-red-400 block text-[10px]">SELISIH</span>
                    <span className="font-bold text-sm">{activeModalItem.selisih}</span>
                  </div>
                </div>

                {/* Form Fields */}
                <div className="space-y-4 my-4">
                  
                  {/* 1. Pilih Tim Pelaksana */}
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1.5">
                      1. Tim Pelaksana Revisi:
                    </label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => handleTeamChange("TIM 1")}
                        className={`py-2 px-3 rounded-xl text-xs font-bold border transition-all flex items-center justify-center gap-1.5 ${
                          selectedTeam === "TIM 1" 
                            ? 'bg-blue-50 border-blue-600 text-blue-700 ring-2 ring-blue-500/20' 
                            : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                        }`}
                      >
                        <i data-lucide="users" className="w-3.5 h-3.5"></i>
                        TIM 1
                      </button>
                      <button
                        type="button"
                        onClick={() => handleTeamChange("TIM 2")}
                        className={`py-2 px-3 rounded-xl text-xs font-bold border transition-all flex items-center justify-center gap-1.5 ${
                          selectedTeam === "TIM 2" 
                            ? 'bg-blue-50 border-blue-600 text-blue-700 ring-2 ring-blue-500/20' 
                            : 'bg-white border-slate-200 text-slate-600 hover:bg-slate-50'
                        }`}
                      >
                        <i data-lucide="users" className="w-3.5 h-3.5"></i>
                        TIM 2
                      </button>
                    </div>
                  </div>

                  {/* 2. Pilih Nama Petugas */}
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1.5">
                      2. Nama Petugas ({selectedTeam}):
                    </label>
                    <div className="relative">
                      <select
                        value={selectedOfficer}
                        onChange={(e) => setSelectedOfficer(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-300 text-slate-800 text-xs sm:text-sm rounded-xl p-2.5 pr-8 focus:outline-none focus:ring-2 focus:ring-blue-500 font-medium appearance-none"
                      >
                        {(officers[selectedTeam] || []).map((officer, idx) => (
                          <option key={idx} value={officer}>{officer}</option>
                        ))}
                      </select>
                      <i data-lucide="chevron-down" className="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                    </div>
                  </div>

                  {/* 3. Input QTY Revisi Final */}
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1.5">
                      3. QTY Hasil Revisi Fix:
                    </label>
                    <div className="flex items-center gap-2">
                      <button 
                        type="button"
                        onClick={() => setQtyInput(prev => Math.max(0, (parseInt(prev) || 0) - 1).toString())}
                        className="w-10 h-10 rounded-xl bg-slate-100 border border-slate-300 flex items-center justify-center text-slate-700 font-bold active:scale-95 text-lg"
                      >
                        -
                      </button>
                      <input 
                        type="number"
                        min="0"
                        value={qtyInput}
                        onChange={(e) => setQtyInput(e.target.value)}
                        className="flex-1 bg-white border-2 border-blue-600 rounded-xl py-2 px-3 text-center text-xl font-black text-blue-900 focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="0"
                      />
                      <button 
                        type="button"
                        onClick={() => setQtyInput(prev => ((parseInt(prev) || 0) + 1).toString())}
                        className="w-10 h-10 rounded-xl bg-slate-100 border border-slate-300 flex items-center justify-center text-slate-700 font-bold active:scale-95 text-lg"
                      >
                        +
                      </button>
                    </div>

                    {/* Quick Step Buttons */}
                    <div className="flex gap-1.5 mt-2">
                      <button 
                        type="button"
                        onClick={() => setQtyInput(activeModalItem.tim1.toString())}
                        className="flex-1 py-1 text-[11px] bg-slate-100 hover:bg-slate-200 border border-slate-200 rounded-lg font-medium text-slate-600"
                      >
                        Ikut Tim1 ({activeModalItem.tim1})
                      </button>
                      <button 
                        type="button"
                        onClick={() => setQtyInput(activeModalItem.tim2.toString())}
                        className="flex-1 py-1 text-[11px] bg-slate-100 hover:bg-slate-200 border border-slate-200 rounded-lg font-medium text-slate-600"
                      >
                        Ikut Tim2 ({activeModalItem.tim2})
                      </button>
                    </div>
                  </div>

                  {/* Catatan / Alasan Revisi */}
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      4. Catatan / Alasan Revisi (Opsional):
                    </label>
                    <textarea 
                      rows="2"
                      value={notesInput}
                      onChange={(e) => setNotesInput(e.target.value)}
                      placeholder="Contoh: Rusak 1, Barang terselip di Rak C..."
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800"
                    ></textarea>
                  </div>

                </div>

                {/* Submit Action */}
                <div className="flex gap-2 pt-2">
                  <button 
                    type="button"
                    onClick={() => setActiveModalItem(null)}
                    className="flex-1 py-3 border border-slate-300 text-slate-700 rounded-xl font-bold text-xs hover:bg-slate-50 active:scale-95 transition-all"
                  >
                    Batal
                  </button>
                  <button 
                    type="button"
                    onClick={saveRevision}
                    className="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold text-xs shadow-lg shadow-emerald-600/30 active:scale-95 transition-all flex items-center justify-center gap-1.5"
                  >
                    <i data-lucide="check" className="w-4 h-4"></i>
                    Simpan Revisi
                  </button>
                </div>

              </div>
            </div>
          )}

          {}
          {showSettingsModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl modal-animate space-y-4 max-h-[85vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-slate-900 text-base flex items-center gap-2">
                    <i data-lucide="settings" className="w-5 h-5 text-blue-600"></i>
                    Pengaturan Integrasi
                  </h3>
                  <button 
                    onClick={() => setShowSettingsModal(false)}
                    className="p-1 rounded-full text-slate-400 hover:text-slate-600"
                  >
                    <i data-lucide="x" className="w-5 h-5"></i>
                  </button>
                </div>

                {/* Connected Sheet Info */}
                <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs space-y-1">
                  <span className="font-bold text-slate-700 block">Link Spreadsheet Terhubung:</span>
                  <a 
                    href={`https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/edit#gid=${GID_REVISI_SO}`} 
                    target="_blank" 
                    rel="noreferrer"
                    className="text-blue-600 font-mono underline break-all block text-[11px]"
                  >
                    ID: {SPREADSHEET_ID}
                  </a>
                </div>

                {/* Apps Script Web App Endpoint */}
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">
                    Google Apps Script Web App URL:
                  </label>
                  <input 
                    type="url"
                    value={appsScriptUrl}
                    onChange={(e) => setAppsScriptUrl(e.target.value)}
                    placeholder="https://script.google.com/macros/s/.../exec"
                    className="w-full bg-slate-50 border border-slate-300 rounded-xl p-2.5 text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono"
                  />
                  <p className="text-[10px] text-slate-400 mt-1">
                    URL tempat posting data revisi otomatis ke Google Sheets.
                  </p>
                  <button 
                    onClick={() => setShowScriptModal(true)}
                    className="mt-1.5 text-xs text-blue-600 font-bold hover:underline flex items-center gap-1"
                  >
                    <i data-lucide="code" className="w-3.5 h-3.5"></i>
                    Lihat Kode Google Apps Script & Cara Pasang
                  </button>
                </div>

                {/* Offline Export Backup */}
                <div className="pt-2 border-t border-slate-100">
                  <label className="block text-xs font-bold text-slate-700 mb-2">
                    Backup / Unduh Data Terbaru:
                  </label>
                  <button 
                    onClick={exportToCSV}
                    className="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2"
                  >
                    <i data-lucide="download" className="w-4 h-4"></i>
                    Export Data Revisi ke File CSV / Excel
                  </button>
                </div>

                <div className="pt-2">
                  <button 
                    onClick={() => setShowSettingsModal(false)}
                    className="w-full py-2.5 bg-blue-600 text-white rounded-xl font-bold text-xs"
                  >
                    Tutup Pengaturan
                  </button>
                </div>
              </div>
            </div>
          )}

          {}
          {showScriptModal && (
            <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl modal-animate space-y-3 max-h-[85vh] overflow-y-auto text-xs">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="font-bold text-slate-900 text-sm">Panduan Google Apps Script</h3>
                  <button onClick={() => setShowScriptModal(false)}><i data-lucide="x" className="w-4 h-4"></i></button>
                </div>
                <p className="text-slate-600">
                  Agar revisi yang diinput dari HP otomatis tersimpan ke file Google Sheets Anda:
                </p>
                <ol className="list-decimal pl-4 space-y-1 text-slate-600">
                  <li>Buka Google Sheets Anda.</li>
                  <li>Klik menu <b>Ekstensi</b> &gt; <b>Apps Script</b>.</li>
                  <li>Tempelkan kode JS berikut di editor script lalu simpan.</li>
                  <li>Klik <b>Deploy</b> &gt; <b>New Deployment</b> &gt; Pilih tipe <b>Web App</b>.</li>
                  <li>Set <i>Who has access</i> menjadi <b>Anyone</b>.</li>
                  <li>Copy Web App URL & paste di menu Pengaturan aplikasi ini.</li>
                </ol>
                <pre className="bg-slate-900 text-emerald-400 p-3 rounded-xl overflow-x-auto text-[10px] font-mono select-all">
{`function doPost(e) {
  var data = JSON.parse(e.postData.contents);
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName("Revisi SO");
  var values = sheet.getDataRange().getValues();
  
  for (var i = 1; i < values.length; i++) {
    if (values[i][2] == data.kodeItem) { // Col C: Kode Item
      sheet.getRange(i + 1, 1).setValue(data.petugas);   // Col A: Petugas
      sheet.getRange(i + 1, 9).setValue(data.qtyRevisi); // Col I: QTY Revisi
      break;
    }
  }
  return ContentService.createTextOutput("Success");
}`}
                </pre>
                <button 
                  onClick={() => setShowScriptModal(false)}
                  className="w-full py-2 bg-slate-800 text-white rounded-xl font-bold mt-2"
                >
                  Tutup Panduan
                </button>
              </div>
            </div>
          )}

          {}
          {toastMsg && (
            <div className="fixed bottom-16 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-xs px-4 py-2.5 rounded-full shadow-xl backdrop-blur-md z-50 flex items-center gap-2 border border-slate-700 font-medium animate-bounce">
              <span>{toastMsg}</span>
            </div>
          )}

          {/* Bottom App Nav */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 p-2 flex items-center justify-around z-30 shadow-lg">
            <button 
              onClick={() => setStatusFilter("ALL")}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${statusFilter === 'ALL' ? 'text-blue-600' : 'text-slate-400'}`}
            >
              <i data-lucide="layout-grid" className="w-5 h-5"></i>
              Semua
            </button>
            <button 
              onClick={() => setStatusFilter("Belum Revisi")}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${statusFilter === 'Belum Revisi' ? 'text-amber-600' : 'text-slate-400'}`}
            >
              <i data-lucide="alert-circle" className="w-5 h-5"></i>
              Belum ({belumRevisiCount})
            </button>
            <button 
              onClick={() => setStatusFilter("Sudah Revisi")}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${statusFilter === 'Sudah Revisi' ? 'text-emerald-600' : 'text-slate-400'}`}
            >
              <i data-lucide="check-circle" className="w-5 h-5"></i>
              Sudah ({sudahRevisiCount})
            </button>
            <button 
              onClick={exportToCSV}
              className="flex flex-col items-center gap-0.5 text-[10px] font-bold text-slate-400 hover:text-slate-700"
            >
              <i data-lucide="download" className="w-5 h-5"></i>
              Export
            </button>
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

  </script>
</body>
</html>
