<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Revisi SO Mobile</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Styles for Mobile App UI -->
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .custom-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .modal-animate {
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const SPREADSHEET_ID = "10I100dl5URh59Y7hiwxBfW8cyWPBE1R0wDY75Q5XcqA";
    const GID_REVISI_SO = "1723800282";
    const DEFAULT_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxk8sBWXYGZghCvlGMkzsmP4uf8LWOaL6e9tkyBg1m237nKlHS0qjKK-4QO2q1Ewxxq/exec";

    // Sample data penyesuaian awal sesuai Sheet Revisi SO
    const INITIAL_ITEMS = [
      { id: 1, petugasAwal: "Wildan", rak: "RAK-1", kodeItem: "10401019", kodeOriginal: "8992771010024", namaItem: "PIGEON UV PROTECT REF+PUFF", tim1: 15, tim2: 12, selisih: 3, qtyRevisi: null, petugasRevisi: "", timRevisi: "", status: "Belum Revisi", catatan: "" },
      { id: 2, petugasAwal: "Andi", rak: "RAK-1", kodeItem: "10401020", kodeOriginal: "8992771010055", namaItem: "PIGEON BABY POWDER 100G", tim1: 50, tim2: 50, selisih: 0, qtyRevisi: 50, petugasRevisi: "Rillo (TIM 2)", timRevisi: "TIM 2", status: "Sudah Revisi", catatan: "Akurat" },
      { id: 3, petugasAwal: "Siti", rak: "RAK-2", kodeItem: "10401021", kodeOriginal: "8992771010112", namaItem: "SENSODYNE REPAIR & PROTECT 100G", tim1: 20, tim2: 18, selisih: 2, qtyRevisi: null, petugasRevisi: "", timRevisi: "", status: "Belum Revisi", catatan: "" },
      { id: 4, petugasAwal: "Rian", rak: "RAK-2", kodeItem: "10401022", kodeOriginal: "8992771010150", namaItem: "PEPSODENT ACTION 123 190G", tim1: 30, tim2: 35, selisih: -5, qtyRevisi: null, petugasRevisi: "", timRevisi: "", status: "Belum Revisi", catatan: "" },
      { id: 5, petugasAwal: "Eko", rak: "RAK-3", kodeItem: "10401023", kodeOriginal: "8992771010200", namaItem: "LIFEBUOY SABUN CAIR REFILL 450ML", tim1: 100, tim2: 95, selisih: 5, qtyRevisi: 98, petugasRevisi: "Siti Aminah (TIM 2)", timRevisi: "TIM 2", status: "Sudah Revisi", catatan: "2 kemasan bocor" }
    ];

    const DEFAULT_OFFICERS = {
      "TIM 1": ["Budi Santoso", "Andi Wijaya", "Agus Pratama", "Rian Hidayat", "Dedi Kurniawan", "Wildan"],
      "TIM 2": ["Eko Susilo", "Siti Aminah", "Hendra Saputra", "Maya Indah", "Rudi Hermawan", "Rillo"],
      "TIM1": ["Budi Santoso", "Andi Wijaya", "Agus Pratama", "Rian Hidayat", "Dedi Kurniawan", "Wildan"],
      "TIM2": ["Eko Susilo", "Siti Aminah", "Hendra Saputra", "Maya Indah", "Rudi Hermawan", "Rillo"]
    };

    const parseOfficersCSV = (csvText) => {
      const lines = csvText.split(/\r?\n/).filter(line => line.trim().length > 0);
      if (lines.length < 1) return DEFAULT_OFFICERS;

      const parseLine = (line) => {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') {
            if (inQuotes && line[i+1] === '"') { cur += '"'; i++; }
            else { inQuotes = !inQuotes; }
          } else if (c === ',' && !inQuotes) {
            result.push(cur.trim());
            cur = '';
          } else {
            cur += c;
          }
        }
        result.push(cur.trim());
        return result;
      };

      const rows = lines.map(l => parseLine(l).map(c => c.replace(/^"|"$/g, '')));
      if (rows.length === 0) return DEFAULT_OFFICERS;

      const tim1List = [];
      const tim2List = [];

      const header0 = (rows[0][0] || '').toUpperCase();
      const header1 = (rows[0][1] || '').toUpperCase();

      let startRow = 0;
      if (header0.includes("TIM") || header0.includes("PETUGAS") || header1.includes("TIM")) {
        startRow = 1;
      }

      for (let i = startRow; i < rows.length; i++) {
        const col0 = rows[i][0] ? rows[i][0].trim() : '';
        const col1 = rows[i][1] ? rows[i][1].trim() : '';

        if (col0) tim1List.push(col0);
        if (col1) tim2List.push(col1);
      }

      const resTim1 = tim1List.length > 0 ? tim1List : DEFAULT_OFFICERS["TIM 1"];
      const resTim2 = tim2List.length > 0 ? tim2List : DEFAULT_OFFICERS["TIM 2"];

      return {
        "TIM 1": resTim1,
        "TIM 2": resTim2,
        "TIM1": resTim1,
        "TIM2": resTim2
      };
    };

    const parseCSV = (csvText) => {
      const lines = csvText.split(/\r?\n/).filter(line => line.trim().length > 0);
      if (lines.length < 2) return [];

      const parseLine = (line) => {
        const result = [];
        let cur = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const c = line[i];
          if (c === '"') {
            if (inQuotes && line[i+1] === '"') { cur += '"'; i++; }
            else { inQuotes = !inQuotes; }
          } else if (c === ',' && !inQuotes) {
            result.push(cur.trim());
            cur = '';
          } else {
            cur += c;
          }
        }
        result.push(cur.trim());
        return result;
      };

      const parseNum = (val) => {
        if (val === undefined || val === null || val === '') return 0;
        const cleaned = val.toString().replace(/,/g, '').trim();
        const num = parseInt(cleaned, 10);
        return isNaN(num) ? 0 : num;
      };

      const parsedItems = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = parseLine(lines[i]).map(c => c.replace(/^"|"$/g, ''));
        if (cols.length < 3) continue;
        
        // Pemetaan persis sesuai Kolom Spreadsheet:
        // Col A (0): petugas
        // Col B (1): Rak
        // Col C (2): kode item
        // Col D (3): kode original
        // Col E (4): nama item
        // Col F (5): Tim1
        // Col G (6): Tim2
        // Col H (7): Selisih
        // Col I (8): QTY Revisi
        // Col J (9): Petugas Revisi
        // Col K (10): Status Revisi
        const petugasAwal = cols[0] || "";
        const rak = cols[1] || "";
        const kodeItem = cols[2] || "";
        const kodeOriginal = cols[3] || "";
        const namaItem = cols[4] || "";
        const tim1 = parseNum(cols[5]);
        const tim2 = parseNum(cols[6]);
        const selisih = cols[7] !== undefined && cols[7] !== "" ? parseNum(cols[7]) : (tim1 - tim2);
        
        const rawQtyRev = cols[8] !== undefined ? cols[8].trim() : "";
        const qtyRevisiVal = rawQtyRev !== "" && !isNaN(parseInt(rawQtyRev, 10)) ? parseInt(rawQtyRev, 10) : null;
        
        const petugasRevisi = cols[9] || "";
        const rawStatus = cols[10] || "";
        const statusRevisi = rawStatus.trim() !== "" ? rawStatus.trim() : (qtyRevisiVal !== null ? "Sudah Revisi" : "Belum Revisi");

        parsedItems.push({
          id: i,
          petugasAwal,
          rak,
          kodeItem,
          kodeOriginal,
          namaItem,
          tim1,
          tim2,
          selisih,
          qtyRevisi: qtyRevisiVal,
          petugasRevisi,
          timRevisi: petugasRevisi.includes("TIM 2") ? "TIM 2" : (petugasRevisi.includes("TIM 1") ? "TIM 1" : ""),
          status: statusRevisi,
          catatan: ""
        });
      }
      return parsedItems;
    };

    function App() {
      const [items, setItems] = React.useState(INITIAL_ITEMS);
      const [officers, setOfficers] = React.useState(DEFAULT_OFFICERS);
      const [searchQuery, setSearchQuery] = React.useState("");
      const [selectedRak, setSelectedRak] = React.useState("ALL");
      const [statusFilter, setStatusFilter] = React.useState("ALL");
      
      const [isLoading, setIsLoading] = React.useState(false);
      const [activeModalItem, setActiveModalItem] = React.useState(null);
      const [showSettingsModal, setShowSettingsModal] = React.useState(false);
      const [showScriptModal, setShowScriptModal] = React.useState(false);
      const [appsScriptUrl, setAppsScriptUrl] = React.useState(DEFAULT_APPS_SCRIPT_URL);
      const [toastMsg, setToastMsg] = React.useState("");

      // State Kunci Sesi Petugas
      const [sessionOfficer, setSessionOfficer] = React.useState(() => {
        try {
          const saved = localStorage.getItem("so_session_officer");
          return saved ? JSON.parse(saved) : null;
        } catch (e) {
          return null;
        }
      });

      const [showSessionModal, setShowSessionModal] = React.useState(() => {
        try {
          return !localStorage.getItem("so_session_officer");
        } catch (e) {
          return true;
        }
      });

      const [tempSessionTeam, setTempSessionTeam] = React.useState("TIM 1");
      const [tempSessionOfficer, setTempSessionOfficer] = React.useState("");

      // Form state modal revisi
      const [selectedTeam, setSelectedTeam] = React.useState("TIM 1");
      const [selectedOfficer, setSelectedOfficer] = React.useState("");
      const [isCustomOfficer, setIsCustomOfficer] = React.useState(false);
      const [customOfficerInput, setCustomOfficerInput] = React.useState("");
      const [qtyInput, setQtyInput] = React.useState("");
      const [notesInput, setNotesInput] = React.useState("");

      const fetchFromGoogleSheet = async () => {
        setIsLoading(true);
        try {
          // 1. Fetch data dari Sheet Revisi SO
          const csvUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID_REVISI_SO}`;
          const response = await fetch(csvUrl);
          if (!response.ok) throw new Error("Gagal mengambil data Revisi SO");
          const csvText = await response.text();
          const parsedData = parseCSV(csvText);

          // 2. Fetch data Petugas dari Sheet "Petugas"
          try {
            const officersUrl = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&sheet=Petugas`;
            const offRes = await fetch(officersUrl);
            if (offRes.ok) {
              const offCsvText = await offRes.text();
              const parsedOfficers = parseOfficersCSV(offCsvText);
              if (parsedOfficers) {
                setOfficers(parsedOfficers);
              }
            }
          } catch (offErr) {
            console.warn("Gagal membaca sheet Petugas, menggunakan daftar default:", offErr);
          }

          if (parsedData && parsedData.length > 0) {
            setItems(parsedData);
            triggerToast("✅ Data & Daftar Petugas berhasil dimuat!");
          } else {
            triggerToast("⚠️ Data dari Spreadsheet kosong");
          }
        } catch (err) {
          console.error("Fetch Sheet Error:", err);
          triggerToast("⚠️ Gagal memuat Spreadsheet. Menggunakan data lokal.");
        } finally {
          setIsLoading(false);
        }
      };

      // Otomatis fetch dari spreadsheet saat aplikasi pertama kali dibuka
      React.useEffect(() => {
        fetchFromGoogleSheet();
      }, []);

      React.useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [items, activeModalItem, showSettingsModal, showScriptModal, showSessionModal, toastMsg, statusFilter, selectedRak, officers]);

      // Reset / set default officer saat modal kunci sesi terbuka
      React.useEffect(() => {
        if (showSessionModal) {
          if (sessionOfficer) {
            setTempSessionTeam(sessionOfficer.team || "TIM 1");
            setTempSessionOfficer(sessionOfficer.name || "");
          } else {
            setTempSessionTeam("TIM 1");
            setTempSessionOfficer(""); // Default KOSONG
          }
        }
      }, [showSessionModal]);

      const triggerToast = React.useCallback((msg) => {
        setToastMsg(msg);
        setTimeout(() => {
          setToastMsg("");
        }, 3000);
      }, []);

      const handleSaveSession = (team, officerName) => {
        if (!team) {
          triggerToast("⚠️ Silakan pilih Tim terlebih dahulu!");
          return;
        }
        if (!officerName || officerName.trim() === "") {
          triggerToast("⚠️ Silakan pilih Nama Petugas!");
          return;
        }
        const sessionData = { name: officerName, team };
        setSessionOfficer(sessionData);
        try {
          localStorage.setItem("so_session_officer", JSON.stringify(sessionData));
        } catch (e) {
          console.warn("Gagal simpan session ke localStorage", e);
        }
        setShowSessionModal(false);
        triggerToast(`🔒 Sesi dikunci: ${officerName} (${team})`);
      };

      const handleTempTeamChange = (team) => {
        setTempSessionTeam(team);
        setTempSessionOfficer(""); // Kosongkan nama petugas saat ganti tim
      };

      const handleTeamChange = (team) => {
        setSelectedTeam(team);
        if (sessionOfficer && sessionOfficer.team === team) {
          setSelectedOfficer(sessionOfficer.name);
          setCustomOfficerInput(sessionOfficer.name);
        } else {
          const teamOfficers = officers[team] || officers[team.replace(" ", "")] || [];
          const firstOfficer = teamOfficers[0] || "";
          setSelectedOfficer(firstOfficer);
          setCustomOfficerInput(firstOfficer);
        }
        setIsCustomOfficer(false);
      };

      const openRevisionModal = (item) => {
        if (!sessionOfficer) {
          setShowSessionModal(true);
          triggerToast("⚠️ Kunci sesi nama petugas Anda terlebih dahulu!");
          return;
        }

        setActiveModalItem(item);

        // Selalu kunci Tim & Petugas sesuai Sesi Terkunci
        setSelectedTeam(sessionOfficer.team);
        setSelectedOfficer(sessionOfficer.name);
        setCustomOfficerInput(sessionOfficer.name);
        setIsCustomOfficer(false);

        setQtyInput(item.qtyRevisi !== null && item.qtyRevisi !== undefined ? String(item.qtyRevisi) : String(item.tim1 !== undefined ? item.tim1 : 0));
        setNotesInput(item.catatan || "");
      };

      const saveRevision = async () => {
        if (!activeModalItem) return;
        
        const finalOfficer = isCustomOfficer ? customOfficerInput.trim() : selectedOfficer;
        if (!finalOfficer) {
          triggerToast("⚠️ Pilih atau ketik nama petugas revisi");
          return;
        }

        const parsedQty = parseInt(qtyInput);
        if (isNaN(parsedQty) || parsedQty < 0) {
          triggerToast("⚠️ Jumlah QTY Revisi tidak valid");
          return;
        }

        const updatedOfficerName = `${finalOfficer} (${selectedTeam})`;

        const updatedItems = items.map(item => {
          if (item.id === activeModalItem.id) {
            return {
              ...item,
              qtyRevisi: parsedQty,
              petugasRevisi: updatedOfficerName,
              timRevisi: selectedTeam,
              status: "Sudah Revisi",
              catatan: notesInput
            };
          }
          return item;
        });

        setItems(updatedItems);

        if (appsScriptUrl) {
          try {
            fetch(appsScriptUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                action: "updateRevision",
                kodeItem: activeModalItem.kodeItem,
                rak: activeModalItem.rak,
                qtyRevisi: parsedQty,
                petugasRevisi: updatedOfficerName,
                statusRevisi: "Sudah Revisi",
                catatan: notesInput
              })
            });
            triggerToast("💾 Ter-sync ke Google Sheets (Kolom I, J, & K)!");
          } catch (e) {
            console.error("Apps Script Sync Error:", e);
            triggerToast("⚠️ Tersimpan lokal (Gagal sync Apps Script)");
          }
        } else {
          triggerToast("💾 Status diperbarui ke SUDAH REVISI");
        }

        setActiveModalItem(null);
      };

      const rakList = React.useMemo(() => {
        const raks = items.map(i => i.rak).filter(Boolean);
        return ["ALL", ...Array.from(new Set(raks)).sort()];
      }, [items]);

      const filteredItems = items.filter(item => {
        const matchesSearch = 
          item.namaItem.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.kodeItem.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.kodeOriginal.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.rak.toLowerCase().includes(searchQuery.toLowerCase());
        
        const matchesRak = selectedRak === "ALL" || item.rak === selectedRak;
        const matchesStatus = statusFilter === "ALL" || item.status === statusFilter;

        return matchesSearch && matchesRak && matchesStatus;
      });

      const totalItems = items.length;
      const sudahRevisiCount = items.filter(i => i.status === "Sudah Revisi").length;
      const belumRevisiCount = totalItems - sudahRevisiCount;

      const exportToCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "petugas,Rak,kode item,kode original,nama item,Tim1,Tim2,Selisih,QTY Revisi,Petugas Revisi,Status Revisi,Catatan\n";
        
        items.forEach(i => {
          const row = [
            `"${i.petugasAwal || ''}"`,
            `"${i.rak || ''}"`,
            `"${i.kodeItem || ''}"`,
            `"${i.kodeOriginal || ''}"`,
            `"${i.namaItem || ''}"`,
            i.tim1,
            i.tim2,
            i.selisih,
            i.qtyRevisi !== null && i.qtyRevisi !== undefined ? i.qtyRevisi : "",
            `"${i.petugasRevisi || ''}"`,
            `"${i.status || ''}"`,
            `"${i.catatan || ''}"`
          ].join(",");
          csvContent += row + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Revisi_SO_Updated_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        triggerToast("📥 Unduh CSV Berhasil");
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col shadow-xl relative pb-20">
          
          {}
          <header className="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-md">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-red-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-red-500/30">
                  SO
                </div>
                <div>
                  <h1 className="font-bold text-base leading-tight">Revisi Stock Opname</h1>
                  <p className="text-xs text-slate-400">Tim 1 & Tim 2 Opname</p>
                </div>
              </div>
              <div className="flex items-center gap-1.5">
                <button 
                  onClick={fetchFromGoogleSheet}
                  disabled={isLoading}
                  className="p-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 rounded-lg transition-all border border-slate-700"
                  title="Reload dari Spreadsheet"
                >
                  <i data-lucide="refresh-cw" className={`w-4 h-4 ${isLoading ? 'animate-spin text-blue-400' : ''}`}></i>
                </button>
                <button 
                  onClick={() => setShowSettingsModal(true)}
                  className="p-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 rounded-lg transition-all border border-slate-700"
                  title="Pengaturan Integrasi"
                >
                  <i data-lucide="settings" className="w-4 h-4"></i>
                </button>
              </div>
            </div>

            {/* Active Session Lock Bar */}
            <div className="mt-3 pt-2.5 border-t border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span className="text-xs font-semibold text-slate-300">
                  Sesi Petugas:
                </span>
                {sessionOfficer ? (
                  <span className="text-xs font-bold text-emerald-400 bg-emerald-950/80 px-2.5 py-0.5 rounded-full border border-emerald-800/60">
                    👤 {sessionOfficer.name} ({sessionOfficer.team})
                  </span>
                ) : (
                  <span className="text-xs text-amber-400 bg-amber-950/60 px-2 py-0.5 rounded-full border border-amber-800/50">
                    ⚠️ Belum dikunci
                  </span>
                )}
              </div>
              <button 
                onClick={() => setShowSessionModal(true)}
                className="text-[11px] font-bold text-red-400 hover:text-red-300 bg-slate-800 hover:bg-slate-700 px-2 py-1 rounded-lg border border-slate-700 flex items-center gap-1 active:scale-95 transition-all"
              >
                <i data-lucide="user-check" className="w-3.5 h-3.5"></i>
                {sessionOfficer ? "Ganti" : "Kunci Sesi"}
              </button>
            </div>

            {/* Quick Summary Cards */}
            <div className="grid grid-cols-3 gap-2 mt-3 text-center">
              <div className="bg-slate-800/80 rounded-lg p-2 border border-slate-700/50">
                <span className="text-[10px] uppercase tracking-wider text-slate-400 block font-medium">Total Item</span>
                <span className="text-lg font-bold text-white">{totalItems}</span>
              </div>
              <div className="bg-amber-950/40 rounded-lg p-2 border border-amber-800/40">
                <span className="text-[10px] uppercase tracking-wider text-amber-400 block font-medium">Belum Revisi</span>
                <span className="text-lg font-bold text-amber-400">{belumRevisiCount}</span>
              </div>
              <div className="bg-emerald-950/40 rounded-lg p-2 border border-emerald-800/40">
                <span className="text-[10px] uppercase tracking-wider text-emerald-400 block font-medium">Sudah Revisi</span>
                <span className="text-lg font-bold text-emerald-400">{sudahRevisiCount}</span>
              </div>
            </div>
          </header>

          {}
          <section className="p-3 bg-white border-b border-slate-200 sticky top-[125px] z-20 shadow-sm space-y-2.5">
            <div className="relative">
              <i data-lucide="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
              <input 
                type="text"
                placeholder="Cari Rak, Nama, atau Kode Item..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}

      var kodeItem = String(values[i][2] || "").trim();
      
      var targetRak = String(data.rak || "").trim().toUpperCase();
      var targetKode = String(data.kodeItem || "").trim();
      
      if (kodeItem === targetKode && (rak === targetRak || !data.rak)) { 
        sheet.getRange(i + 1, 9).setValue(data.qtyRevisi);       // Col I: QTY Revisi
        sheet.getRange(i + 1, 10).setValue(data.petugasRevisi);  // Col J: Petugas Revisi
        sheet.getRange(i + 1, 11).setValue(data.statusRevisi);   // Col K: Status Revisi
        break;
      }
    }
    return ContentService.createTextOutput(JSON.stringify({status: "Success"}))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({status: "Error", error: err.toString()}))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

function doGet(e) {
  return ContentService.createTextOutput("Script Web App Revisi SO Aktif!");
}`}
                </pre>
                <button 
                  onClick={() => setShowScriptModal(false)}
                  className="w-full py-2 bg-slate-800 text-white rounded-xl font-bold mt-2"
                >
                  Tutup Panduan
                </button>
              </div>
            </div>
          )}

          {}
          {toastMsg && (
            <div className="fixed bottom-16 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-xs px-4 py-2.5 rounded-full shadow-xl backdrop-blur-md z-50 flex items-center gap-2 border border-slate-700 font-medium animate-bounce">
              <span>{toastMsg}</span>
            </div>
          )}

          {/* Navigation Bar */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 p-2 flex items-center justify-around z-30 shadow-lg">
            <button 
              onClick={() => setStatusFilter("ALL")}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${statusFilter === 'ALL' ? 'text-red-600' : 'text-slate-400'}`}
            >
              <i data-lucide="layout-grid" className="w-5 h-5"></i>
              Semua
            </button>
            <button 
              onClick={() => setStatusFilter("Belum Revisi")}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${statusFilter === 'Belum Revisi' ? 'text-amber-600' : 'text-slate-400'}`}
            >
              <i data-lucide="alert-circle" className="w-5 h-5"></i>
              Belum ({belumRevisiCount})
            </button>
            <button 
              onClick={() => setStatusFilter("Sudah Revisi")}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${statusFilter === 'Sudah Revisi' ? 'text-emerald-600' : 'text-slate-400'}`}
            >
              <i data-lucide="check-circle" className="w-5 h-5"></i>
              Sudah ({sudahRevisiCount})
            </button>
            <button 
              onClick={exportToCSV}
              className="flex flex-col items-center gap-0.5 text-[10px] font-bold text-slate-400 hover:text-slate-700"
            >
              <i data-lucide="download" className="w-5 h-5"></i>
              Export
            </button>
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

  </script>
