<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aplikasi Revisi SO Mobile (Spreadsheet & Supabase Bridge)</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .custom-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .custom-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .modal-animate {
      animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const DEFAULT_SPREADSHEET_ID = "10I100dl5URh59Y7hiwxBfW8cyWPBE1R0wDY75Q5XcqA";
    const DEFAULT_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxk8sBWXYGZghCvlGMkzsmP4uf8LWOaL6e9tkyBg1m237nKlHS0qjKK-4QO2q1Ewxxq/exec";

    const DEFAULT_OFFICERS = {
      "TIM 1": ["Wildan", "Budi Santoso", "Andi Wijaya", "Agus Pratama", "Rian Hidayat", "Dedi Kurniawan", "Asep"],
      "TIM 2": ["Rillo", "Eko Susilo", "Siti Aminah", "Hendra Saputra", "Maya Indah", "Rudi Hermawan", "Riki"]
    };

    const INITIAL_DEMO_ITEMS = [
      { id: 1, petugasAwal: "Wildan", rak: "RAK-1", kodeItem: "10401019", kodeOriginal: "8992771010024", namaItem: "PIGEON UV PROTECT REF+PUFF", tim1: 15, tim2: 12, selisih: 3, qtyRevisi: 11, petugasRevisi: "Asep (TIM 1)", status: "Sudah Revisi", keterangan: "salah kode dan tambahan" },
      { id: 2, petugasAwal: "Wildan", rak: "RAK-1", kodeItem: "102041076", kodeOriginal: "8710103838630", namaItem: "AVENT BTL NAT 260ML", tim1: 10, tim2: 8, selisih: 2, qtyRevisi: 8, petugasRevisi: "Riki (TIM 1)", status: "Sudah Revisi", keterangan: "" }
    ];

    function App() {
      // Config States
      const [spreadsheetId, setSpreadsheetId] = React.useState(() => localStorage.getItem("so_sheet_id") || DEFAULT_SPREADSHEET_ID);
      const [appsScriptUrl, setAppsScriptUrl] = React.useState(() => localStorage.getItem("so_script_url") || DEFAULT_APPS_SCRIPT_URL);
      const [supabaseUrl, setSupabaseUrl] = React.useState(() => localStorage.getItem("so_supabase_url") || "");
      const [supabaseKey, setSupabaseKey] = React.useState(() => localStorage.getItem("so_supabase_key") || "");
      const [supabaseClient, setSupabaseClient] = React.useState(null);

      // Data States
      const [items, setItems] = React.useState(INITIAL_DEMO_ITEMS);
      const [officers, setOfficers] = React.useState(DEFAULT_OFFICERS);
      const [searchQuery, setSearchQuery] = React.useState("");
      const [selectedRak, setSelectedRak] = React.useState("ALL");
      const [statusFilter, setStatusFilter] = React.useState("ALL");

      // UI Control States
      const [isLoading, setIsLoading] = React.useState(false);
      const [isSyncingSheet, setIsSyncingSheet] = React.useState(false);
      const [isConnectedToSupabase, setIsConnectedToSupabase] = React.useState(false);
      const [activeModalItem, setActiveModalItem] = React.useState(null);
      const [showSettingsModal, setShowSettingsModal] = React.useState(false);
      const [showSqlModal, setShowSqlModal] = React.useState(false);
      const [toastMsg, setToastMsg] = React.useState("");

      // Locked Session Officer State (Defaults to empty)
      const [sessionOfficer, setSessionOfficer] = React.useState(() => {
        try {
          const saved = localStorage.getItem("so_session_officer");
          return saved ? JSON.parse(saved) : null;
        } catch (e) { return null; }
      });

      const [showSessionModal, setShowSessionModal] = React.useState(() => {
        try { return !localStorage.getItem("so_session_officer"); } catch (e) { return true; }
      });

      // Temporary inputs for Session Lock (Team & Officer start EMPTY)
      const [tempSessionTeam, setTempSessionTeam] = React.useState("TIM 1");
      const [tempSessionOfficer, setTempSessionOfficer] = React.useState("");

      // Modal Inputs (Col I, J, K, L)
      const [qtyInput, setQtyInput] = React.useState("");
      const [notesInput, setNotesInput] = React.useState("");

      const triggerToast = React.useCallback((msg) => {
        setToastMsg(msg);
        setTimeout(() => { setToastMsg(""); }, 3500);
      }, []);

      React.useEffect(() => {
        if (supabaseUrl && supabaseKey && window.supabase) {
          try {
            const client = window.supabase.createClient(supabaseUrl, supabaseKey);
            setSupabaseClient(client);
            setIsConnectedToSupabase(true);
          } catch (e) {
            console.error("Gagal konek Supabase:", e);
            setIsConnectedToSupabase(false);
          }
        } else {
          setIsConnectedToSupabase(false);
        }
      }, [supabaseUrl, supabaseKey]);

      const fetchOfficersFromSheet = React.useCallback(async () => {
        try {
          const url = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv&sheet=Petugas`;
          const res = await fetch(url);
          if (res.ok) {
            const csvText = await res.text();
            const lines = csvText.split("\n").map(l => l.split(",").map(c => c.replace(/^"|"$/g, '').trim()));
            if (lines.length > 1) {
              const tim1List = [];
              const tim2List = [];
              
              lines.forEach((row, idx) => {
                if (idx === 0) return; // Header
                if (row[0]) tim1List.push(row[0]);
                if (row[1]) tim2List.push(row[1]);
              });

              setOfficers({
                "TIM 1": tim1List.filter(Boolean).length > 0 ? tim1List.filter(Boolean) : DEFAULT_OFFICERS["TIM 1"],
                "TIM 2": tim2List.filter(Boolean).length > 0 ? tim2List.filter(Boolean) : DEFAULT_OFFICERS["TIM 2"]
              });
            }
          }
        } catch (e) {
          console.warn("Gagal load petugas dari Spreadsheet, pakai fallback:", e);
        }
      }, [spreadsheetId]);

      const fetchFromSupabase = React.useCallback(async () => {
        if (!supabaseClient) return;
        setIsLoading(true);

        try {
          const { data: soData, error: soErr } = await supabaseClient.from('revisi_so').select('*').order('id', { ascending: true });
          if (!soErr && soData && soData.length > 0) {
            const mapped = soData.map(d => ({
              id: d.id,
              petugasAwal: d.petugas_awal || "",
              rak: d.rak || "",
              kodeItem: d.kode_item || "",
              kodeOriginal: d.kode_original || "",
              namaItem: d.nama_item || "",
              tim1: d.tim1 || 0,
              tim2: d.tim2 || 0,
              selisih: d.selisih !== undefined ? d.selisih : ((d.tim1 || 0) - (d.tim2 || 0)),
              qtyRevisi: d.qty_revisi !== undefined && d.qty_revisi !== null ? d.qty_revisi : null,
              petugasRevisi: d.petugas_revisi || "",
              status: d.status_revisi || (d.qty_revisi !== null ? "Sudah Revisi" : "Belum Revisi"),
              keterangan: d.keterangan || ""
            }));
            setItems(mapped);
          }
        } catch (err) {
          console.error("Supabase Fetch Error:", err);
        } finally {
          setIsLoading(false);
        }
      }, [supabaseClient]);

      const importYellowSheetToSupabase = async () => {
        setIsSyncingSheet(true);
        triggerToast("⏳ Membaca Data Kuning (A-H) dari Spreadsheet...");

        try {
          const csvUrl = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv&sheet=Revisi%20SO`;
          const res = await fetch(csvUrl);
          if (!res.ok) throw new Error("Gagal akses Spreadsheet");
          
          const csvText = await res.text();
          const rows = csvText.split("\n").map(line => {
            const matches = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
            return line.split(",").map(c => c.replace(/^"|"$/g, '').trim());
          });

          if (rows.length <= 1) {
            triggerToast("⚠️ Sheet 'Revisi SO' kosong atau format salah!");
            setIsSyncingSheet(false);
            return;
          }

          // Parse Data Kuning (Col A - H) & Data Merah (Col I - L) jika ada
          const parsedData = [];
          for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length < 3 || !row[2]) continue; // butuh kode item

            const tim1Val = parseInt(row[5], 10) || 0;
            const tim2Val = parseInt(row[6], 10) || 0;
            const selisihVal = row[7] !== "" ? parseInt(row[7], 10) : (tim1Val - tim2Val);
            const qtyRevVal = row[8] !== "" && row[8] !== undefined && !isNaN(parseInt(row[8], 10)) ? parseInt(row[8], 10) : null;

            parsedData.push({
              petugas_awal: row[0] || "",
              rak: row[1] || "",
              kode_item: String(row[2] || ""),
              kode_original: String(row[3] || ""),
              nama_item: row[4] || "",
              tim1: tim1Val,
              tim2: tim2Val,
              selisih: selisihVal,
              qty_revisi: qtyRevVal,
              petugas_revisi: row[9] || "",
              status_revisi: row[10] || (qtyRevVal !== null ? "Sudah Revisi" : "Belum Revisi"),
              keterangan: row[11] || ""
            });
          }

          if (supabaseClient && parsedData.length > 0) {
            // Upsert / Refresh Data di Supabase
            const { error } = await supabaseClient.from('revisi_so').upsert(parsedData, { onConflict: 'kode_item,rak' });
            if (error) {
              console.warn("Upsert error, mencoba insert standard:", error);
              await supabaseClient.from('revisi_so').insert(parsedData);
            }
            triggerToast("⚡ Data Kuning dari Sheet Berhasil Disinkronkan ke Supabase!");
            fetchFromSupabase();
          } else {
            // Fallback Local
            setItems(parsedData.map((d, idx) => ({
              id: idx + 1,
              petugasAwal: d.petugas_awal,
              rak: d.rak,
              kodeItem: d.kode_item,
              kodeOriginal: d.kode_original,
              namaItem: d.nama_item,
              tim1: d.tim1,
              tim2: d.tim2,
              selisih: d.selisih,
              qtyRevisi: d.qty_revisi,
              petugasRevisi: d.petugas_revisi,
              status: d.status_revisi,
              keterangan: d.keterangan
            })));
            triggerToast("💾 Data Kuning Dimuat ke Memori HP");
          }
        } catch (e) {
          console.error("Gagal Sync Sheet:", e);
          triggerToast("⚠️ Gagal membaca data dari Google Spreadsheet.");
        } finally {
          setIsSyncingSheet(false);
        }
      };

      React.useEffect(() => {
        fetchOfficersFromSheet();
        
        if (supabaseClient) {
          fetchFromSupabase();
          const channel = supabaseClient
            .channel('schema-db-changes')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'revisi_so' }, () => {
              fetchFromSupabase();
            })
            .subscribe();

          return () => { supabaseClient.removeChannel(channel); };
        }
      }, [supabaseClient, fetchOfficersFromSheet, fetchFromSupabase]);

      React.useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [items, activeModalItem, showSettingsModal, showSqlModal, showSessionModal, toastMsg, statusFilter, selectedRak, isConnectedToSupabase]);

      const handleSaveSession = (team, officerName) => {
        if (!team) {
          triggerToast("⚠️ Silakan pilih Tim terlebih dahulu!");
          return;
        }
        if (!officerName || officerName.trim() === "") {
          triggerToast("⚠️ Silakan pilih Nama Petugas!");
          return;
        }
        const sessionData = { name: officerName, team };
        setSessionOfficer(sessionData);
        try {
          localStorage.setItem("so_session_officer", JSON.stringify(sessionData));
        } catch (e) { console.warn("Error save session", e); }
        setShowSessionModal(false);
        triggerToast(`🔒 Sesi dikunci: ${officerName} (${team})`);
      };

      const handleTempTeamChange = (team) => {
        setTempSessionTeam(team);
        setTempSessionOfficer(""); // Reset nama petugas ke kosong
      };

      const openRevisionModal = (item) => {
        if (!sessionOfficer) {
          setShowSessionModal(true);
          triggerToast("⚠️ Kunci sesi nama petugas Anda terlebih dahulu!");
          return;
        }

        setActiveModalItem(item);
        setQtyInput(item.qtyRevisi !== null && item.qtyRevisi !== undefined ? String(item.qtyRevisi) : String(item.tim1 !== undefined ? item.tim1 : 0));
        setNotesInput(item.keterangan || "");
      };

      const saveRevision = async () => {
        if (!activeModalItem || !sessionOfficer) return;
        
        const finalOfficer = sessionOfficer.name;
        const selectedTeam = sessionOfficer.team;

        const parsedQty = parseInt(qtyInput, 10);
        if (isNaN(parsedQty) || parsedQty < 0) {
          triggerToast("⚠️ Jumlah QTY Revisi tidak valid");
          return;
        }

        const updatedOfficerName = `${finalOfficer} (${selectedTeam})`;
        const statusText = "Sudah Revisi";

        // 1. Local State Update
        const updatedItems = items.map(item => {
          if (item.id === activeModalItem.id) {
            return {
              ...item,
              qtyRevisi: parsedQty,
              petugasRevisi: updatedOfficerName,
              status: statusText,
              keterangan: notesInput
            };
          }
          return item;
        });
        setItems(updatedItems);

        // 2. Save to Supabase (Realtime across all mobile devices)
        if (supabaseClient) {
          try {
            await supabaseClient
              .from('revisi_so')
              .update({
                qty_revisi: parsedQty,
                petugas_revisi: updatedOfficerName,
                status_revisi: statusText,
                keterangan: notesInput,
                updated_at: new Date().toISOString()
              })
              .eq('id', activeModalItem.id);
          } catch (e) {
            console.error("Supabase Update Error:", e);
          }
        }

        // 3. Push Red Columns (I, J, K, L) to Google Spreadsheet via Apps Script Webhook
        if (appsScriptUrl) {
          try {
            fetch(appsScriptUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                rak: activeModalItem.rak,
                kodeItem: activeModalItem.kodeItem,
                qtyRevisi: parsedQty,             // Kolom I
                petugasRevisi: updatedOfficerName,// Kolom J
                statusRevisi: statusText,         // Kolom K
                keterangan: notesInput            // Kolom L
              })
            }).catch(err => console.warn("Apps Script Push warning:", err));

            triggerToast("⚡ Ter-update di Supabase & dikirim ke Spreadsheet!");
          } catch (e) {
            triggerToast("⚡ Tersimpan di Supabase!");
          }
        } else {
          triggerToast("⚡ Tersimpan di Supabase Realtime!");
        }

        setActiveModalItem(null);
      };

      const saveSettings = () => {
        try {
          localStorage.setItem("so_sheet_id", spreadsheetId.trim());
          localStorage.setItem("so_script_url", appsScriptUrl.trim());
          localStorage.setItem("so_supabase_url", supabaseUrl.trim());
          localStorage.setItem("so_supabase_key", supabaseKey.trim());
          setShowSettingsModal(false);
          triggerToast("💾 Pengaturan Tersimpan!");
        } catch (e) {
          triggerToast("⚠️ Gagal menyimpan konfigurasi");
        }
      };

      const rakList = React.useMemo(() => {
        const raks = items.map(i => i.rak).filter(Boolean);
        return ["ALL", ...Array.from(new Set(raks)).sort()];
      }, [items]);

      const filteredItems = items.filter(item => {
        const matchesSearch = 
          item.namaItem.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.kodeItem.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.kodeOriginal.toLowerCase().includes(searchQuery.toLowerCase()) ||
          item.rak.toLowerCase().includes(searchQuery.toLowerCase());
        
        const matchesRak = selectedRak === "ALL" || item.rak === selectedRak;
        const matchesStatus = statusFilter === "ALL" || item.status === statusFilter;

        return matchesSearch && matchesRak && matchesStatus;
      });

      const totalItems = items.length;
      const sudahRevisiCount = items.filter(i => i.status === "Sudah Revisi").length;
      const belumRevisiCount = totalItems - sudahRevisiCount;

      const exportToCSV = () => {
        let csvContent = "data:text/csv;charset=utf-8,";
        csvContent += "petugas,Rak,kode item,kode original,nama item,Tim1,Tim2,Selisih,QTY Revisi,Petugas Revisi,Status Revisi,Keterangan\n";
        
        items.forEach(i => {
          const row = [
            `"${i.petugasAwal || ''}"`,
            `"${i.rak || ''}"`,
            `"${i.kodeItem || ''}"`,
            `"${i.kodeOriginal || ''}"`,
            `"${i.namaItem || ''}"`,
            i.tim1,
            i.tim2,
            i.selisih,
            i.qtyRevisi !== null && i.qtyRevisi !== undefined ? i.qtyRevisi : "",
            `"${i.petugasRevisi || ''}"`,
            `"${i.status || ''}"`,
            `"${i.keterangan || ''}"`
          ].join(",");
          csvContent += row + "\n";
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `Revisi_SO_Full_${new Date().toISOString().slice(0,10)}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        triggerToast("📥 Unduh File CSV Berhasil");
      };

      return (
        <div className="max-w-md mx-auto min-h-screen bg-slate-50 flex flex-col shadow-xl relative pb-20">
          
          {/* Main Header */}
          <header className="bg-slate-900 text-white p-4 sticky top-0 z-30 shadow-md">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-emerald-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-emerald-500/30">
                  SO
                </div>
                <div>
                  <h1 className="font-bold text-base leading-tight flex items-center gap-1.5">
                    <span>Revisi SO Mobile</span>
                    <span className="text-[9px] bg-emerald-950 text-emerald-400 font-mono px-1.5 py-0.5 rounded border border-emerald-800">
                      Hybrid Bridge
                    </span>
                  </h1>
                  <p className="text-[11px] text-slate-400">Spreadsheet ↔️ Supabase Live</p>
                </div>
              </div>
              
              <div className="flex items-center gap-1.5">
                <button 
                  onClick={importYellowSheetToSupabase}
                  disabled={isSyncingSheet}
                  className="p-2 bg-emerald-800 hover:bg-emerald-700 active:scale-95 text-emerald-100 rounded-lg transition-all border border-emerald-600 flex items-center gap-1 text-xs font-bold"
                  title="Tarik Data Kuning (A-H) dari Spreadsheet"
                >
                  <i data-lucide="cloud-download" className={`w-4 h-4 ${isSyncingSheet ? 'animate-bounce text-amber-300' : ''}`}></i>
                  <span>Sync Sheet</span>
                </button>
                <button 
                  onClick={() => setShowSettingsModal(true)}
                  className="p-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-200 rounded-lg transition-all border border-slate-700 relative"
                  title="Pengaturan Koneksi"
                >
                  <i data-lucide="settings" className="w-4 h-4"></i>
                  {isConnectedToSupabase && (
                    <span className="w-2 h-2 rounded-full bg-emerald-400 absolute -top-0.5 -right-0.5 animate-ping"></span>
                  )}
                </button>
              </div>
            </div>

            {/* Active Locked Officer Bar */}
            <div className="mt-3 pt-2.5 border-t border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className={`w-2 h-2 rounded-full ${isConnectedToSupabase ? 'bg-emerald-400 animate-pulse' : 'bg-amber-400'}`}></span>
                <span className="text-xs font-semibold text-slate-300">
                  Sesi Petugas:
                </span>
                {sessionOfficer ? (
                  <span className="text-xs font-bold text-emerald-300 bg-emerald-950/80 px-2.5 py-0.5 rounded-full border border-emerald-800/80">
                    👤 {sessionOfficer.name} ({sessionOfficer.team})
                  </span>
                ) : (
                  <span className="text-xs text-amber-400 bg-amber-950/60 px-2 py-0.5 rounded-full border border-amber-800/50">
                    ⚠️ Belum dikunci
                  </span>
                )}
              </div>
              <button 
                onClick={() => setShowSessionModal(true)}
                className="text-[11px] font-bold text-emerald-400 hover:text-emerald-300 bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded-lg border border-slate-700 flex items-center gap-1 active:scale-95 transition-all"
              >
                <i data-lucide="user-check" className="w-3.5 h-3.5"></i>
                {sessionOfficer ? "Ganti" : "Kunci Sesi"}
              </button>
            </div>

            {/* Quick Metrics Bar */}
            <div className="grid grid-cols-3 gap-2 mt-3 text-center">
              <div className="bg-slate-800/80 rounded-lg p-2 border border-slate-700/50">
                <span className="text-[10px] uppercase tracking-wider text-slate-400 block font-medium">Total Item</span>
                <span className="text-lg font-bold text-white">{totalItems}</span>
              </div>
              <div className="bg-amber-950/40 rounded-lg p-2 border border-amber-800/40">
                <span className="text-[10px] uppercase tracking-wider text-amber-400 block font-medium">Belum Revisi</span>
                <span className="text-lg font-bold text-amber-400">{belumRevisiCount}</span>
              </div>
              <div className="bg-emerald-950/40 rounded-lg p-2 border border-emerald-800/40">
                <span className="text-[10px] uppercase tracking-wider text-emerald-400 block font-medium">Sudah Revisi</span>
                <span className="text-lg font-bold text-emerald-400">{sudahRevisiCount}</span>
              </div>
            </div>
          </header>

          {/* Search & Filter Section */}
          <section className="p-3 bg-white border-b border-slate-200 sticky top-[125px] z-20 shadow-sm space-y-2.5">
            <div className="relative">
              <i data-lucide="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
              <input 
                type="text"
                placeholder="Cari Rak, Nama, atau Kode Item..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}

              <div className="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl modal-animate space-y-3 max-h-[85vh] overflow-y-auto text-xs">
                <div className="flex items-center justify-between border-b pb-2">
                  <h3 className="font-bold text-slate-900 text-sm">Panduan SQL & Apps Script</h3>
                  <button onClick={() => setShowSqlModal(false)}><i data-lucide="x" className="w-4 h-4"></i></button>
                </div>
                
                <p className="font-bold text-emerald-800">1. SQL Supabase Editor:</p>
                <pre className="bg-slate-900 text-emerald-400 p-2.5 rounded-xl overflow-x-auto text-[9px] font-mono select-all">
{`CREATE TABLE IF NOT EXISTS revisi_so (
    id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
    petugas_awal TEXT,
    rak TEXT NOT NULL,
    kode_item TEXT NOT NULL,
    kode_original TEXT,
    nama_item TEXT NOT NULL,
    tim1 INT DEFAULT 0,
    tim2 INT DEFAULT 0,
    selisih INT DEFAULT 0,
    qty_revisi INT,
    petugas_revisi TEXT,
    status_revisi TEXT DEFAULT 'Belum Revisi',
    keterangan TEXT,
    CONSTRAINT unique_item_rak UNIQUE (kode_item, rak)
);

ALTER TABLE revisi_so ENABLE ROW LEVEL SECURITY;
CREATE POLICY "Public Access" ON revisi_so FOR ALL USING (true) WITH CHECK (true);
ALTER PUBLICATION supabase_realtime ADD TABLE revisi_so;`}
                </pre>

                <p className="font-bold text-emerald-800 pt-2">2. Google Apps Script (Update Col I, J, K, L):</p>
                <pre className="bg-slate-900 text-sky-300 p-2.5 rounded-xl overflow-x-auto text-[9px] font-mono select-all">
{`function doPost(e) {
  var data = JSON.parse(e.postData.contents);
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName("Revisi SO");
  var values = sheet.getDataRange().getValues();
  
  for (var i = 1; i < values.length; i++) {
    if (String(values[i][2]).trim() === String(data.kodeItem).trim()) {
      sheet.getRange(i + 1, 9).setValue(data.qtyRevisi);       // Col I
      sheet.getRange(i + 1, 10).setValue(data.petugasRevisi);  // Col J
      sheet.getRange(i + 1, 11).setValue(data.statusRevisi);   // Col K
      sheet.getRange(i + 1, 12).setValue(data.keterangan || ""); // Col L
      break;
    }
  }
  return ContentService.createTextOutput("OK");
}`}
                </pre>

                <button 
                  onClick={() => setShowSqlModal(false)}
                  className="w-full py-2 bg-slate-800 text-white rounded-xl font-bold mt-2"
                >
                  Tutup Panduan
                </button>
              </div>
            </div>
          )}

          {/* Toast Notification Alert */}
          {toastMsg && (
            <div className="fixed bottom-16 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-xs px-4 py-2.5 rounded-full shadow-xl backdrop-blur-md z-50 flex items-center gap-2 border border-slate-700 font-medium animate-bounce">
              <span>{toastMsg}</span>
            </div>
          )}

          {/* Bottom Bar Navigation */}
          <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white border-t border-slate-200 p-2 flex items-center justify-around z-30 shadow-lg">
            <button 
              onClick={() => setStatusFilter("ALL")}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${statusFilter === 'ALL' ? 'text-emerald-600' : 'text-slate-400'}`}
            >
              <i data-lucide="layout-grid" className="w-5 h-5"></i>
              Semua
            </button>
            <button 
              onClick={() => setStatusFilter("Belum Revisi")}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${statusFilter === 'Belum Revisi' ? 'text-amber-600' : 'text-slate-400'}`}
            >
              <i data-lucide="alert-circle" className="w-5 h-5"></i>
              Belum ({belumRevisiCount})
            </button>
            <button 
              onClick={() => setStatusFilter("Sudah Revisi")}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${statusFilter === 'Sudah Revisi' ? 'text-emerald-600' : 'text-slate-400'}`}
            >
              <i data-lucide="check-circle" className="w-5 h-5"></i>
              Sudah ({sudahRevisiCount})
            </button>
            <button 
              onClick={exportToCSV}
              className="flex flex-col items-center gap-0.5 text-[10px] font-bold text-slate-400 hover:text-slate-700"
            >
              <i data-lucide="download" className="w-5 h-5"></i>
              Export
            </button>
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
