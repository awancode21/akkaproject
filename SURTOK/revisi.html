    function Icon({ name, className = "w-4 h-4", ...props }) {
      const iconContent = SVG_ICONS[name] || SVG_ICONS['help-circle'];
      return (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={`shrink-0 ${className}`} {...props}>
          {iconContent}
        </svg>
      );
    }

    function parseCSVLine(text) {
      const result = [];
      let cur = '';
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === '"') {
          if (inQuotes && text[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          result.push(cur.trim());
          cur = '';
        } else {
          cur += char;
        }
      }
      result.push(cur.trim());
      return result;
    }

    // Accept either TIM1/TIM2 columns or a Tim + Nama Petugas table.
    function normalizeOfficerRows(rows) {
      const clean = value => String(value ?? '').replace(/^\uFEFF/, '').trim();
      const key = value => clean(value).toLowerCase().replace(/[^a-z0-9]/g, '');
      const result = { "TIM 1": [], "TIM 2": [] };
      const data = rows.map(row => row.map(clean)).filter(row => row.some(Boolean));
      if (!data.length) return result;
      const header = data[0].map(key);
      const c1 = header.indexOf('tim1'), c2 = header.indexOf('tim2');
      const teamColumn = header.findIndex(v => ['tim','team','kelompok'].includes(v));
      const nameColumn = header.findIndex(v => ['nama','petugas','namapetugas','petugasrevisi'].includes(v));
      const add = (team, name) => { if (name && !result[team].includes(name)) result[team].push(name); };
      if (teamColumn >= 0 && nameColumn >= 0) {
        data.slice(1).forEach(row => {
          const team = key(row[teamColumn]);
          if (['1','tim1','team1'].includes(team)) add('TIM 1', row[nameColumn]);
          if (['2','tim2','team2'].includes(team)) add('TIM 2', row[nameColumn]);
        });
      } else {
        const hasHeader = c1 >= 0 || c2 >= 0;
        (hasHeader ? data.slice(1) : data).forEach(row => {
          if (!hasHeader || c1 >= 0) add('TIM 1', row[hasHeader ? c1 : 0]);
          if (!hasHeader || c2 >= 0) add('TIM 2', row[hasHeader ? c2 : 1]);
        });
      }
      return result;
    }

    function fetchOfficerJSONP(sheetId) {
      return new Promise((resolve, reject) => {
        const handler = 'revisiPetugas_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        const script = document.createElement('script');
        let timer;
        const cleanup = () => { clearTimeout(timer); script.remove(); delete window[handler]; };
        window[handler] = response => {
          cleanup();
          if (response.status !== 'ok' || !response.table) { reject(new Error('Sheet Petugas belum dapat dibaca.')); return; }
          const rows = (response.table.rows || []).map(row => (row.c || []).map(cell => cell ? (cell.f ?? cell.v ?? '') : ''));
          const labels = (response.table.cols || []).map(col => col.label || '');
          if (labels.some(Boolean)) rows.unshift(labels);
          resolve(normalizeOfficerRows(rows));
        };
        script.onerror = () => { cleanup(); reject(new Error('Koneksi ke daftar petugas gagal.')); };
        script.src = 'https://docs.google.com/spreadsheets/d/' + encodeURIComponent(sheetId) + '/gviz/tq?sheet=Petugas&headers=0&tqx=' + encodeURIComponent('out:json;responseHandler:' + handler);
        timer = setTimeout(() => { cleanup(); reject(new Error('Waktu memuat petugas habis.')); }, 10000);
        document.head.appendChild(script);
      });
    }

    function safeInt(val, fallback = 0) {
      if (val === null || val === undefined || val === "") return fallback;
      const parsed = parseInt(String(val).replace(/[^0-9-]/g, ''), 10);
      return isNaN(parsed) ? fallback : parsed;
    }

    function App() {
      const [spreadsheetId, setSpreadsheetId] = React.useState(() => localStorage.getItem("so_sheet_id") || DEFAULT_SPREADSHEET_ID);
      const [appsScriptUrl, setAppsScriptUrl] = React.useState(() => localStorage.getItem("so_script_url") || DEFAULT_APPS_SCRIPT_URL);
      const [supabaseUrl, setSupabaseUrl] = React.useState(() => localStorage.getItem("so_supabase_url") || DEFAULT_SUPABASE_URL);
      const [supabaseKey, setSupabaseKey] = React.useState(() => localStorage.getItem("so_supabase_key") || DEFAULT_SUPABASE_KEY);
      const [supabaseClient, setSupabaseClient] = React.useState(null);

      const [items, setItems] = React.useState([]);
      const [officers, setOfficers] = React.useState(() => {
        try {
          const cached = JSON.parse(localStorage.getItem('revisi_officers_' + spreadsheetId));
          if (cached && Array.isArray(cached['TIM 1']) && Array.isArray(cached['TIM 2'])) return cached;
        } catch (error) {}
        return DEFAULT_OFFICERS;
      });
      const [officersLoading, setOfficersLoading] = React.useState(false);
      const [officersError, setOfficersError] = React.useState('');
      const [manualOfficer, setManualOfficer] = React.useState(false);
      const officersRequest = React.useRef(0);
      const [searchQuery, setSearchQuery] = React.useState("");
      const [selectedRak, setSelectedRak] = React.useState("ALL");
      const [statusFilter, setStatusFilter] = React.useState("ALL");

      const [isSyncingSheet, setIsSyncingSheet] = React.useState(false);
      const [isConnectedToSupabase, setIsConnectedToSupabase] = React.useState(false);
      const [activeModalItem, setActiveModalItem] = React.useState(null);
      const [showSettingsModal, setShowSettingsModal] = React.useState(false);
      const [toastMsg, setToastMsg] = React.useState("");

      const [sessionOfficer, setSessionOfficer] = React.useState(() => {
        try {
          const saved = localStorage.getItem("so_session_officer");
          return saved ? JSON.parse(saved) : null;
        } catch (e) { return null; }
      });

      const [showSessionModal, setShowSessionModal] = React.useState(() => {
        try { return !localStorage.getItem("so_session_officer"); } catch (e) { return true; }
      });

      const [tempSessionTeam, setTempSessionTeam] = React.useState("TIM 1");
      const [tempSessionOfficer, setTempSessionOfficer] = React.useState("");

      const [qtyInput, setQtyInput] = React.useState("");
      const [notesInput, setNotesInput] = React.useState("");

      const triggerToast = React.useCallback((msg) => {
        setToastMsg(msg);
        setTimeout(() => { setToastMsg(""); }, 3500);
      }, []);

      React.useEffect(() => {
        if (supabaseUrl && supabaseKey && window.supabase) {
          try {
            const client = window.supabase.createClient(supabaseUrl, supabaseKey, {
              realtime: { enabled: false }
            });
            setSupabaseClient(client);
            setIsConnectedToSupabase(true);
          } catch (e) {
            setIsConnectedToSupabase(false);
          }
        } else {
          setIsConnectedToSupabase(false);
        }
      }, [supabaseUrl, supabaseKey]);

      const fetchOfficersFromSheet = React.useCallback(async () => {
        const request = ++officersRequest.current;
        setOfficersLoading(true);
        setOfficersError('');
        let cached = DEFAULT_OFFICERS;
        try {
          const saved = JSON.parse(localStorage.getItem('revisi_officers_' + spreadsheetId));
          if (saved && Array.isArray(saved['TIM 1']) && Array.isArray(saved['TIM 2'])) cached = saved;
        } catch (error) {}
        setOfficers(cached);
        const valid = list => list && (list['TIM 1'].length + list['TIM 2'].length > 0);
        try {
          let loaded;
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 10000);
          try {
            const url = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(spreadsheetId)}/gviz/tq?tqx=out:csv&sheet=Petugas&headers=0`;
            const res = await fetch(url, { signal: controller.signal });
            if (!res.ok) throw new Error('Tidak dapat membaca sheet Petugas.');
            const csv = await res.text();
            if (/^\s*</.test(csv)) throw new Error('Sheet Petugas belum dapat diakses.');
            loaded = normalizeOfficerRows(csv.split(/\r?\n/).filter(line => line.trim()).map(parseCSVLine));
            if (!valid(loaded)) throw new Error('Daftar petugas kosong.');
          } catch (error) {
            // Google Visualization JSONP also works when CSV fetch is blocked by CORS.
            loaded = await fetchOfficerJSONP(spreadsheetId);
          } finally { clearTimeout(timer); }
          if (!valid(loaded)) throw new Error('Nama petugas belum terisi pada sheet Petugas.');
          if (request !== officersRequest.current) return;
          setOfficers(loaded);
          try { localStorage.setItem('revisi_officers_' + spreadsheetId, JSON.stringify(loaded)); } catch (error) {}
        } catch (error) {
          if (request === officersRequest.current) setOfficersError(valid(cached)
            ? 'Daftar terbaru gagal dimuat. Daftar tersimpan masih bisa dipilih.'
            : 'Daftar petugas gagal dimuat. Tekan Muat ulang atau isi nama manual. Pastikan sheet Petugas dapat diakses.');
        } finally {
          if (request === officersRequest.current) setOfficersLoading(false);
        }
      }, [spreadsheetId]);

      React.useEffect(() => { fetchOfficersFromSheet(); }, [fetchOfficersFromSheet]);

      const fetchFromSupabase = React.useCallback(async () => {
        if (!supabaseClient) return;
        try {
          const { data: soData, error: soErr } = await supabaseClient.from('revisi_so').select('*').order('id', { ascending: true });
          if (!soErr && soData && soData.length > 0) {
            const mapped = soData.map(d => {
              const rawStatus = d.status_revisi ? String(d.status_revisi).trim() : "";
              const hasQty = d.qty_revisi !== null && d.qty_revisi !== undefined && String(d.qty_revisi).trim() !== "";
              const computedStatus = (rawStatus !== "" && rawStatus.toLowerCase() !== "belum revisi" && rawStatus.toLowerCase() !== "") ? rawStatus : (hasQty ? "Sudah Revisi" : "Belum Revisi");

              return {
                id: d.id,
                petugasAwal: d.petugas_awal || "",
                rak: d.rak || "",
                kodeItem: d.kode_item || "",
                kodeOriginal: d.kode_original || "",
                namaItem: d.nama_item || "",
                tim1: safeInt(d.tim1, 0),
                tim2: safeInt(d.tim2, 0),
                selisih: d.selisih !== undefined && d.selisih !== null ? safeInt(d.selisih, 0) : (safeInt(d.tim1, 0) - safeInt(d.tim2, 0)),
                qtyRevisi: hasQty ? safeInt(d.qty_revisi, 0) : null,
                petugasRevisi: d.petugas_revisi || "",
                status: computedStatus,
                keterangan: d.keterangan || ""
              };
            });
            setItems(mapped);
          }
        } catch (err) {}
      }, [supabaseClient]);

      const importYellowSheetToSupabase = React.useCallback(async (isAuto = false) => {
        setIsSyncingSheet(true);
        if (!isAuto) triggerToast("⏳ Menyinkronkan data master kuning dari Spreadsheet ke Supabase...");

        try {
          const csvUrl = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv&sheet=Revisi%20SO`;
          const res = await fetch(csvUrl);
          if (!res.ok) throw new Error("Gagal akses Spreadsheet");
          
          const csvText = await res.text();
          if (csvText.startsWith("<!DOCTYPE") || csvText.includes("<html")) {
            if (!isAuto) triggerToast("⚠️ Spreadsheet private! Set Share: Anyone with link.");
            setIsSyncingSheet(false);
            return;
          }

          const lines = csvText.split(/\r?\n/);
          if (lines.length <= 1) {
            if (supabaseClient) {
              await supabaseClient.from('revisi_so').delete().neq('id', 0);
              setItems([]);
              if (!isAuto) triggerToast("🧹 Sheet 'Revisi SO' kosong! Data Supabase ikut dikosongkan.");
            } else {
              if (!isAuto) triggerToast("⚠️ Sheet 'Revisi SO' kosong!");
            }
            setIsSyncingSheet(false);
            return;
          }

          const parsedData = [];
          for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const row = parseCSVLine(lines[i]);
            if (!row || row.length < 3 || !row[2]) continue;

            const tim1Val = safeInt(row[5], 0);
            const tim2Val = safeInt(row[6], 0);
            const selisihVal = row[7] !== "" && row[7] !== undefined ? safeInt(row[7], (tim1Val - tim2Val)) : (tim1Val - tim2Val);
            
            const rawQtyRev = row[8];
            const qtyRevVal = (rawQtyRev !== "" && rawQtyRev !== undefined && !isNaN(parseInt(rawQtyRev, 10))) ? safeInt(rawQtyRev, 0) : null;
            
            const rawStatus = row[10] ? String(row[10]).trim() : "";
            const computedStatus = (rawStatus !== "" && rawStatus.toLowerCase() !== "belum revisi" && rawStatus.toLowerCase() !== "") ? rawStatus : (qtyRevVal !== null && qtyRevVal !== undefined && !isNaN(qtyRevVal) ? "Sudah Revisi" : "Belum Revisi");

            parsedData.push({
              petugas_awal: row[0] || "",
              rak: row[1] || "",
              kode_item: String(row[2] || ""),
              kode_original: String(row[3] || ""),
              nama_item: row[4] || "",
              tim1: tim1Val,
              tim2: tim2Val,
              selisih: selisihVal,
              qty_revisi: qtyRevVal,
              petugas_revisi: row[9] || "",
              status_revisi: computedStatus,
              keterangan: row[11] || ""
            });
          }

          if (supabaseClient) {
            const { data: existingData } = await supabaseClient.from('revisi_so').select('id, kode_item, rak, qty_revisi, petugas_revisi, status_revisi, keterangan');
            const existingMap = new Map();
            if (existingData) {
              existingData.forEach(item => {
                existingMap.set(`${item.kode_item}_${item.rak}`, item);
              });
            }

            const mergedData = parsedData.map(item => {
              const key = `${item.kode_item}_${item.rak}`;
              const existing = existingMap.get(key);
              if (existing && existing.status_revisi === 'Sudah Revisi' && (item.qty_revisi === null || item.qty_revisi === undefined)) {
                return {
                  ...item,
                  qty_revisi: existing.qty_revisi,
                  petugas_revisi: existing.petugas_revisi,
                  status_revisi: existing.status_revisi,
                  keterangan: existing.keterangan
                };
              }
              return item;
            });

            const uniqueMergedMap = new Map();
            mergedData.forEach(item => {
              uniqueMergedMap.set(`${item.kode_item}_${item.rak}`, item);
            });
            const deduplicatedMergedData = Array.from(uniqueMergedMap.values());

            const { error } = await supabaseClient.from('revisi_so').upsert(deduplicatedMergedData, { onConflict: 'kode_item,rak' });
            
            // Clean up records in Supabase that are no longer present in the Google Spreadsheet yellow columns
            const sheetKeys = new Set(deduplicatedMergedData.map(d => `${d.kode_item}_${d.rak}`));
            if (existingData) {
              const idsToDelete = existingData
                .filter(e => !sheetKeys.has(`${e.kode_item}_${e.rak}`))
                .map(e => e.id);
              
              if (idsToDelete.length > 0) {
                await supabaseClient.from('revisi_so').delete().in('id', idsToDelete);
              }
            }

            if (error) {
              if (!isAuto) triggerToast(`⚠️ Supabase Upsert Warning: ${error.message}`);
            } else {
              if (!isAuto) triggerToast("⚡ Data Master Kuning Berhasil Disinkronkan ke Supabase!");
            }
            fetchFromSupabase();
          } else {
            setItems(parsedData.map((d, idx) => ({
              id: idx + 1,
              petugasAwal: d.petugas_awal,
              rak: d.rak,
              kodeItem: d.kode_item,
              kodeOriginal: d.kode_original,
              namaItem: d.nama_item,
              tim1: d.tim1,
              tim2: d.tim2,
              selisih: d.selisih,
              qtyRevisi: d.qty_revisi,
              petugasRevisi: d.petugas_revisi,
              status: d.status_revisi,
              keterangan: d.keterangan
            })));
            if (!isAuto) triggerToast("💾 Data Dimuat ke Memori");
          }
        } catch (e) {
          if (!isAuto) triggerToast("⚠️ Gagal membaca spreadsheet.");
        } finally {
          setIsSyncingSheet(false);
        }
      }, [spreadsheetId, supabaseClient, fetchFromSupabase, triggerToast]);

      React.useEffect(() => {
        if (supabaseClient) {
          importYellowSheetToSupabase(true).then(() => {
            fetchFromSupabase();
          });
        }
      }, [supabaseClient, fetchFromSupabase, importYellowSheetToSupabase]);

      const clearSupabaseData = async () => {
        if (!supabaseClient) {
          triggerToast("⚠️ Supabase belum terhubung!");
          return;
        }
        
        const currentOfficerName = sessionOfficer ? sessionOfficer.name.trim().toLowerCase() : "";
        if (currentOfficerName !== "asep") return;

        if (!confirm("⚠️ Apakah Anda yakin ingin mengosongkan seluruh data revisi SO di Supabase?")) return;
        
        try {
          const { error } = await supabaseClient.from('revisi_so').delete().neq('id', 0);
          if (error) throw error;
          setItems([]);
          triggerToast("🗑️ Berhasil mengosongkan seluruh data di Supabase!");
          setShowSettingsModal(false);
        } catch (e) {
          triggerToast("⚠️ Gagal mengosongkan data: " + e.message);
        }
      };

      const handleSaveSession = (team, officerName) => {
        if (!team) {
          triggerToast("⚠️ Silakan pilih Tim!");
          return;
        }
        if (!officerName || officerName.trim() === "") {
          triggerToast("⚠️ Silakan pilih Nama Petugas!");
          return;
        }
        const sessionData = { name: officerName.trim(), team };
        setSessionOfficer(sessionData);
        try {
          localStorage.setItem("so_session_officer", JSON.stringify(sessionData));
        } catch (e) {}
        setShowSessionModal(false);
        triggerToast(`🔒 Sesi dikunci: ${officerName} (${team})`);
      };

      const openRevisionModal = (item) => {
        if (!sessionOfficer) {
          setShowSessionModal(true);
          triggerToast("⚠️ Kunci sesi nama petugas Anda terlebih dahulu!");
          return;
        }
        setActiveModalItem(item);
        setQtyInput(item.qtyRevisi !== null && item.qtyRevisi !== undefined ? String(item.qtyRevisi) : "");
        setNotesInput(item.keterangan || "");
      };

      const saveRevision = async (isClear = false) => {
        if (!activeModalItem || !sessionOfficer) return;
        
        const finalOfficer = sessionOfficer.name;
        const selectedTeam = sessionOfficer.team;
        const parsedQty = isClear ? null : (qtyInput !== "" ? parseInt(qtyInput, 10) : null);
        if (!isClear && (isNaN(parsedQty) || parsedQty < 0)) {
          triggerToast("⚠️ QTY Revisi tidak valid");
          return;
        }

        const updatedOfficerName = isClear ? "" : `${finalOfficer} (${selectedTeam})`;
        const statusText = isClear ? "Belum Revisi" : "Sudah Revisi";
        const finalNotes = isClear ? "" : notesInput;

        const updatedItems = items.map(item => {
          if (item.id === activeModalItem.id) {
            return {
              ...item,
              qtyRevisi: parsedQty,
              petugasRevisi: updatedOfficerName,
              status: statusText,
              keterangan: finalNotes
            };
          }
          return item;
        });
        setItems(updatedItems);

        if (supabaseClient) {
          try {
            await supabaseClient
              .from('revisi_so')
              .update({
                qty_revisi: parsedQty,
                petugas_revisi: updatedOfficerName,
                status_revisi: statusText,
                keterangan: finalNotes,
                updated_at: new Date().toISOString()
              })
              .eq('id', activeModalItem.id);
          } catch (e) {}
        }

        if (appsScriptUrl) {
          try {
            fetch(appsScriptUrl, {
              method: 'POST',
              mode: 'no-cors',
              body: JSON.stringify({
                rak: activeModalItem.rak,
                kodeItem: activeModalItem.kodeItem,
                qtyRevisi: parsedQty !== null ? parsedQty : "",
                petugasRevisi: updatedOfficerName,
                statusRevisi: statusText,
                keterangan: finalNotes
              })
            }).catch(err => {});
          } catch (e) {}
        }

        triggerToast(isClear ? "🧹 Revisi dikosongkan & diperbarui ke Sheet!" : "⚡ Tersimpan ke Supabase & Google Spreadsheet!");

                    </div>
                    <div className="flex gap-1.5 mt-2">
                      <button type="button" onClick={() => setQtyInput(activeModalItem.tim1.toString())} className="flex-1 py-1 text-[11px] bg-slate-100 border rounded-lg text-slate-600">Ikut Tim1 ({activeModalItem.tim1})</button>
                      <button type="button" onClick={() => setQtyInput(activeModalItem.tim2.toString())} className="flex-1 py-1 text-[11px] bg-slate-100 border rounded-lg text-slate-600">Ikut Tim2 ({activeModalItem.tim2})</button>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">2. Keterangan / Alasan Revisi &rarr; <span className="text-rose-700 font-bold">Kolom L</span>:</label>
                    <textarea 
                      rows="2"
                      value={notesInput}
                      onChange={(e) => setNotesInput(e.target.value)}
                      placeholder="Contoh: salah kode dan tambahan..."
                      className="w-full bg-slate-50 border border-slate-200 rounded-xl p-2.5 text-xs text-slate-800"
                    ></textarea>
                  </div>
                </div>

                <div className="flex gap-2 pt-2">
                  <button type="button" onClick={() => saveRevision(true)} className="py-3 px-4 border border-rose-300 text-rose-700 bg-rose-50 hover:bg-rose-100 rounded-xl font-bold text-xs">Kosongkan Revisi</button>
                  <button type="button" onClick={() => saveRevision(false)} className="flex-1 py-3 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-bold text-xs shadow-lg flex items-center justify-center gap-1.5">
                    <Icon name="check" className="w-4 h-4" /> Simpan Revisi
                  </button>
                </div>
              </div>
            </div>
          )}

          {showSettingsModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white w-full max-w-md rounded-2xl p-5 shadow-2xl modal-animate space-y-4 max-h-[85vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b pb-3">
                  <h3 className="font-bold text-slate-900 text-base flex items-center gap-2">
                    <Icon name="settings" className="w-5 h-5 text-rose-600" /> Pengaturan Integrasi
                  </h3>
                  <button onClick={() => setShowSettingsModal(false)}><Icon name="x" className="w-5 h-5" /></button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Google Spreadsheet ID:</label>
                    <input type="text" value={spreadsheetId} onChange={(e) => setSpreadsheetId(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2.5 font-mono" />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Apps Script Webhook URL:</label>
                    <input type="url" value={appsScriptUrl} onChange={(e) => setAppsScriptUrl(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2.5 font-mono" />
                  </div>
                  <div className="pt-2 border-t">
                    <label className="block font-bold text-slate-700 mb-1">Supabase Project URL:</label>
                    <input type="url" value={supabaseUrl} onChange={(e) => setSupabaseUrl(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2.5 font-mono" />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Supabase Anon Key:</label>
                    <input type="password" value={supabaseKey} onChange={(e) => setSupabaseKey(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2.5 font-mono" />
                  </div>
                  <button onClick={saveSettings} className="w-full py-2.5 bg-rose-600 text-white rounded-xl font-bold">Simpan Pengaturan</button>
                  
                  {isUserAsep && (
                    <button onClick={clearSupabaseData} className="w-full py-2.5 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold flex items-center justify-center gap-2 mt-2">
                      <Icon name="trash" className="w-4 h-4" /> Kosongkan Data di Supabase
                    </button>
                  )}

                  <button onClick={exportToCSV} className="w-full py-2.5 bg-slate-800 text-white rounded-xl text-xs font-bold flex items-center justify-center gap-2">
                    <Icon name="download" className="w-4 h-4" /> Export Seluruh Data ke CSV
                  </button>
                </div>
              </div>
            </div>
          )}

          {toastMsg && (
            <div className="fixed bottom-24 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white text-xs px-4 py-2.5 rounded-full shadow-xl z-[70] flex items-center gap-2 border border-slate-700 font-medium animate-bounce">
              <span>{toastMsg}</span>
            </div>
          )}

          <nav className="bottom-nav fixed bottom-0 left-0 right-0 mx-auto bg-white border-t border-slate-200 p-2 flex items-center justify-around z-30 shadow-lg">
            <button onClick={() => setStatusFilter("ALL")} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${statusFilter === 'ALL' ? 'text-rose-600' : 'text-slate-400'}`}>
              <Icon name="layout-grid" className="w-5 h-5" /> Semua
            </button>
            <button onClick={() => setStatusFilter("Belum Revisi")} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${statusFilter === 'Belum Revisi' ? 'text-yellow-700' : 'text-slate-400'}`}>
              <Icon name="alert-circle" className="w-5 h-5" /> Belum ({belumRevisiCount})
            </button>
            <button onClick={() => setStatusFilter("Sudah Revisi")} className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${statusFilter === 'Sudah Revisi' ? 'text-green-600' : 'text-slate-400'}`}>
              <Icon name="check-circle" className="w-5 h-5" /> Sudah ({sudahRevisiCount})
            </button>
            <button onClick={exportToCSV} className="flex flex-col items-center gap-0.5 text-[10px] font-bold text-slate-400 hover:text-slate-700">
              <Icon name="download" className="w-5 h-5" /> Export
            </button>
          </nav>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
